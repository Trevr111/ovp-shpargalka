<script>
var TICKETS = {"1": "<p><b>1 Вопрос Законодательная основа общевоинских уставов ВС РФ и их требования.</b></p><p>Всего есть 5 уставов:</p><p class=\"li\">1)\tУстав внутренней службы;</p><p class=\"li\">2)\tДисциплинарный устав;</p><p class=\"li\">3)\tУстав гарнизонной и караульной службы;</p><p class=\"li\">4)\tСтроевой устав.</p><p class=\"li\">5)\tУстав военной полиции.</p><p>Общевоинские уставы ВС РФ Утверждены Указом Президента РФ от 10 ноября 2007 года.</p><p><b>Устав внутренней </b>службы определяет права и обязанности военнослужащих и взаимоотношения между ними, обязанности основных должностных лиц полка и его подразделений, а также правила внутреннего порядка.</p><p><b>Дисциплинарный устав</b> определяет сущность воинской дисциплины, обязанности военнослужащих по ее соблюдению, виды поощрений и дисциплинарных взысканий, права командиров (начальников) по их применению, а также порядок подачи и рассмотрения предложений, заявлений и жалоб.</p><p><b>Устав гарнизонной и караульной служб</b> определяет предназначение, порядок организации и несения гарнизонной и караульной служб, права и обязанности должностных лиц гарнизона и военнослужащих, несущих эти службы, а также регламентирует проведение гарнизонных мероприятий с участием войск.</p><p><b>Строевой устав </b>определяет строевые приемы и движение без оружия и с оружием; строи подразделений и воинских частей в пешем порядке и на машинах; порядок выполнения воинского приветствия, проведения строевого смотра; положение Боевого Знамени воинской части в строю, порядок его выноса и относа; обязанности военнослужащих перед построением и в строю.</p><p>Строевой устав введен в действие приказом Министра обороны РФ от 11 марта 2006 года № 111</p><p><b>2</b>. Порядок хранения оружия и боеприпасов в подразделении.</p><p>Стрелковое оружие и боеприпасы, в том числе учебные, в подразделениях хранятся в отдельной комнате с металлическими решетками на окнах, находящейся под постоянной охраной лиц суточного наряда и оборудованной техническими средствами охраны. Дверь комнаты должна быть металлической, решетчатой.</p><ul><li>Пулеметы, автоматы, карабины, винтовки, ручные гранатометы – хранятся в пирамидах</li></ul><ul><li>Пистолеты и боеприпасы – в металлических шкафах или ящиках с замком</li></ul><ul><li>Учебное оружие – хранится отдельно от боевых и обозначается «Учебное оружие»</li></ul><p>Пирамиды с оружием и ящики с пистолетами и боеприпасами, а также комната для хранения оружия должны закрываться на замки и опечатываться мастичными печатями:</p><ul><li>Пирамиды и комната – печатью дежурного по роте</li></ul><ul><li>Шкафы и ящики с пистолетами и боеприпасами – печатью старшины роты</li></ul><p>Первый экземпляр ключей хранится у дежурного по роте. Второй и третий экземпляры хранятся у командира роты в опечатанном тубусе в закрытом металлическом ящике с замком.</p><p>В комнате с оружия должно производиться опись оружия и боеприпасов. Опись подписывается командиром роты</p><p><b>3. </b>Т<b>ребования, предъявляемые к военно-профессиональной подготовке офицеров (сержантов) запаса.</b></p><p><b>Иметь представление о:</b></p><ul><li>Военной доктрине Российской Федерации, о характере вооруженной борьбы в войнах и вооруженных конфликтах, основах применения в них войск;</li></ul><ul><li>структуре и предназначении видов и родов войск Вооруженных Сил Российской</li></ul><p>Федерации; - о тенденциях развития тактики в современных условиях;</p><ul><li>особенностях боевых действий артиллерийских подразделений в локальных войнах и вооруженных конфликтах;</li></ul><ul><li>техническом, тыловом и морально-психологическом обеспечении боевых действий;</li></ul><ul><li>организационно-штатной структуре, вооружении и тактике действий частей и подразделений иностранных армий;</li></ul><ul><li>способах перевозки артиллерийских подразделений;</li></ul><ul><li>действиях артиллерийских подразделений в особых условиях;</li></ul><ul><li>применении индивидуальных средств очистки воды в полевых условиях;</li></ul><ul><li>организации связи в артиллерийском дивизионе;</li></ul><ul><li>значимости медицинского обеспечения подразделений в деле повышения их боеготовности и боеспособности</li></ul><p><b>Знать:</b></p><ul><li>основные факторы, определяющие характер и способы ведения боя;</li></ul><ul><li>сущность, виды, характерные черты и основные принципы ведения боя;</li></ul><ul><li>силы и средства ведения боя общевойсковыми подразделениями;</li></ul><ul><li>организацию, ТТХ основных образцов вооружения и тактику действий общевойсковых и артиллерийских подразделений Сухопутных войск;</li></ul><ul><li>организацию, ТТХ основных образцов вооружения и основы тактики действий подразделений армий США и Германии (до батальона включительно);</li></ul><ul><li>сущность, содержание и основные принципы управления артиллерийскими подразделениями в бою, требования, предъявляемые к ним;</li></ul><ul><li>основы боевого применения артиллерийских подразделений, группировку артиллерии, боевой порядок артиллерийских подразделений;</li></ul><ul><li>способы передвижения подразделений, основы организации и совершения марша артиллерийской батареей и расположения ее на месте;</li></ul><ul><li>содержание мероприятий по всестороннему обеспечению боевых действий артиллерийских подразделений (взвод, батарея);</li></ul><ul><li>общие положения по основам подготовки и ведения оборонительного и наступательного боя;</li></ul><ul><li>действия мотострелка и мотострелкового отделения в основных видах боя;</li></ul><ul><li>последовательность, организацию и способы выполнения основных задач инженерного оборудования огневых позиций, мест расположения КНП и районов сосредоточения артиллерийских подразделений, инженерные мероприятия, порядок применения минновзрывных заграждений и организацию преодоления минно-взрывных заграждений противника;</li></ul><ul><li>штатные средства и организацию связи в артиллерийских подразделениях;</li></ul><ul><li>индивидуальное медицинское оснащение.</li></ul><p><b>Уметь:</b></p><ul><li>оценивать обстановку и прогнозировать ее изменение, правильно учитывать факторы, влияющие на ход и исход боя;</li></ul><ul><li>принимать целесообразные решения и ставить задачи подчиненным;</li></ul><ul><li>проводить расчеты по планированию развертывания батареи в боевой порядок и ее перемещению в ходе боя;</li></ul><ul><li>организовывать боевые действия артиллерийских подразделений (батареи, взвода) и управлять ими в различных условиях боевой обстановки;</li></ul><ul><li>устанавливать минно-взрывные заграждения для прикрытия районов расположения и огневых позиций;</li></ul><ul><li>разрабатывать и вести боевые документы;</li></ul><ul><li>работать на штатных артиллерийских приборах и средствах связи батареи;</li></ul><ul><li>использовать индивидуальное медицинское оснащение военнослужащего.</li></ul><p><b>4.</b> <b>Источники военной опасности. Задачи государства в области обеспечения военной безопасности.</b></p><p><b>Военная безопасность </b>– это составная часть и важнейший компонент национальной безопасности, которая определяется состоянием обороноспособности страны и ее возможностями по обеспечению защиты национальных интересов Вооруженными силами</p><p>Главные цели обеспечения военной безопасности - предотвращение, локализация и нейтрализация военных угроз Рос­сийской Федерации.</p><p>Угрозы военной безопасности государства классифицируют на две группы:</p><p class=\"li\">1.\t<b>Внешние:</b></p><ul><li>Международный терроризм</li></ul><ul><li>Размещение вблизи границ России вооруженных сил НАТО</li></ul><ul><li>Вооруженный конфликт на Украине</li></ul><ul><li>Наличие у многих стран ядерного оружия</li></ul><ul><li>Периодическое возникновение военных вооруженных конфликтов</li></ul><ul><li>Политика Северной Кореи по наращиванию ядерного потенциала</li></ul><p class=\"li\">2.\t<b>Внутренние:</b></p><ul><li>Социальная напряженность в обществе – пропасть между богатыми и бедными</li></ul><ul><li>Разрыв уровня экономики между регионами страны</li></ul><ul><li>Сепаратистские взгляды отдельных территорий</li></ul><ul><li>Межнациональная напряженность</li></ul><ul><li>Демографические проблемы</li></ul><ul><li>Деятельность пятой колонны – иностранных организация</li></ul><ul><li>Рост безработицы</li></ul><p><b>Решение задач России в области обеспечения военной безопасности предполагает:</b></p><ul><li>обеспечение вооруженной защиты, территориальной целостности, национальной независимости и суверенитета государства</li></ul><ul><li>создание военных гарантий стабильности общественного и государственного строя, поддержание гражданского мира в стране</li></ul><ul><li>пресечение террористических действий</li></ul><p>В своей политике по обеспечению военной безопасности руководство РФ опирается на Военную доктрину</p>", "2": "<p><b>1. Предназначение и требования внутренней службы. Руководство внутренней службой (статьи </b>1–4<b>).</b></p><p><b>1)</b>\t<b>Внутренняя служба </b>предназначена для поддержания в воинской части внутреннего порядка и воинской дисциплины, обеспечивающих ее постоянную боевую готовность, безопасность военной службы, учебу личного состава, организованное выполнение им других задач в повседневной деятельности и охрану здоровья военнослужащих.</p><p class=\"li\">2)\t<b>Внутренняя служба требует</b> организованных действий военнослужащих независимо от их желаний. (Выполнение требований внутренней службы развивает у военнослужащих чувство ответственности, самостоятельность, аккуратность и добросовестность. Взаимопонимание, доброжелательность и готовность помочь друг другу способствуют укреплению войскового товарищества и сплочению воинских коллективов, позволяют выполнять задачи в повседневной деятельности и выдерживать тяжелые испытания в боевой обстановке.)</p><p class=\"li\">3)\t<b>Требования внутренней службы</b> обязан знать и добросовестно выполнять каждый военнослужащий</p><p class=\"li\">4)\t<b>Руководство внутренней службой</b> в воинской части осуществляет командир воинской части, а в расположении подразделения - командир подразделения. (При размещении в одном помещении нескольких подразделений руководство внутренней службой возлагается на командира одного из этих подразделений). Непосредственным организатором внутренней службы в воинской части является начальник штаба, а в расположении роты - старшина роты.</p><p><b>2. Порядок получения и сдачи стрелкового оружия и боеприпасов в</b> <b>комнате для хранения оружия.</b></p><p>Оружие личному составу, кроме пистолетов, выдается дежурным по роте по приказанию командира (старшины) роты, а пистолеты солдатам и сержантам</p><p>– старшиной роты только с разрешения командира роты.</p><p>Оружие и боеприпасы одиночным военнослужащим выдаются под их личную роспись в книге выдачи оружия и боеприпасов.</p><p>При выходе подразделений по тревоге, на учения или занятия, а также при выдаче для чистки за полученное оружие и боеприпасы расписывается в книге командир подразделения или его заместитель, а при заступлении в караул</p><p>– начальник караула.</p><p>В целях ускорения выдачи стрелкового оружия и боеприпасов на случай тревоги в книге, в специально отведенном месте, заблаговременно делается запись, которая при необходимости уточняется.</p><p><b>3. Дислокация войск и сил флота. Современное состояние.</b></p><p class=\"li\">1. Дислокация объединений, соединений и воинских частей Вооруженных Сил Российской Федерации осуществляется в соответствии с задачами обороны и социально-экономическими условиями мест дислокации.</p><p>Восточный военный округ – штаб г. Хабаровск (Тихоокеанский флот -г. Владивосток).</p><p>Центральный военный округ – г. Екатеринбург</p><p>Южный военный округ – г. Ростов-на-Дону (Черноморский флот – г. Севастополь)</p><p>Западный военный округ – г. Санкт-Петербург (Балтийский флот – г. Калининград)</p><p>Объединенное стратегическое командирование «Север» - г Североморск (Северный флот)</p><p>Каспийская флотилия – г. Каспийск</p><p><b>4.</b> Принципы и основные направления строительства Вооружённых Сил <b>Российской Федерации.</b></p><p>Под строительством Вооруженных Сил понимается система мероприятий, осуществляемых федеральными органами государственной власти, направленных на создание, оснащение, содержание и подготовку Вооруженных Сил к выполнению возложенных на них задач мирного и военного времени.</p><p><b>Принципы строительства ВС РФ:</b></p><ul><li>Единоначалие</li></ul><ul><li>Постоянная боевая готовность</li></ul><ul><li>Подконтрольность военных структур высшим органам государственной власти</li></ul><ul><li>Учет национально-исторических традиций, норм международного права, мирового опыта военного строительства</li></ul><ul><li>Многонациональная кадровая армия, комплектуемая на основе сочетания военной службы по призыву с военной службой по контракту</li></ul>", "3": "<p><b>Вопрос 1. Боевое знамя и порядок вручения его воинской части (Приложение № 3 к УВС).</b></p><p><b>Боевое Знамя</b> <b>— это</b> знак, объединяющий воинскую часть и указывающий на ее принадлежность к Вооруженным Силам государства.</p><p class=\"li\">21. Боевое знамя всегда находится с воинской частью, а в районе боевых действий - в условиях, исключающих захват Боевого знамени противником.</p><p>В мирное время в порядке исключения разрешается совместное хранение боевых знамен нескольких воинских частей соединения.</p><p class=\"li\">22. <b>Боевое знамя всегда должно быть под охраной караула (дежурной смены командного пункта, пункта управления), а при выносе его к воинской части - под охраной знаменного взвода.</b> Боевое знамя на посту при казарменном расположении воинской части (в помещении командного пункта, пункта управления) хранится в расчехленном виде на древке в застекленном шкафу, опечатанном гербовой сургучной печатью воинской части. Оно должно быть установлено в вертикальном положении в знаменную сошку (стойку с вырезами для крепления древка).</p><p class=\"li\">23. <b>При перевозке воинской части Боевое знамя зачехляется и для него выделяется отдельное место в транспортном средстве.</b> Вместе с Боевым знаменем следуют знаменщик, ассистенты и караул, а также могут перевозиться денежный ящик и ящик с документами, содержащими государственную тайну.</p><p>24.<b> За хранение и содержание Боевого знамени непосредственно отвечает начальник штаба воинской части.</b> Он обязан:</p><ul><li>систематически проверять лично или через своего заместителя и помощников несение службы часовыми на посту у Боевого знамени; производить не реже одного раза в месяц осмотр Боевого знамени в порядке</li></ul><ul><li>вести журнал осмотра Боевого знамени, отмечая в нем время осмотра, недостатки, обнаруженные при осмотре Боевого знамени и места его хранения, а также меры, принятые к их устранению.</li></ul><p class=\"li\">25. Осмотр Боевого знамени воинской части производит начальник штаба в присутствии знаменщика, ассистентов и начальника караула. При зачехлении Боевого знамени, начальник штаба приказывает его развернуть. Знаменщик опускает знамя в горизонтальное положение, ассистент снимает чехол, и знаменщик разворачивает знамя, при этом проверяются состояние полотнища, знаков и лент орденов, а также исправность чехла, тесьмы с кистями и древка. Затем начальник штаба может приказать свернуть знамя, при котором знаменщик опускает его в горизонтальное положение, ассистенты слегка натягивают полотнище, и знамя сворачиваются лицевой стороной внутрь, следя за отсутствием складок и запутывания лент. После сворачивания ассистенты надевают чехол на знамя, и начальник штаба опечатывает его гербовой сургучной печатью, после чего знамя сдается под охрану караула.</p><p class=\"li\">26. При выносе и сдаче Боевого знамени караулу, развертывание и свертывание знамени производятся знаменщиком и ассистентами под наблюдением начальника штаба или его помощника.</p><p class=\"li\">27. Если Боевое знамя хранится зачехленным, просушка его полотнища проводится под контролем начальника штаба или его заместителя вне помещения в тени или внутри помещения при необходимости, но не реже одного раза в месяц. Во время просушки знамя охраняется знаменщиком и ассистентами.</p><p class=\"li\">28. Ремонт полотнища Боевого знамени силами и средствами воинской части запрещен. Если требуется ремонт, командир воинской части обязан отправить полотнище в специальную мастерскую по ходатайству.</p><p><b>Порядок вручения боевого знамени:</b></p><p>В установленное время знаменщик выносит Боевое знамя в чехле и следует в трех шагах за начальником, вручающим знамя, к месту построения воинской части. Когда лицо, прибывшее для вручения Боевого знамени, приблизится на 40–50 шагов к строю, командир воинской части подает команду: «Полк, под смирно, равнение – направо!». Оркестр исполняет «Встречный марш». Командир воинской части подходит к лицу, прибывшему для вручения Боевого знамени, и докладывает, что полк для вручения Боевого знамени построен. Со знамени снимается чехол, оно разворачивается, вручающий зачитывает Грамоту Президента РФ и вручает Боевое знамя и Грамоту командиру воинской части. Оркестр исполняет Государственный гимн. Командир и знаменщик с ассистентами с Боевым знаменем обходят строй воинской части, после чего военнослужащие проходят торжественным маршем.</p><p><b>Вопрос 2.   Изготовка к стрельбе из различных положений.</b></p><p><b>Для стрельбы лежа</b> подготавливается упор высотой 25—30 см так, чтобы он был устойчивым и имел ровную верхнюю плоскость. Упор должен слу­жить и укрытием от огня противника. При стрельбе из-за укрытий из любого положения (лежа, с колена, стоя) нужно располагаться у укрытия справа.</p><p><b>Для стрельбы с колена</b> без использования укрытия нужно взять автомат (пулемет) в правую руку за ствольную накладку и одновременно с этим отставить правую ногу назад на ширину плеч, опуститься на пра­вое колено и присесть на каблук; голень левой ноги должна остаться в вертикальном положении, а бедра обеих ног должны составлять угол, близкий к прямому. После этого переложить оружие в левую руку, поста­вить локоть на бедро левой ноги или упереть на колен­ный сустав.</p><p><b>Для стрельбы стоя</b> нужно повернуться вполоборота направо по отношению к цели и, не приставляя левой ноги, отставить ее влево так, чтобы обе ноги находи­лись примерно на ширине плеч, как удобнее солдату, а тяжесть тела была равномерно распределена на обе ноги.</p><p><b>Прицеливание слагается</b> из нескольких быстро вы­полняемых элементов: выравнивания мушки в прорези прицела по вертикали и горизонтали (взятие ровной мушки) и одновременной проверки правильности ее по­ложения, подведения мушки к точке прицеливания и удержания ее в этом положении с одновременным на­жатием первым суставом указательного пальца на спу­сковой крючок. Основное внимание в этот момент дол­жно сосредоточиваться на удержании ровной мушки в прорези прицела и удержании ее под целью. Целесооб­разно выстрел производить в тот момент, когда выдох закончился, а ровная мушка находится под целью</p><p><b>3 вопрос. Предназначение Вооружённых Сил Российской Федерации, их состав и краткая характеристика видов и родов войск</b></p><p><b>Вооруженные Силы Российской Федерации предназначены для:</b></p><ul><li>предотвращение и отражение агрессии против Российской Федерации</li></ul><ul><li>защита государственной границы РФ</li></ul><ul><li>обеспечение национальных интересов Российской Федерации</li></ul><ul><li>выполнение обязательств в соответствии с международными договорами Российской Федерации, поддержание или восстановление международного мира и безопасности, организация и ведение территориальной обороны, участие в обеспечении режимов военного и чрезвычайного положений.</li></ul><ul><li><b>Сухопутные войска</b>: для отражения агрессии противника на континентальных театрах боевых действий</li></ul><ul><li><b>Воздушно- космические силы</b>: для защиты от ударов с воздуха и поддержки Сухопутных войск</li></ul><ul><li><b>Военно-морской флот</b>: обеспечение национальных интересов в Мировом океане, а надежной безопасности страны на морских направлениях</li></ul><ul><li><b>Ракетные войска стратегического назначения:</b> для ядерного сдерживания возможной агрессии</li></ul><ul><li><b>Воздушно – десантные войска</b>: для высадки с воздуха в тылу противника</li></ul><p><b>Вопрос 4. Военные реформы Российского государства в </b>XV–XIX<b> веках.</b></p><p><b>Военная реформа Ивана </b>IV<b> (</b>1550–1571 гг.<b>):</b></p><p class=\"li\">1. Упорядочение системы комплектования и военной службы.</p><p class=\"li\">2. Организация централизованного управления армией.</p><p class=\"li\">3. Создание постоянного стрелецкого войска, основы будущей регулярной армии.</p><p class=\"li\">4. Единая централизованная системы снабжения армии.</p><p class=\"li\">5. Организация пограничной службы.</p><p>Поместное войско – конное дворянское ополчение, основа русской армии. Окончательно сложилось при Иване Грозном и по своему характеру являлось временным. Состояло из слуг или крепостных крестьян.</p><p>В середине XVI века было создано постоянное Стрелецкое войско. Состояло из приказов по 500–1000 человек. В конце века насчитывалось 20–25 тысяч человек</p><p>В XVI в. складываются Центральные органы военного управления – приказы Разрядный, Поместный, Стрелецкий, Пушкарский.</p><p>Артиллерия делилась на крепостную, осадную и полковую</p><p><b>Военные реформы Петра I (</b>1698–1721 гг.<b>):</b></p><p class=\"li\">1. Создание регулярного военно-морского флота</p><p class=\"li\">2. Введение единой системы обучения и воспитания</p><p class=\"li\">3. Создание единой системы снабжения армии</p><p class=\"li\">4. Выработка твердых основ прохождения службы для офицеров</p><p class=\"li\">5. Введение единой формы одежды</p><p class=\"li\">6. Создание военных школ для подготовки национальных военных кадров</p><p class=\"li\">7. Создание единых военных органов управления</p><p class=\"li\">8. Комплектование армии на основе рекрутских наборов</p><p class=\"li\">9. Введение новой организации армии</p><p class=\"li\">10. Перевооружение армии</p><p>В Итоге военных реформ Петра I в России были созданы регулярная армия и военной-морской флот, которые обеспечили победу России в Северной войне со Швецией</p><p><b>Военные реформы Д.А. Милютина</b> <b>(Александр </b>II<b>) – военный министр (</b>1862–1874<b> гг.):</b></p><p class=\"li\">1. Замена рекрутской повинности общей воинской повинностью.</p><p class=\"li\">2. Создание армейского резерва.</p><p class=\"li\">3. Образование военных округов (15 округов).</p><p class=\"li\">4. Современный устав армии.</p><p class=\"li\">5. Перевооружение армии нарезным оружием и артиллерией</p><p class=\"li\">6. Реорганизация боевой подготовки войск и офицеров.</p><p class=\"li\">7. Учреждение военных гимназий, военных и юнкерских училищ.</p><p class=\"li\">8. Военно-судебные реформы.</p>", "4": "<p><b>Вопрос </b>1<b>. Военная присяга (обязательство) и порядок приведения к ней военнослужащих (Приложение № 1 к УВС).</b></p><p><b>текст Военной присяги</b>:</p><p>\"Я, (фамилия, имя, отчество), торжественно присягаю на верность своему Отечеству - Российской Федерации.</p><p>Клянусь свято соблюдать [Конституцию](http://www.consultant.ru/document/cons_doc_LAW_2875/) Российской Федерации, строго выполнять требования воинских уставов, приказы командиров и начальников.</p><p>Клянусь достойно исполнять воинский долг, мужественно защищать свободу, независимость и конституционный строй России, народ и Отечество\"</p><p class=\"li\">1. Военнослужащий, являющийся гражданином Российской Федерации, впервые поступивший (призванный) на военную службу, приводится к Военной присяге.</p><p class=\"li\">2. Приведение к Военной присяге проводится:</p><ul><li>по прибытии военнослужащего к первому месту прохождения военной службы после прохождения начальной военной подготовки, срок которой не должен превышать два месяца;</li></ul><ul><li>по прибытии гражданина к первому месту прохождения военных сборов или к месту прохождения учебных сборов - не позднее пяти дней со дня прибытия в воинскую часть.</li></ul><p class=\"li\">3. Приведение к Военной присяге (принесение обязательства) осуществляется под руководством командира воинской части.</p><p class=\"li\">4. В назначенное время воинская часть выстраивается в пешем строю при Государственном флаге Российской Федерации, Боевом знамени воинской части и с оркестром в парадной. <b>Построение воинской части, встреча командира, вынос и относ Государственного</b> <b>флага</b>. <b>Командир</b> воинской части в краткой речи <b>напоминает им значение Военной присяги</b> (обязательства) и той почетной и ответственной обязанности, которая возлагается на военнослужащих, приведенных к Военной присяге (принесших обязательство) на верность РФ. <b>Каждый военнослужащий</b>, приводимый к Военной присяге, <b>читает вслух</b> перед строем подразделения текст <b>Военной присяги (обязательства), после чего собственноручно расписывается</b> в списке в графе напротив своей фамилии и становится на свое место в строю. По окончании приведения к Военной присяге (принесения обязательства<b>) списки с личными подписями</b> военнослужащих, приведенных к Военной присяге (принесших обязательство), <b>вру</b>чаются командирами подразделений командиру воинской части.</p><p>5<b>. День приведения к Военной присяге (принесения обязательства) является нерабочим днем</b> для данной воинской части и проводится как праздничный день.</p><p><b>2.</b> Периодичность и порядок осмотра стрелкового оружия и боеприпасов командирами подразделений</p><p><b>Командир роты</b> обязан <b>не менее раза в месяц</b> проверять наличие, состояние и учет оружия и боеприпасов. Результаты осмотра вооружения, боеприпасов и техники записывать в книгу осмотра (проверки) вооружения, техники и боеприпасов (Приложение 10 УВС ВС РФ). Книга хранится в комнате для хранения оружия.</p><p>Командир взвода обязан не менее дух раз в неделю проверять наличие, сохранность оружия и боеприпасов и их состояние.</p><p><b>Порядок осмотра:</b></p><ul><li>Убедиться в наличии всех частей автомата и проверить нет ли на наружных частях ржавчины, грязи, а также вмятин, царапин и забоин, и других повреждений, которые могут вызвать нарушение нормальной работы механизмов</li></ul><ul><li>Нет ли на деревянных частях трещин, сколов</li></ul><ul><li>Надежно ли крепление шомпола</li></ul><ul><li>Проверить состояние смазки на видимых без разборки автомата частях, наличие ремня, принадлежности, магазинов, сумок для них и штык-ножа</li></ul><ul><li>Проверить исправность прицела и мушки</li></ul><ul><li>Убедиться, что в канале ствола нет посторонних предметов</li></ul><ul><li>Проверить подачу патронов в патронник</li></ul><p>Автоматы осматриваются:</p><ul><li>Ежедневно</li></ul><ul><li>Перед заступлением в наряд</li></ul><ul><li>Перед выходом на занятия</li></ul><ul><li>В боевой обстановке – периодически в течение дня и перед выполнением боевой задачи</li></ul><ul><li>Во время чистки</li></ul><p>Осмотр боевых патронов:</p><ul><li>Нет ли на гильзах ржавчины и помятостей</li></ul><ul><li>Не шатается ли пуля в дульце гильзы</li></ul><ul><li>Нет ли на капсюле зеленого налета</li></ul><ul><li>Не выступает ли капсюль выше поверхности дна гильзы</li></ul><ul><li>Нет ли среди боевых патронов учебных</li></ul><p><b>3. Военная доктрина Российской Федерации, предназначение и факторы её определяющие</b>.</p><p><b>Военная доктрина представляет собой</b> систему официально принятых в государстве взглядов на подготовку к вооруженной защите и вооруженную защиту РФ.</p><p><b>Факторы,</b> ее определяющие: экономический, научный, социальный, морально-политический и военный.</p><p><b>Предназначение доктрины:</b></p><ul><li>определение стратегических целей и задач в области национальной безопасности и обороны;</li></ul><ul><li>определение основных принципов и направления деятельности вооруженных сил;</li></ul><ul><li>Определение условий и обстоятельств использования силы и военного потенциала</li></ul><p><b>На формирование доктрины влияют:</b></p><ul><li>угрозы безопасности,</li></ul><ul><li>внешняя и внутренняя политика,</li></ul><ul><li>военно-экономические,</li></ul><ul><li>военно-технические,</li></ul><ul><li>научно-технические возможности государства</li></ul><ul><li>военно-стратегические взгляды</li></ul><ul><li>подходы на подготовку к вооруженной защите государства</li></ul><p><b>4.  </b>Военные реформы в советском периоде и в<b> </b>настоящее время.</p><p><b>Содержание военной реформы </b>1924–1928</p><ul><li>введение территориально-милиционной системы строительства Красной Армии B сочетании c кадровой (смешанная система комплектования); \"Закон об обязательной военной службе\" 18.09.1925 г.</li></ul><ul><li>переход к новой системе строительства Красной Армии (создание территориальных, кадровых частей и соединений, а также национальных воинских формирований) (в 1925 г. принят Закон об обязательной военной службе);</li></ul><ul><li>организационная перестройка и укрепление органов управления Вооруженными Силами; (Председателем Реввоенсовета Республики стал М. В. Фрунзе).</li></ul><ul><li>улучшилась техническая оснащенность. Так, например, с 1923 по 1926 г. численность советского воздушного флота увеличилась в 12 раз;</li></ul><ul><li>усовершенствовалась структура и система работы органов тыла, снабжение стало осуществляться по схеме «округ часть боец», материальное содержание командного состава увеличилось на 30–40 %, а красноармейца- с 35 коп. до 1 руб.20 коп.</li></ul><ul><li>качественно обновился командный состав. Произошло значительное омоложение кадров. Был осуществлен переход от системы краткосрочных курсов к военным школам с 3–4 годичным сроком обучения. (в 1927 г. обучением командных кадров армии и флота занимались 6 военных академий, 5 факультетов и 57 школ).;</li></ul><ul><li>улучшена система обучения и воспитания (в период с 1925 по 1928 г. были введены в действие Полевые и Боевой уставы видов и родов войск РККА).</li></ul><p>Результаты военной реформы:</p><p>Продолжительность военной службы составляла:</p><ul><li>в кадровых частях в зависимости от рода войск от 2 до 4 лет;</li></ul><ul><li>в сухопутных войсках составляла 2 года;</li></ul><ul><li>в авиации - 3;</li></ul><ul><li>в военно-морском флоте - 4 года.</li></ul><ul><li>Численность Красной армии к концу военной реформы составила 552 тыс. человек.</li></ul><ul><li>Октябрь 1924 года - введение единых штатов стрелковых соединений.</li></ul><ul><li>Высшим тактическим соединением стал стрелковый корпус, в состав которого входили 2–3 стрелковые дивизии подразделения обслуживания.</li></ul><ul><li>Основным тактическим соединением стала - стрелковая дивизия.</li></ul><ul><li>В 1924 году из двух отдельных огнеметных рот был создан Отдельный учебно-опытный батальон, a Высшая военно-химическая школа преобразована в Химические курсы усовершенствования командного состава.</li></ul><p>Военные реформы периода Отечественной войны 1941-1945гг</p><ul><li>Вводится деление военнослужащих на рядовой, сержантский, офицерский составы и генералитет, были введены новые знаки различия.</li></ul><ul><li>Усложнилась и увеличилась система военных трибуналов.</li></ul><ul><li>Для улучшения материального обеспечения войск были учреждено Главное управление тыла.</li></ul><ul><li>Было принято постановление, обязывающее республиканские, областные и районные комитеты партии развернуть в тылу врага сопротивление (партизанское движение, подпольные партийные и комсомольские организации)</li></ul><ul><li>Изменение системы организации высшего командования, создание в пределах фронтов соединений, оперативных объединений и корпусов, объявляется всеобщая мобилизация всех мужчин с 19 до 55 лет.</li></ul><ul><li>Усложнилась структурная организация вооруженных сил. Структура включала теперь фронты, армии, корпуса, дивизии, бригады, полки, батальоны, роты, взводы и отделения.</li></ul><ul><li>B 1942 г. Издается Боевой устав пехоты.</li></ul><p><b>Реформа Вооружённых Сил Российской Федерации (ВС России) </b>2008–2020 годов</p><p><b>І этап (</b>2008–-2011<b>)</b> Оптимизация численности, управления, реформа военного образования.</p><p><b>II этап (</b>2012–-2015<b>)</b> Повышение денежного довольствия, обеспечение жильём, профессиональная переподготовка и повышение квалификации военнослужащих.</p><p><b>III этап (</b>2016–2020<b>)</b> Перевооружение</p><p>2014 году численность Вооружённых сил РФ составляла 845 тысяч: сухопутные войска -- 250 тыс., ВДВ -- 35 тыс., ВМС -- 130 тыс., ВВС -- 150 тыс., СЯС -- 80 тыс., командование и обслуживание -- 200 тыс. В Н/В- более 1млн.чел.</p><p>C 1 января 2012 года денежное довольствие военнослужащих было увеличено в 2,5–-3 раза, выросли военные пенсии. 7 ноября 2011 года президент Дмитрий Медведев подписал Закон «О денежном довольствии военнослужащих и предоставлении им отдельных выплат».</p>", "5": "<p><b>1. Права военнослужащих (статьи </b>9–15<b>)</b></p><p class=\"li\">9. <b>Военнослужащие находятся под защитой государства</b>. Никто не вправе ограничивать их в правах и свободах, а также вмешиваться в их служебную деятельность.</p><p>10<b>. Государство гарантирует правовую и социальную защиту военнослужащих, осуществляет охрану их жизни и здоровья.</b></p><p>Командиры (начальники), виновные в неисполнении обязанностей по реализации прав военнослужащих, несут ответственность в соответствии с ФЗ и иными НПА РФ.</p><p class=\"li\">11. <b>Военнослужащий</b> и гражданин, обучающийся по программе военной подготовки и проходящий учебные сборы, <b>до приведения к Военной </b>присяге не<b> могут привлекаться к выполнению боевых </b>задач и задач при введении режима чрезвычайного положения и в условиях вооруженных конфликтов;</p><p><b>за военнослужащим и гражданином, обучающимся по программе военной подготовки и проходящим учебные сборы, не могут закрепляться оружие и военная техника</b>;<b> не может быть применен дисциплинарный арест.</b></p><p class=\"li\">12. Военнослужащие женского пола и военнослужащие, воспитывающие детей без отца (матери), пользуются социальными гарантиями и компенсациями.</p><p class=\"li\">13. Военнослужащие при исполнении обязанностей военной службы, а при необходимости и во внеслужебное время, в соответствии с законодательством Российской Федерации имеют право на хранение, ношение, применение и использование оружия.</p><p>Военнослужащие могут применять оружие лично, а командиры (начальники) приказать подчиненным применить оружие для защиты жизни, здоровья и собственности в состоянии необходимой обороны.</p><p>Командир (начальник), кроме того, имеет право применить оружие лично или приказать применить оружие для восстановления дисциплины и порядка в случае открытого неповиновения, подчиненного в боевых условиях.</p><p class=\"li\">14. Применению оружия должно предшествовать четко выраженное предупреждение об этом лица, против которого применяется оружие, за исключением случаев, когда промедление в применении оружия создает непосредственную опасность для жизни военнослужащего или других граждан или может повлечь иные тяжкие последствия:</p><p>Военнослужащие имеют право использовать оружие для подачи сигнала тревоги или вызова помощи, а также против животного, угрожающего жизни или здоровью людей.</p><p>Запрещается применять огнестрельное оружие в отношении женщин, лиц с явными признаками инвалидности, несовершеннолетних, когда их возраст очевиден или известен.</p><p class=\"li\">15. Обо всех случаях хищения, утраты, порчи или выхода из строя оружия военнослужащие обязаны докладывать своему непосредственному начальнику.</p><p><b>2. ТТХ Пистолета Макарова</b></p><p><b>Калибр - 9 мм.</b></p><p><b>Дальность эффективного огня - 50 м.</b></p><p><b>Убойное действие пули сохраняется на дальности - до 350 м</b></p><p><b>Боевая скорострельность -30 в./мин.</b></p><p><b>Вес пистолета со снаряженным магазин</b> –<b> 810</b> <b>г</b>.</p><p><b>Начальная скорость полета пули - 315 м/сек.</b></p><p><b>Емкость магазина -8 патронов.</b></p><p><b>3. Военная служба как особый вид государственной службы. Принципы комплектования Вооружённых Сил РФ военнослужащими.</b></p><p><b>Военная служба</b> — особый вид государственной службы, представляющий</p><p>собой профессиональную служебную деятельность граждан государства на воинских должностях в вооружённых силах.</p><p><b>Отличительные признаки военной службы:</b></p><ul><li>Особый правовой статус военнослужащих</li></ul><ul><li>Особая система воинских званий</li></ul><ul><li>Право служащих на ношение оружия и его применения в ряде случаев</li></ul><ul><li>Особая система знаков отличия и форма</li></ul><ul><li>Обязанность поддерживать постоянную боевую готовность</li></ul><ul><li>Наличие военной присяги при поступлении на военную службу</li></ul><p><b>Комплектование Вооруженных Сил Российской Федерации осуществляется:</b></p><p class=\"li\">1) военнослужащими - путем призыва граждан РФ на военную службу по экстерриториальному принципу и путем добровольного поступления (по контракту) граждан Российской Федерации на военную службу;</p><p class=\"li\">2) федеральными государственными гражданскими служащими;</p><p class=\"li\">3) работниками</p><p><b>4.  </b>Исторический опыт и уроки военных реформ в России, их значение для военного строительства Вооружённых Сил РФ.</p><p class=\"li\">1. Важнейшие поучительные уроки:</p><ul><li>Связь с общими реформами государства</li></ul><ul><li>Затрагивание реформой всех основных сторон военной жизни и службы</li></ul><ul><li>Ход по заранее выработанной программе</li></ul><ul><li>Постепенность и последовательность проведения</li></ul><ul><li>Жизненность и практичность реформы и другие</li></ul><p class=\"li\">2. Военная реформа должна носить <b>комплексный системный характер</b></p><p class=\"li\">3. <b>Большое значения</b> для осуществления военных реформ имеет <b>экономика</b></p><p class=\"li\">4. <b>Огромную роль</b> в реализации планов военных реформ играет <b>духовный фактор</b></p><p class=\"li\">5. <b>Использование зарубежного опыта военных реформ должно сочетаться с национальной самобытностью.</b> Слепое копирование иностранной практики военного строительства приводит лишь к отрицательным результатам.</p><p class=\"li\">6. <b>Особое значение офицерского корпуса</b> в реализации планов реформ.</p>", "6": "<p><b>1. </b>Ответственность военнослужащих и её виды (статьи <b>26–32</b>).</p><p class=\"li\">26. <b>Военнослужащие независимо от воинского звания и воинской должности равны перед законом</b> и могут привлекаться к <b>дисциплинарной, административной, материальной, гражданско-правовой и уголовной ответственности</b> в зависимости от характера и тяжести совершенного ими правонарушения.</p><ul><li><b>Дисциплинарная: </b>за проступки, связанные с нарушением воинской дисциплины и общественного порядка</li></ul><ul><li><b>Административная: </b>за административные правонарушения (нарушение ПДД, правил охоты, рыболовства и т. д.). Наказание в виде штрафа, исправительных работ, административный арест</li></ul><ul><li><b>Материальная: </b>за материальный ущерб, причиненный государству при исполнении военной службы</li></ul><ul><li><b>Гражданско-правовая: </b>за невыполнение или ненадлежащее выполнение предусмотренных действующим законодательством обязательств, за убытки и моральный вред, причиненный военнослужащими, не находящимися при исполнении.</li></ul><ul><li><b>Уголовная: </b>за совершенные преступления военнослужащие несут уголовную ответственность.</li></ul><p><b>2. Общее устройство и порядок работы пистолета Макарова (ПМ).</b></p><p><b>Пистолет состоит</b> из следующих основных частей и механизмов:</p><p>1 - рамки со стволом и спусковой скобой;</p><p>2 - затвора с ударником, выбрасывателем и предохранителем;</p><p>3 - возвратной пружины;</p><p>4 - ударно-спускового механизма;</p><p>5 - рукоятки с винтом;</p><p>6 - затворной задержки;</p><p>7 - магазина.</p><p>Работа автоматики пистолета основана на принципе свободного хода затвора.</p><p>При выстреле пороховые газы отводят затвор в заднее положение, открывая доступ к патронной камере и выбрасывают гильзу через ствольное окно. При отпускании спускового крючка ударник ударяет по капсюлю патрона, происходит выстрел, а также автоматическая перезарядка оружия - затвор движется вперед, и затворная пружина его возвращает в исходное положение, заряжая следующий патрон.</p><p><b>3. Состав военнослужащих и воинские звания.</b></p><p><b>4.  Битва на Чудском озере (1242 г.), значение битвы.</b></p><p><b>ХОД БИТВЫ:</b></p><p>На рассвете 5 апреля 1242 г. рыцари построились клином («свиньёй»), и началась битва на льду. Выставив длинные копья и прорвавшись сквозь лучников и передовой полк, немцы атаковали центр («чело») боевого порядка русских. Центр русских войск был рассечен, а часть воинов отошла назад и на фланги. Однако, наткнувшись на обрывистый берег озера, малоподвижные, закованные в латы рыцари не могли развить свой успех.  В этот момент Александр Невский ввел в бой лучшие отряды дружинников, которые, ударив с флангов и тыла, завершили полное окружение неприятеля. Разбитые по частям рыцари-крестоносцы, преследуемые русскими войнами, бежали на запад. Под убегающими тяжеловооруженными рыцарями и кнехтами подтаявший весенний лед стал проваливаться, и многие немецкие воины утонули. Русские войска одержали решительную победу.</p><p><b>ЗНАЧЕНИЕ БИТВЫ:</b></p><ul><li>Битва на Чудском озере закончилась Победой русских войск, остановившей продвижение крестоносцев на восток, спасла русский народ   от порабощения.</li></ul><ul><li>Преследование остатков армии разбитого врага вне поля боя было новым явлением в развитии русского военного искусства.</li></ul><ul><li>Под влиянием победы русских воинов усилилась борьба народов Литвы и Поморья против крестоносцев.</li></ul><ul><li>Орденские рыцари в 1243 г. прислали послов в Новгород, отказавших от своих завоеваний в русских землях.</li></ul><ul><li>В 1543 году Александр Невский был канонизирован РПЦ в лике чудотворцев.</li></ul>", "7": "<p><b>1. Общие, должностные и специальные обязанности военнослужащих (статьи </b>16–25<b>).</b></p><p><b>Общие:</b></p><p>Военнослужащий в служебной деятельности руководствуется Конституцией Российской Федерации, федеральными конституционными законами, федеральными законами, общевоинскими уставами и иными нормативными правовыми актами Российской Федерации. <b>Данные обязанности должен выполнять каждый военнослужащий от солдата до генерала.</b></p><ul><li>Быть верным Военной присяге, беззаветно служить народу РФ</li></ul><ul><li>Строго соблюдать Конституцию РФ, законы РФ и о требования общевоинских уставов</li></ul><ul><li>Совершенствовать воинское мастерство, содержать в постоянной готовности вооружению и технику</li></ul><ul><li>Быть дисциплинированным, хранить государственную тайну</li></ul><ul><li>Дорожить воинской честью и боевой славой ВС</li></ul><ul><li>Соблюдать общепризнанные принципы и нормы международного права</li></ul><p><b>Должностные:</b></p><p>Каждый военнослужащий, назначенный на воинскую должность, имеет должностные обязанности, которые определяют его полномочия, а также объем выполняемых задач. Исполняются только в интересах военной службы</p><p><b>Специальные:</b></p><p>Обязанности военнослужащих, которые</p><ul><li>Находятся на боевом дежурстве, в суточном наряде</li></ul><ul><li>Привлекаются для ликвидации последствий стихийных бедствий и других ЧП</li></ul><p><b>2.</b> Основные требования безопасности на занятиях по огневой подготовке и при проведении боевых стрельб.</p><p><b>При обращении с оружием необходимо строго соблюдать следующие правила:</b></p><ul><li>Во время проведения стрельбы все действия с оружием производить только по командам руководителя стрельбы</li></ul><ul><li>По окончании или в случаях перерывов в стрельбе, а также при передаче и получении оружия необходимо прежде всего убедиться в том, что оно не заряжено</li></ul><ul><li>В процессе стрельбы держать оружие только в направлении стрельбы или стволом вверх, независимо от оттого, заряжено оно или нет</li></ul><ul><li>Немедленно прекратить стрельбу и разрядить оружие в случаях: поступления команды о прекращении стрельбы, появления белого флага, запрещающего продолжение стрельбы, появления в секторе обстрела животных или людей.</li></ul><ul><li>Носить и хранить оружие с закрытым затвором и спущенным с боевого взвода курком</li></ul><p><b>Категорически запрещается:</b></p><ul><li>Заряжать оружие до команды руководителя и сигнала «Огонь»</li></ul><ul><li>Направлять оружие на людей, в сторону и в тыл стрельбища, независимо от того, заряжено оно или нет</li></ul><ul><li>Открывать и вести огонь из несправного оружия, при поднятом белом флаге</li></ul><ul><li>Оставлять где бы то ни было заряженное оружие или передавать его другим лицам</li></ul><ul><li>Заходить на участки стрельбища, где имеются неразорвавшиеся боевые гранаты, другие взрывоопасные предметы</li></ul><p><b>3. Прохождение военной службы офицерским (сержантским) составом. Её основные этапы и их характеристика.</b></p><p><b>Прохождение военной службы включает в себя:</b></p><ul><li><b>заключение контракта</b> (проводится письменно по типовой форме на 3,5,10 лет.</li></ul><ul><li><b>назначение на воинскую должность;</b></li></ul><p><b>- присвоение воинского звания;</b></p><p><b>- аттестацию</b> (проводится каждые 5 лет для оценки навыков и умений военнослужащих, для определения их соответствия воинской должности и дальнейших перспектив, для определения предназначения граждан, пребывающих в запасе)</p><ul><li><b>перевод </b>(по служебной необходимости, в порядке продвижения по службе, по семейным обстоятельствам), <b>прикомандирование и приостановление военной службы</b> (избрание в депутаты госдумы</li></ul><ul><li><b>предоставление отпусков</b> (<10 лет – 30 суток, >10 – 35 суток, >15 – 40 суток, >20 – 45 суток)</li></ul><ul><li><b>увольнение с военной службы</b> (по возрасту, по состоянию здоровья, по истечении срока контракта или срока по призыву, в связи с лишением воинского звания, по приговору суда)</li></ul><p><b>4.  Куликовская битва (1380 г.), значение битвы.</b></p><p><b>ХОД БИТВЫ:</b></p><p>8 сентября 1380 г. битва началась поединком богатырей – Александра Пересвета и Челубея (оба погибли). Затем татарская конница, смяв передовой полк, начала теснить большой полк. Русские полки несли большие потери. Дмитрий Донской сначала был в передовом полку, а затем в доспехах рядового воина бился среди воинов большого полка. Татары прорвались к реке и подставили засадному полку тыл. Удар конницы из засады с тыла на основные силы ордынцев стал решающим. Татарская конница была загнана в реку и там перебита. Одновременно перешли в наступление и другие полки русских войск.  Татары смешались и обратились в бегство. Ход боя переломился. Неожиданный удар засадного полка, отсутствие у татар резервов и переход в наступление других полков привели к разгрому Мамаевской рати, остатки которой русские полки преследовали и уничтожали на протяжении пятидесяти километров от Куликова поля.</p><p><b>ЗНАЧЕНИЕ БИТВЫ:</b></p><ul><li>Куликовская битва закончилась Победой русских войск, но им не удалось закрепить полный разгромом Золотой Орды. Для этого ещё не было достаточных сил.</li></ul><ul><li>Хотя она не привела к ликвидации монголо-татарского ига на Руси, однако на Куликовом поле был нанесен сильный удар по господству Золотой Орды, ускоривший ее последующий распад.</li></ul><ul><li>Важным следствием Куликовской битвы было усиление роли Москвы в Северо-Восточной Руси и укрепление международного авторитета Московского княжества.</li></ul><ul><li>Куликовская битва утвердила авторитет московского князя и явилась важным звеном в процессе формирования централизованного Русского государства.</li></ul><p><b>Для справки</b>: стояние на реке Угре в 1480 г. завершилось полным свержением ордынского ига.</p>", "8": "<p><b>1. Единоначалие. Командиры (начальники) и подчиненные. Старшие и младшие (статьи </b>33–38<b>).</b></p><p><b>Статья 33:</b> <b>Единоначалие является одним из основных принципов строительства Вооруженных Сил. Единоначалие заключается в наделении командира (начальника) всей полнотой распорядительной власти по отношению к подчиненным</b> и возложении на него персональной ответственности перед государством за все стороны жизни и деятельности воинской части, подразделения и каждого военнослужащего.</p><p>Единоначалие выражается в праве командира единолично принимать решения, отдавать в установленном порядке приказы и обеспечивать их выполнение.</p><p><b>Статья 34:</b> <b>По своему служебному положению и воинскому </b>званию одни <b>военнослужащие</b> по отношению <b>могут быть начальниками или подчиненными</b>. Начальник имеет право отдавать подчиненному приказы и требовать их исполнения. <b>Подчиненный обязан беспрекословно выполнять</b> приказы начальника</p><p><b>Статья 35:</b> Начальники, которым военнослужащие подчинены по службе являются прямыми начальниками. Ближайший прямой начальник называется непосредственным начальником.</p><p><b>Статья 37:</b> Военнослужащие, которые по своему служебному положению и воинскому званию не являются по отношению к другим военнослужащим начальниками или подчиненными, могут быть старшими или младшими. Старшинство определяется воинскими званиями.</p><p><b>Статья 38</b>: при совместном исполнении обязанностей военнослужащими, не подчиненными друг другу (если их служебные взаимоотношения не определены командиром) старший из них по воинской должности, а при равных должностях старший по воинскому званию, является начальником</p><p><b>2. Команды и сигналы, подаваемые при проведении боевых стрельб на войсковом стрельбище.</b></p><p>При выполнении упражнений на войсковом стрельбище (в тире) / Назначение команды или действия стреляющего</p><p><b>\"На рубеж открытия огня шагом - марш! Заряжай! Огонь!</b>\"</p><ul><li>подается раздельно на учебных занятиях (тренировках), стреляющий последовательно выполняет действия, соответствующие командам</li></ul><p><b>\"На указанную позицию - вперед!\"</b></p><ul><li>стреляющий из исходного положения выдвигается на рубеж открытия огня и занимает указанную позицию</li></ul><p><b>\"К бою!\"</b></p><ul><li>стреляющий изготавливается к стрельбе (принимает положение для стрельбы и заряжает оружие), докладывает о готовности к стрельбе и с появлением цели самостоятельно открывает огонь</li></ul><p><b>\"В атаку - вперед!\" (\"Вперед!\")</b></p><ul><li>подается в упражнениях, где предусмотрено передвижение</li></ul><p><b>\"Стой!\" \"Прекратить огонь!\"</b></p><ul><li>для временного прекращения огня (стреляющий ставит оружие на предохранитель)</li></ul><p><b>«Разряжай!»</b></p><ul><li>для полного прекращения стрельбы</li></ul><p><b>\"Оружие к осмотру!\" -</b></p><p>стреляющий предъявляет к осмотру оружие, магазины (ленты, коробки)</p><p>На стрельбище оборудуется устройство для подачи сигнала, <b>запрещающего (белого цвета</b>, ночью -- белый фонарь), <b>разрешающего (красного цвета</b>, ночью - красный фонарь) стрельб</p><p><b>3. Цель управления, требования к управлению и принципы управления.</b></p><p>В статье 38 Боевого устава, часть 3 указывается, что <b>управление подразделениями (личным составом) заключается</b> в целенаправленной деятельности командира по поддержанию их в постоянной боевой готовности, подготовке подразделений к бою и руководству ими при выполнении задач. Основная функция деятельности командиров.</p><p><b>В общем понимании - управление</b>   представляет собой организационную деятельность людей, которая осуществляется для достижения определенных целей.</p><p><b>Управление должно быть</b> устойчивым, непрерывным, оперативным и скрытым, обеспечивать постоянную боевую готовность подразделений.</p><p><b>Основные принципы управления</b>:</p><ul><li>единоначалие;</li></ul><ul><li>личная ответственность командира, начальника за принятые решения и результаты;</li></ul><ul><li>централизация управления в сочетании с инициативой подчиненных;</li></ul><ul><li>постоянное знание и глубокий анализ обстановки, предвидение хода событий;</li></ul><ul><li>твердость, настойчивость принятых решений;</li></ul><ul><li>высокая организованность;</li></ul><ul><li>знание личного состава, опора на подчиненных командиров.</li></ul><p><b>4.  Полтавское сражение (1709 г.), значение сражения.</b></p><p><b>ХОД БИТВЫ:</b></p><p>С апреля по июнь 1709 года шведские войска Карла XII, предприняли осаду Полтавы, проведя около 20 штурмов города, но российский гарнизон их отразил. В конце мая к Полтаве подтянулись основные силы русской армии под командованием Петра I.</p><p>8 июля 1709 г. в 2 часа ночи шведская армия колоннами двинулись на русские редуты, спустя два часа им удалось взять лишь два передовых редута. Затем они попытались обойти поперечную линию редутов с севера, но попали под сильный артиллерийский и ружейный фланговый огонь российской армии и в беспорядке отошли.</p><p>В 6 часов Петр вывел войска из лагеря и построил их в две линии, имея в центре пехоту, а на флангах конницу. Главные силы шведов выстроились напротив русской армии.</p><p>В 9 часов завязался рукопашный бой. Шведы начали отступать, а в 11 часов их отступление переросло в беспорядочное бегство. Русская конница преследовала шведов до Переволочны, где оставшиеся силы неприятеля сдались в плен.</p><p><b>ЗНАЧЕНИЕ БИТВЫ:</b></p><ul><li>В результате победы в Полтавском сражении инициатива в Северной войне перешла на сторону</li></ul><p>России и военное могущество Швеции было подорвано.  Слава русского оружия прогремела на всю Европу. Русская армия показала прекрасную боевую подготовку и героизм, а полководцы – выдающиеся полководческие способности.</p><ul><li>Впервые были применены полевые земляные укрепления – редуты.</li></ul><p><b>Для справки</b>: 28 сентября 1708 года у деревни Лесной произошло сражение, в ходе которого шведы потерпели поражение, и их армия осталась без провизии и боеприпасов. Гетман И. С. Мазепа изменил Петру I и, перейдя на сторону Карла ХІІ, заверил его в добрых чувствах населения Украины к шведской короне и направил его к Полтаве для пополнения недостающих припасов</p>", "9": "<p><b>1. </b>Приказ (приказание), порядок его отдачи и выполнения (статьи <b>39–45</b>).</p><p><b>Приказ может быть отдан в письменном виде, устно или по техническим средствам связи </b>одному или группе военнослужащих.</p><p><b>Обсуждение (критика) приказа недопустимо</b>, <b>а неисполнение приказа</b> командира (начальника), отданного в установленном порядке<b>, является преступлением</b> против военной службы.</p><p><b>Отдание приказа (приказания) начальником должно сопровождаться выполнением следующих условий:</b></p><p class=\"li\">1. Приказ (приказание) должен соответствовать требованиям законов и воинских уставов. Военнослужащему не могут отдаваться приказы, направленные на нарушение закона.</p><p class=\"li\">2. Военнослужащему не могут отдаваться приказы, распоряжения и ставиться задачи, не имеющие отношения к военной службе.</p><p class=\"li\">3. Начальник перед отдачей приказа обязан всесторонне оценить обстановку и предусмотреть меры по обеспечению его выполнения.</p><p class=\"li\">4. Приказ должен быть сформулирован ясно, не допускать двоякого толкования и не вызывать сомнения у подчиненного.</p><p class=\"li\">5. Приказы отдаются в порядке подчиненности.</p><p class=\"li\">6. При крайней необходимости старший начальник может отдать приказ подчиненному, минуя его непосредственного начальника. В таком случае он сообщает об этом непосредственному начальнику подчиненного или приказывает подчиненному самому доложить своему непосредственному начальнику.</p><p><b>Принятие приказа сопровождается выполнением следующих условий:</b></p><p class=\"li\">1. Военнослужащий, получив приказ, отвечает «Есть» и затем выполняет</p><p class=\"li\">2. Приказ должен быть выполнен беспрекословно, точно и в срок</p><p class=\"li\">3. При необходимости обратиться с просьбой к командиру повторить приказ</p><p class=\"li\">4. Если военнослужащий, выполняющий приказ, получит от другого начальника, старшего по служебному положению, новый приказ, который помешает выполнить первый, он докладывает об этом начальнику, отдавшему второй приказ, и в случае его подтверждения выполняет последний</p><p><b>2. Задачи огневой подготовки в подразделении и воинской части</b></p><p><b>Цель огневой подготовки</b> - обучить личный состав подразделений и частей умелому и полному использованию высоких огневых возможностей оружия в различных условиях обстановки.</p><p><b>Основные задачи</b>:</p><ul><li>Использование боевых возможностей оружия для поражения противника с наименьшим расходом времени и боеприпасов</li></ul><ul><li>Обучение личного состава умелому применению штатного оружия</li></ul><ul><li>Воспитание активности и самостоятельности в решении огневых задач</li></ul><ul><li>Привитие обучаемым уверенности в своем оружии</li></ul><p><b>3. Структура и содержание управленческой деятельности командира.</b></p><p><b>Сущностью управленческой деятельности</b> является система целенаправленного воздействия командира на подчиненных.</p><p><b>Содержание управленческой деятельности</b> определяется системой управленческих функций, которые реализуются командиром (начальником) в условиях мирного и военного времени.</p><p><b>Структуру управления составляет</b> строгая и логическая последовательность следующих мероприятий:</p><ul><li>сбор и анализ информации</li></ul><ul><li>выработки решения</li></ul><ul><li>планирование работ</li></ul><ul><li>постановка задач подчиненным и организация их работы</li></ul><ul><li>всестороннее обеспечение работ</li></ul><ul><li>контроль за выполнением задач</li></ul><ul><li>подведение итогов и обобщение полученного опыта</li></ul><p><b>4.  Морское сражение у мыса Гангут (1714 г.), значение сражения.</b></p><p><b>ХОД БИТВЫ:</b></p><p>В 1714 году русскому галерному флоту под командованием генерал-адмирала Ф. М. Апраксина была поставлена задача пройти к Або-Аландским шхерам и высадить десант (15 тыс. чел.). Но, 9 мая русская флотилия была вынуждена остановиться у Тверминне из-за шведского флота, преградившего ей дальнейшее продвижение. Петр 1 решил обойти противника, создав переволоку в узкой части перешейка (2,5км), и перетащить по ней часть кораблей для удара в тыл шведскому флоту.  Шведы попытались помешать этому маневру, отправив один отряд кораблей к конечному пункту переволоки, а другой к Тверминне. Петр I воспользовался разделением шведского флота и штилем, при котором парусный флот шведов не мог маневрировать, 26 июля (8 августа) русский авангард прорвался вдоль берега, обошел мыс и блокировал отряд Эреншельда, направленный к переволокам, в Рилакс-фьорде. 27 июля (9 августа) русский авангард, с подходом главных сил галерного флота, выстроились в боевой порядок, загнутые фланги которого почти полностью охватили неприятельские суда. Шведам было послано предложение о сдаче, но после получения отказа, началось Гангутское сражение. Три часа шел бой. Шведы отчаянно сопротивлялись. Но героические действия   русских моряков заставили их сдаться. Одно за другим их суда начали спускать флаги, т. е. сдаваться в плен. Был взят в плен и контр-адмирал Эреншильд.</p><p><b>З</b>НАЧЕНИЕ БИТВЫ:</p><ul><li>Гангутское сражение, явившееся первой крупной морской победой русского флота над сильным противником, обеспечило русским войсками возможность перенести боевые действия на территорию Швеции, а также дало возможность русскому флоту использовать выход в Ботнический залив и Балтийское море, предрешило успешное окончание Северной войны.</li></ul><p><b>Для справки:</b> В 1721 году был заключен договор между странами - Ништадский мир. Северная война после 21 года боевых действий была завершена. По ее итогам Россия получила: территорию Финляндии до Выборга и территории Эстляндии, Лифляндии, Ингерманландии.</p>", "10": "<p><b>Вопрос 1. Воинское приветствие</b></p><p><b>Воинское приветствие является воплощением товарищеской сплоченности военнослужащих</b>, свидетельством взаимного уважения и <b>проявлением вежливости и воспитанности.</b></p><p>Все военнослужащие обязаны при встрече (обгоне) приветствовать друг друга. Подчиненные приветствуют первыми начальников.</p><p><b>Военнослужащие обязаны выполнять воинское приветствие</b>, отдавая дань уважения:</p><ul><li>Могиле Неизвестного Солдата</li></ul><ul><li>братским могилам воином</li></ul><ul><li>Государственному флагу Российской Федерации, Боевому знамени воинской части.</li></ul><ul><li>похоронным процессиям, сопровождаемым воинскими подразделениями</li></ul><p><b>Воинское приветствие не отдается:</b></p><ul><li>после сигнала «Отбой» и до сигнала «Подъем»</li></ul><ul><li>при приеме пищи</li></ul><ul><li>при выполнении упражнений на тренировках</li></ul><ul><li>на огневом рубеже и огневой позиции во время проведения стрельб</li></ul><ul><li>в помещениях для больных</li></ul><ul><li>при подъеме воинской части по тревоге.</li></ul><p><b>Вопрос 2. Осмотр оружия и его подготовка к боевому применению. Чистка и смазка оружия</b></p><p><b>3.10.3. Осмотр и подготовка стрелкового оружия к боевому применению.</b></p><p>При ежедневном осмотре автомата военнослужащие обязаны:</p><ul><li>Убедиться в наличии всех частей автомата и проверить нет ли на наружных частях ржавчины, грязи, а также вмятин, царапин и забоин, и других повреждений, которые могут вызвать нарушение нормальной работы механизмов</li></ul><ul><li>Нет ли на деревянных частях трещин, сколов</li></ul><ul><li>Надежно ли крепление шомпола</li></ul><ul><li>Проверить состояние смазки на видимых без разборки автомата частях, наличие ремня, принадлежности, магазинов, сумок для них и штык-ножа</li></ul><ul><li>Проверить исправность прицела и мушки</li></ul><ul><li>Убедиться, что в канале ствола нет посторонних предметов</li></ul><p>Для подготовки автомата к стрельбе необходимо:</p><ul><li>Произвести чистку</li></ul><ul><li>Осмотреть автомат в разобранном виде и смазать его</li></ul><ul><li>Осмотреть автомат в собранном виде</li></ul><ul><li>Осмотреть магазины</li></ul><p><b>3.10.4. Чистка и смазка оружия.</b></p><p>Для чистки и смазки оружия применяются:</p><ul><li>жидкая ружейная смазка</li></ul><ul><li>ружейная смазка – при температуре воздуха выше +50С;</li></ul><ul><li>раствор РЧС</li></ul><ul><li>ветошь или бумага КВ-22</li></ul><ul><li>пакля (короткое льноволокно), очищенная от кострики</li></ul><p><b>Вопрос 3. Основные направления деятельности командира по управлению подразделением, их характеристика.</b></p><p><b>Основными направлениями (функциями) управления являются:</b></p><p><b>- учебно-боевая </b>(поддержание и совершенствование боевой и мобилизационной готовности, на неё приходится около 35% затрат общего времени)</p><p><b>- воспитательная </b>(Воинское воспитание заключается в формировании у личного состава высоких морально-боевых качеств, храбрости, стойкости. Содержание воинского воспитания определено Военной присягой, уставами и осуществляется в процессе боевой подготовки.)</p><p><b>- административно-хозяйственная </b>(направлена на организацию службы войск, поддержание уставного порядка, руководство ведением войскового хозяйства)</p><p><b>- военно-техническая </b>(призвана обеспечить организацию и руководство изобретательской деятельностью; освоение личным составом образцов вооружения)</p><p><b>- служебно-распорядительная </b>(предназначена для обеспечения выполнения намеченных повседневных мероприятий)</p><p><b>- контрольно-исполнительная </b>(Пронизывает все остальные виды. Ведущая роль в осуществлении контроля принадлежит командиру. Это обуславливается принципом единоначалия)</p><p><b>Вопрос 4. Морское сражение у мыса </b>Тендра<b> (1790 г.), значение сражения.</b></p><p><b>ХОД БИТВЫ:</b></p><p>В ходе русско-турецкой войне 1787–1791 гг. сухопутная армия России наступали в районе Дуная. Для помощи им была сформирована Днепровская флотилия, но совершить переход от Херсона в район боевых действий она не могла из-за присутствия на западе Черного моря турецкой эскадры, которая занял позиции между Гаджибеем (ныне Одесса) и мысом Тендра. Такое положение позволяло турецкому флоту держать под контролем важную для российского флота коммуникацию.</p><p>На помощь Днепровской флотилии вышла эскадра контр-адмирала Ф. Ф. Ушакова.</p><p>8 сентября 1790 года русские корабли неожиданно появились перед противником, стоявшем на якоре. С ходу, не перестроившись в боевой порядок, русская эскадра атаковала турецкий флот. Линия турецких судов расстроилась, и они стали спешно отходить к Дунаю. На следующий день Ушаков возобновил преследование. Экипажи черноморских кораблей проявляли высокое мастерство, поражая корабли противника меткой орудийной стрельбой. Открывая огонь, корабли, по команде Ушакова, сближались с противником, приводя врага в замешательство. В итоге — 7 турецких кораблей сдались, остальные спаслись бегством. Потери турок превысили 2 тыс. человек, у русских —21 человек погиб и 25 было ранено.</p><p><b>ЗНАЧЕНИЕ БИТВЫ:</b></p><ul><li>Победа русского флота обеспечила прорыв Днепровской флотилии в Дунай, оказавшей большую помощь сухопутной армии при взятии крепости Измаил, огнём артиллерии с судов флотилии.</li></ul><ul><li>Активность Турецкого флота в Чёрном море была парализована.</li></ul><p><b>Для справки: </b>Русский флот не знал более победоносного адмирала, чем Федор Фёдорович Ушаков. Под его командованием был завоёван Крым и из Средиземного моря были изгнаны французы. За всю свою карьеру он не потерпел ни одного поражения и не потерял ни одного корабля. В августе 2001 г. РПЦ прославила Феодора Ушакова в лике святых.</p>", "11": "<p><b>1. О воинской вежливости и поведении военнослужащих (статьи </b>67–74<b>).</b></p><p>Военнослужащие должны постоянно служить примером высокой культуры, скромности и выдержанности, свято блюсти воинскую честь, защищать свое достоинство и уважать достоинство других.</p><p>Военнослужащие должны соблюдать вежливость по отношению к гражданскому населению, проявлять особое внимание к пожилым людям, женщинам и детям, способствовать защите чести и достоинства граждан, а также оказывать им помощь при несчастных случаях.</p><p>Взаимоотношения между военнослужащими строятся на основе взаимного уважения.</p><p><b>Военнослужащим запрещается:</b></p><p><b>- </b>держать руки в карманах одежды</p><ul><li>сидеть или курить в присутствии начальника без его разрешения</li></ul><ul><li>курить на улицах на ходу и в местах, не отведенных для курения</li></ul><p><b>Трезвый образ жизни должен быть повседневной нормой</b> поведения всех военнослужащих. Появление в нетрезвом виде на службе и в общественных местах является грубым дисциплинарным проступком, позорящим честь и достоинство военнослужащего</p><p><b>2. ТТХ АК-74</b></p><p><b>Характеристики автомата АК-74</b></p><p>Калибр - 5,45х39 мм</p><p>Длина без штыка - 940 мм</p><p>Длина ствола - 415 мм</p><p>Масса неснаряженная - 3,07 кг</p><p>Масса со снаряженным магазином - 3,60 кг</p><p>Масса со штыком - 4,09 кг</p><p>Начальная скорость пули - 900 м/с</p><p>Темп стрельбы - 600 в/м</p><p>Скорострельность - 40–100 в/м</p><p>Прицельная дальность стрельбы - 1000 м</p><p>Емкость магазина - 30 патронов</p><p><b>3.</b>  Виды повседневной деятельности и их характеристика.</p><ul><li><b>Боевое дежурство</b> (обеспечивает немедленный переход к боевым действиям и надежное выполнение задач)</li></ul><ul><li><b>Боевую и мобилизационную готовность</b> (комплекс мероприятий по подготовке и проведению отмобилизования – переход воинской части на режим военного времени)</li></ul><ul><li><b>Боевую подготовку</b> (мероприятия по обучению и воспитанию личного состава для ведения боевых действий)</li></ul><ul><li><b>Службу войск</b> (поддержание правопорядка, воинской дисциплины и обеспечение безопасности военной службы)</li></ul><ul><li>Техническое (эксплуатация вооружения и военной техник) и тыловое обеспечение</li></ul><ul><li>Ведение войскового хозяйства</li></ul><ul><li>Финансово-экономическое обеспечение</li></ul><ul><li>Воспитательную и культурно-массовую работу</li></ul><ul><li>Спортивно-массовую работу</li></ul><ul><li>Социально-правовое обеспечение</li></ul><ul><li>Обеспечение безопасности воинской службы</li></ul><ul><li>Медицинское обеспечение</li></ul><ul><li>Работу с местным населением</li></ul><ul><li>Управленческую деятельность</li></ul><p><b>4. Взятие крепости Измаил (1790 г.), значение сражения.</b></p><p><b>ХОД БИТВЫ:</b></p><p>Штурм Измаила произошел на завершающем этапе Русско –Турецкой войны 1787–1791 гг.</p><p>13 декабря 1790 года, когда под Измаил прибыл Суворов, русские войска уже не раз пытались взять крепость штурмом, но терпели неудачу. Прибыв на место, Суворов немедленно приказал обложить город со всех сторон и построить копию их валов и рва. После этого начались ночные тренировки солдат по взятию этих укреплений. По их готовности к штурму, турецкому командованию было предложено сдаться, на что последовал отказ. После суточного артобстрела крепости (600 орудий), 22 декабря в 5.30 утра начался штурм 9 колоннами при поддержки Днепровской флотилии генерал-майора Хосе де Рибаса. Меньше чем за час внешние укрепления были взяты, а ворота открыты и через них в город въехала кавалерия и полевые орудия. После упорного боя русские войска сломили ожесточенное сопротивление противника и к 11 часам крепость была взята.</p><p><b>ЗНАЧЕНИЕ БИТВЫ:</b></p><ul><li>Победа при штурме Измаила явила собой очередной пример отваги и героизма русских солдат и офицеров. Полководческий гений Суворова был не только в тщательной разработке плана сражений, но и в неустанной поддержке боевого духа русского войска.</li></ul><ul><li>Взятие Измаила способствовало успешному окончанию войны с Турцией 1791 г., заключению Ясского мира между Россией и Турцией. Договор закрепил за Россией Крым и всё Северное Причерноморье. К России отошли земли между Южным Бугом и Днестром. На Кавказе восстанавливалась граница по р. Кубань. Турция отказывалась от претензий на Грузию.</li></ul>", "12": "<p><b>1. Военнослужащие и взаимоотношения между ними (Глава 2 УВС ВС).</b></p><p>Устав внутренней службы ВС определяет общие права и обязанности военнослужащих и взаимоотношения между ними, обязанности основных должностных лиц полка и его подразделений, а также правила внутреннего порядка.</p><p><b>Единоначалие. Командиры (начальники) и подчиненные. Старшие и младшие (статьи </b>33–38<b>).</b></p><p><b>Статья 33:</b></p><p><b>Единоначалие является одним из основных принципов строительства Вооруженных Сил. Единоначалие заключается в наделении командира (начальника) всей полнотой распорядительной власти по отношению к подчиненным</b> и возложении на него персональной ответственности перед государством за все стороны жизни и деятельности воинской части, подразделения и каждого военнослужащего.</p><p>Единоначалие выражается в праве командира единолично принимать решения, отдавать в установленном порядке приказы и обеспечивать их выполнение.</p><p><b>Статья 34:</b></p><p><b>По своему служебному положению и воинскому </b>званию одни <b>военнослужащие</b> по отношению <b>могут быть начальниками или подчиненными</b>. Начальник имеет право отдавать подчиненному приказы и требовать их исполнения. <b>Подчиненный обязан беспрекословно выполнять</b> приказы начальника</p><p><b>Статья 35:</b></p><p>Начальники, которым военнослужащие подчинены по службе являются прямыми начальниками. Ближайший прямой начальник называется непосредственным начальником.</p><p><b>Статья 37:</b></p><p>Военнослужащие, которые по своему служебному положению и воинскому званию не являются по отношению к другим военнослужащим начальниками или подчиненными, могут быть старшими или младшими. Старшинство определяется воинскими званиями.</p><p><b>Статья 38:</b></p><p>При совместном исполнении обязанностей военнослужащими, не подчиненными друг другу (если их служебные взаимоотношения не определены командиром) старший из них по воинской должности, а при равных должностях старший по воинскому званию, является начальником</p><p><b>Приказ (приказание), порядок его отдачи и выполнения (статьи 39–45).</b></p><p><b>Приказ может быть отдан в письменном виде, устно или по техническим средствам связи </b>одному или группе военнослужащих.</p><p><b>Обсуждение (критика) приказа недопустимо</b>, <b>а неисполнение приказа</b> командира (начальника), отданного в установленном порядке<b>, является преступлением</b> против военной службы.</p><p><b>Отдание приказа (приказания) начальником должно сопровождаться выполнением следующих условий:</b></p><p class=\"li\">1. Приказ (приказание) должен соответствовать требованиям законов и воинских уставов. Военнослужащему не могут отдаваться приказы, направленные на нарушение закона.</p><p class=\"li\">2. Военнослужащему не могут отдаваться приказы, распоряжения и ставиться задачи, не имеющие отношения к военной службе.</p><p class=\"li\">3. Начальник перед отдачей приказа обязан всесторонне оценить обстановку и предусмотреть меры по обеспечению его выполнения.</p><p class=\"li\">4. Приказ должен быть сформулирован ясно, не допускать двоякого толкования и не вызывать сомнения у подчиненного.</p><p class=\"li\">5. Приказы отдаются в порядке подчиненности.</p><p class=\"li\">6. При крайней необходимости старший начальник может отдать приказ подчиненному, минуя его непосредственного начальника. В таком случае он сообщает об этом непосредственному начальнику подчиненного или приказывает подчиненному самому доложить своему непосредственному начальнику.</p><p><b>Принятие приказа сопровождается выполнением следующих условий:</b></p><p class=\"li\">1. Военнослужащий, получив приказ, отвечает «Есть» и затем выполняет</p><p class=\"li\">2. Приказ должен быть выполнен беспрекословно, точно и в срок</p><p class=\"li\">3. При необходимости обратиться с просьбой к командиру повторить приказ</p><p class=\"li\">4. Если военнослужащий, выполняющий приказ, получит от другого начальника, старшего по служебному положению, новый приказ, который помешает выполнить первый, он докладывает об этом начальнику, отдавшему второй приказ, и в случае его подтверждения выполняет последний</p><p><b>Воинское приветствие</b></p><p><b>Воинское приветствие является воплощением товарищеской сплоченности военнослужащих</b>, свидетельством взаимного уважения и <b>проявлением вежливости и воспитанности.</b></p><p>Все военнослужащие обязаны при встрече (обгоне) приветствовать друг друга. Подчиненные приветствуют первыми начальников.</p><p><b>Военнослужащие обязаны выполнять воинское приветствие</b>, отдавая дань уважения:</p><ul><li>Могиле Неизвестного Солдата</li></ul><ul><li>братским могилам воином</li></ul><ul><li>Государственному флагу Российской Федерации, Боевому знамени воинской части.</li></ul><ul><li>похоронным процессиям, сопровождаемым воинскими подразделениями</li></ul><p><b>Воинское приветствие не отдается:</b></p><ul><li>после сигнала «Отбой» и до сигнала «Подъем»</li></ul><ul><li>при приеме пищи</li></ul><ul><li>при выполнении упражнений на тренировках</li></ul><ul><li>на огневом рубеже и огневой позиции во время проведения стрельб</li></ul><ul><li>в помещениях для больных</li></ul><ul><li>при подъеме воинской части по тревоге.</li></ul><p><b>О воинской вежливости и поведении военнослужащих (статьи </b>67–74<b>).</b></p><p>Военнослужащие должны постоянно служить примером высокой культуры, скромности и выдержанности, свято блюсти воинскую честь, защищать свое достоинство и уважать достоинство других.</p><p>Военнослужащие должны соблюдать вежливость по отношению к гражданскому населению, проявлять особое внимание к пожилым людям, женщинам и детям, способствовать защите чести и достоинства граждан, а также оказывать им помощь при несчастных случаях.</p><p>Они должны помнить, что по их поведению судят не только о них, но и о чести ВС в целом. Взаимоотношения между военнослужащими строятся на основе взаимного уважения.</p><p><b>Военнослужащим запрещается:</b></p><p><b>- </b>держать руки в карманах одежды</p><ul><li>сидеть или курить в присутствии начальника без его разрешения</li></ul><ul><li>курить на улицах на ходу и в местах, не отведенных для курения</li></ul><p><b>Трезвый образ жизни должен быть повседневной нормой</b> поведения всех военнослужащих. Появление в нетрезвом виде на службе и в общественных местах является грубым дисциплинарным проступком, позорящим честь и достоинство военнослужащего</p><p><b>2. Порядок неполной разборки автомата Калашникова</b></p><p>1.Отделить магазин</p><p>2.Проверяем патрон в патроннике, включаем предохранитель</p><p>3.Вытаскиваем пенал</p><p>4.Вытащить дульный тормоз компенсатор</p><p>5.Вытаскиваем ударом шомпол</p><p>6.Вытаскиваем крышку ствольной коробки</p><p>7.Вытаскиваем пружину (возвратный механизм)</p><p>8.Вытаскиваем затворный механизм с затвором</p><p>9.Ставим флажок и вытаскиваем газовую трубку со ствольной накладкой</p><p><b>3. Характеристика материально-технической базы воинской части, обеспечивающая её</b> повседневную деятельность</p><p><b>Материально-техническая база включает объекты</b>:</p><ul><li>Хозяйственного (казарменно-жилищный фонд, бани и прачечные, склады)</li></ul><ul><li>Технического (коммунальные сооружения и инженерные сети, парки и мастерские, автодороги необщего назначения)</li></ul><ul><li>Медицинского назначений (полковой медицинский пункт)</li></ul><ul><li>Учебно-материальной базы боевой подготовки (плац, спортгородок, стрельбище, автодромы, городок боевой работы, полигоны, танкодромы)</li></ul><ul><li>Воспитательной работы (клубы, библиотеки, комната досуга, музей)</li></ul><ul><li>Службы войск (учебные классы, виды вооружения и техники, караульные городки, вещевое имущество, продовольствие)</li></ul><p><b>4. Бородинское сражение (1812 г.), значение сражения.</b></p><p><b>ХОД БИТВЫ:</b></p><p>Бородинское сражение в 125 км от Москвы, началось 26 августа 1812 года в 5:30 утра, и продолжалось больше 12 часов. Французская армия начала сражение перестрелкой полка гвардейских егерей на правом фланге у деревни Бородино, а спустя час был нанесен главный удар по левому флангу (Багратионовы флеши).  Первую атаку русские войска отбили. Наполеоном были переброшены на левый фланг новые силы и сосредоточена там вся артиллерия. Кутузов отдал приказ совершить рейд во французский тыл, чтобы отвлечь часть войск на себя, дав возможность Багратиону снова перейти в наступление. Тем временем
