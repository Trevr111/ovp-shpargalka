а также войск ряда союзных им государств, против нацистской Германии в 1944–1945 гг. в Западной Европе был открыт 6 июня 1944 г. высадкой англо-американских экспедиционных сил на территории Северной Франции (Нормандская десантная операция)</p><p>Общее руководство боевыми операциями союзников в Европе было возложено на командующего экспедиционными силами генерала Д. Эйзенхауэра. Во главе английской группы войск стоял фельдмаршал Б. Монтгомери. Открытие второго фронта искренне приветствовали в Москве.</p><p>Но за двухлетний период откладывания союзниками высадки в Северной Франции — с мая 1942 до июня 1944 гг. только безвозвратные потери советских вооруженных сил (убитыми, пленными и пропавшими без вести) составили более 5 млн человек.</p><p>В ходе подготовки к операции, получившей кодовое название «Оверлорд», союзники сосредоточили в Британии 4 армии: 1-ю и 3-ю американские, 2-ю английскую и 1-ю канадскую. Их составе было 37 дивизий (включая 10 бронетанковых и 4 воздушно-десантных) и 12 бригад. Для десантной операции выделялось 1213 боевых кораблей, свыше 4100 десантных судов, барж и катеров, около 1600 торговых и вспомогательных судов. ВВС союзников начитывали более 10200 боевых и 1360 транспортных самолетов, 3500 планеров.</p><p><b>Значение:</b></p><ul><li>Операция «Оверлорд» действительно облегчила положение Красной Армии, приблизило разгром гитлеровской Германии и сберегло жизни значительному количеству советских солдат, а нацисты лишились свободных резервов для переброски на Восточный фронт.</li></ul><ul><li>Не оспаривая вклад союзников в победу над немецким нацизмом в то же время, очевидно, что решающий вклад в освобождение Европы сыграл все-таки Советский Союз и его Красная армия.</li></ul><p>Об этом свидетельствует тот факт, что наиболее ожесточенные сражения в 1944–1945 годах, когда, наконец-то, 6 июня 1944 года, был открыт второй фронт, происходили все же на советско-германском направлении.</p>", "23": "<p><b>1. Порядок применения и объявления поощрений военнослужащим (статьи </b>34–35<b>, 45)</b></p><p>Командиры (начальники) могут применять поощрения как в отношении отдельного военнослужащего, так и в отношении всего личного состава воинской части (подразделения).</p><p>За <b>одно отличие</b> военнослужащий может быть поощрен <b>только один раз.</b></p><p>При определении вида поощрения принимаются во внимание <b>характер заслуг, усердие и отличия военнослужащего, а также прежнее отношение его к военной службе</b>.</p><p>Военнослужащий, имеющий дисциплинарное взыскание, может быть <b>поощрен только путем снятия ранее примененного взыскания</b>. Право снятия дисциплинарного взыскания принадлежит тому командиру (начальнику), которым взыскание было применено, а также его прямым начальникам, имеющим не меньшую, чем у него, дисциплинарную власть.</p><p>Одновременно с военнослужащего может быть снято только одно дисциплинарное взыскание.</p><p>Командир (начальник) имеет право снять дисциплинарное взыскание только после того, как оно сыграло свою воспитательную роль.</p><p><b>Порядок объявления поощрений военнослужащим</b>: Поощрения объявляются перед строем, на собраниях или совещаниях военнослужащих, в приказе или лично в торжественной обстановке.</p><p><b>3. Порядок обеспечения вещевым имуществом военнослужащих.</b></p><p>Зачисление военнослужащих на вещевое обеспечение воинской части производится вещевой службой воинской части с оформлением карточки учета материальных ценностей личного пользования на каждого военнослужащего на основании аттестата военнослужащего и приказа командира воинской части.</p><p>Контроль за своевременным обеспечением военнослужащих вещевым имуществом осуществляют командиры воинских частей.</p><p><b>Завоз вещевого имущества</b> военными округами (флотами) для обеспечения соединений и воинских частей производится:</p><ul><li>по летнему плану - до 1 марта;</li></ul><ul><li>по зимнему плану - до 1 сентября.</li></ul><p><b>Отпуск вещевого имущества</b> с баз (складов) военных округов (флотов) соединениям (военно-морским базам) и воинским частям производится:</p><ul><li>по летнему плану - до 1 апреля;</li></ul><ul><li>по зимнему плану - до 1 октября.</li></ul><p><b>Обеспечение военнослужащих</b> вещевым имуществом в воинских частях и отдельных подразделениях производится:</p><ul><li>по летнему плану - до 15 мая;</li></ul><ul><li>по зимнему плану - до 15 ноября.</li></ul><p>Воинские части, не ведущие хозяйственную деятельность, прикрепляются на вещевое обеспечение к ближайшим воинским частям, ведущим хозяйственную деятельность.</p><p><b>4. Взятие Берлина. Историческое значение операции.</b></p><p>16 апреля 1945 г. началось наступление на столицу Германии — Берлин</p><p><b>Силы сторон:</b></p><p>Группировка противника, состоявшая из двух групп армий «Висла» и «Центр», достигала по численности 1 млн человек, 10 400 орудий и миномётов, 1 500 танков и штурмовых орудий, 3 300 боевых самолётов.</p><p>Группировка советских войск насчитывала свыше 2 млн человек, около 42 тыс. орудий и миномётов, 6 250 танков и САУ, 7 500 боевых самолётов.</p><p><b>Замысел Ставки ВГК </b>предусматривал мощными ударами на широком фронте прорвать оборону противника на шести участках, окружить всю берлинскую группировку, одновременно расчленить её на части и уничтожить каждую из них в отдельности. В дальнейшем, на 12-й — 15-й день операции, выйти к Эльбе и соединиться с союзниками.</p><p>16 апреля в 3 часа по местному времени началась авиационная и артиллерийская подготовка на участке 1-го Белорусского и 1-го Украинского фронтов. После ее окончания были включены 143 прожектора, чтобы ослепить противника, и в атаку пошла пехота, поддержанная танками.</p><p><b>Штурм рейхстага:</b></p><p>29 апреля начались бои за рейхстаг, овладение которым было возложено на 79 стрелковый корпус Ударной армии 1-го Белорусского фронта.</p><p>Бои за рейхстаг продолжались до утра 1 мая. В 6 часов 30 минут утра 2 мая начальник обороны Берлина генерал артиллерии Г. Вейдлинг сдался в плен и отдал приказ остаткам войск берлинского гарнизона о прекращении сопротивления. Капитуляцию берлинского гарнизона принял командующий 8-й гвардейской армией генерал В. И. Чуйков, прошедший путь от Сталинграда до стен Берлина.</p><p><b>Значение битвы:</b></p><ul><li>Завершение операции означало окончательный разгром фашистской Германии и её вооружённых сил.</li></ul><ul><li>9 мая 1945 г. в присутствии Маршала Г. К. Жукова с советской стороны, генерал-фельдмаршала В. Кейтеля, а также представители немецких ВМС, имевшие соответствующие полномочия от Деница, подписали</li></ul><p>Акт о безоговорочной капитуляции Германии.</p><ul><li>Массовая сдача в плен остатков вермахта и войск СС.</li></ul><ul><li>Командовали: Маршал Сов. Союза Г. К. Жуков, Маршал Сов. Союза И. С. Конев, Маршал Сов. Союза К. К. Рокоссовский.</li></ul><p><b>2. </b>Характеристика <b>и </b>боевые свойства ручных наступательных<b>, оборонительных и противотанковых гранат.</b></p><p>РКГ-3: масса: 1070г, 400 мм длина, 170 мм бронебойность, дальность броска 15-20м.</p>", "24": "<p><b>Вопрос 1. Дисциплинарные взыскания, применяемые на военнослужащих, их предназначение и виды (ст.54).</b></p><p>Дисциплинарное взыскание является установленной государством мерой ответственности за дисциплинарный проступок, совершенный военнослужащим.</p><p>Применяется в целях предупреждения совершения дисциплинарных проступков.</p><p>К военнослужащему могут применяться следующие виды дисциплинарных взысканий:</p><ul><li>выговор;</li></ul><ul><li>строгий выговор;</li></ul><ul><li>лишение очередного увольнения из расположения воинской части или с корабля на берег;</li></ul><ul><li>лишение нагрудного знака отличника;</li></ul><ul><li>предупреждение о неполном служебном соответствии;</li></ul><ul><li>снижение в воинской должности;</li></ul><ul><li>снижение в воинском звании на одну ступень;</li></ul><ul><li>снижение в воинском звании на одну ступень со снижением в воинской должности;</li></ul><ul><li>досрочное увольнение с военной службы в связи с невыполнением условий контракта;</li></ul><ul><li>отчисление из военного образовательного учреждения профессионального образования;</li></ul><ul><li>отчисление с военных сборов;</li></ul><ul><li>дисциплинарный арест.</li></ul><p><b>Вопрос 2. Назначение, общее устройство и классификация боевых патронов к стрелковому оружию.</b></p><p>В зависимости от назначения патроны разделяются на боевые и вспомогательные.</p><p>Боевые патроны предназначаются для стрельбы из боевого индивидуального и группового стрел­кового оружия с целью поражения живой силы и техники.</p><p>Вспомогательные патроны предназначаются для обучения правилам и приемам заряжания и разряжения оружия, имитации стрельбы, проверки прочности оружия и определения баллистических харак­теристик оружия и патронов.</p><p><b>В зависимости от вида используемого оружия различают:</b></p><ul><li>револьверные патроны, применяемые для стрельбы из револьверов;</li></ul><ul><li>пистолетные патроны, применяемые для стрельбы из пистолетов и пистолетов-пулеметов автоматов под пистолетный патрон;</li></ul><ul><li>автоматные патроны, применяемые для стрельбы из автоматов, ручных пулеметов и самозарядно­го оружия;</li></ul><ul><li>винтовочные патроны, применяемые для стрельбы из ручных, станковых, танковых и авиационных пулеметов, а также из винтовок и карабинов;</li></ul><ul><li>крупнокалиберные патроны, применяемые для стрельбы из крупнокалиберных пулеметов.</li></ul><p><b>Боевой патрон</b></p><p>Боевой патрон состоит, из следующих основных составных частей:</p><p>1 — метаемого элемента — пули;</p><p>2 – гильзы;</p><p>3 — метательного заряда;</p><p>4 — капсюля-воспламенителя.</p><p><b>Вопрос 3. Основы денежного довольствия военнослужащих по призыву и по контракту.</b></p><p class=\"li\">1. <b>Денежное довольствие </b>военнослужащих, проходящих военную службу <b>по контракту</b>, <b>является основным средством их материального обеспечения</b> и стимулирования исполнения обязанностей военной службы.</p><p class=\"li\">2. Денежное довольствие военнослужащего, проходящего военную службу по контракту, состоит из месячного оклада в соответствии с присвоенным воинским званием и месячного оклада в соответствии с занимаемой воинской должностью, которые составляют оклад месячного денежного содержания военнослужащего, и из ежемесячных и иных дополнительных выплат.</p><p class=\"li\">3. Денежное довольствие военнослужащего, проходящего военную службу по призыву, состоит из оклада по воинской должности и дополнительных выплат.</p><p><b>Ежемесячные надбавки военнослужащим:</b></p><ul><li>надбавка за выслугу лет</li></ul><ul><li>надбавка за классную квалификацию к окладу по воинской должности.</li></ul><ul><li>надбавка за работу со сведениями, составляющими государственную тайну (до 65% от оклада)</li></ul><ul><li>надбавка за особые условия военной службы (до 100% от оклада)</li></ul><ul><li>надбавка за выполнение задач, непосредственно связанных с риском для жизни и здоровья в мирное время (до 100% от оклада)</li></ul><ul><li>надбавка за особые достижения в службе (до 100% от оклада)</li></ul><p><b>Вопрос 4. Всемирно-историческое значение победы советского народа в Великой Отечественной войне 1941–1945 гг.</b></p><p><b>1. Наша страна стала главной преградой на пути распространения немецко-фашистского господства и японского милитаризма над другими народами и вынесла основную тяжесть этой войны</b>. На советско-германском фронте находилось подавляющее большинство дивизий вермахта. По ожесточенности, размаху и активности боев он намного превосходил другие фронты Второй мировой войны. На Восточном фронте враг понес 73% совокупных потерь. Вооруженные Силы СССР уничтожили 507 немецких дивизий и 100 дивизий стран – сателлитов Германии.  Англия и США разбили в Западной Европе, Северной Африке и Италии не более 176 дивизий.</p><p><b>2. </b>Именно советский народ сокрушил фашизм - самое мрачное порождение эпохи, отстоял свободу и независимость своего государства. Низвергнув фашизм вместе с армиями других государств антигитлеровской коалиции, Советский Союз спас человечество от угрозы порабощения, но понёс большие потери: около 27 <b>млн</b> человек, из них <b>10–11 </b> млн. человек-боевые потери, 16-17 млн. чел. жители СССР, оказавшиеся на оккупированной немецко-фашистскими войсками территории   Советского Союза. Долгим, в 1418 дней и ночей, и трудным был путь к Победе.</p><p><b>3. </b>Победа советского народа над германским нацизмом оказала огромное воздействие на весь дальнейший ход мировой истории, на решение коренных социальных проблем современности<b>.</b></p><p><b>4</b>. Победа Советского Союза способствовала росту его международного авторитета и влияния на мировой арене. <b>Так, если в 1941 году дипломатические отношения с Советским Союзом поддерживали 26 стран, то в 1945 году уже 52 государства.</b></p><p><b>5</b>. Победа Советского Союза способствовала созданию Организации Объединенных Наций (ООН), Устав которой был подписан 26 июня 1945 в Сан-Франциско 50-ю государствами (СССР, США, Великобританией, Китаем и другими).</p><p><b>6. </b>Разгром нацистской Германии, и ее союзников <b>разрушил </b>мировую колониальную<b> систему. </b>Если к началу Второй мировой войны в рамках колониальной системы находилось 69% населения и 77% территории земного шара, то к середине 70-х годов эти показатели составили соответственно 0,2 и 0,5%. На месте прежних колоний образовалось около 100 суверенных государств</p><p><b>7. </b>Победа Советского Союза разрушила надежды реакционных кругов западных держав на <b>ослабление нашей страны. </b>СССР вышел из войны еще более окрепшим в политическом и военном отношении, неизмеримо поднялся его международный авторитет.</p><p><b>8. </b>Состоялся Нюрнбергский процесс, на котором впервые в истории международных отношениях агрессия была признана тягчайшим преступлением против человечества. Международный военный трибунал признал всех подсудимых (за исключением Шахта, Фриче и фон Папена) виновными в осуществлении заговора в целях подготовки и ведения агрессивных войн, а также в совершении бесчисленных военных преступлений и тягчайших злодеяний против человечности. К смертной казни через повешение были приговорены 12 нацистских преступников: Геринг, Риббентроп, Кейтель, Кальтенбруннер, Розенберг, Франк, Фрик, Штрейхель, Заукель, Йодль, Зейсс-Инкварт, Борман (заочно). Остальные получили различные сроки тюремного заключения: Гесс, Функ, Редер — пожизненно, Ширах и Шпеер — 20 лет, Нейрат — 15 лет, Дениц — 10 лет.</p><p><b>Артиллерия в годы Великой Отечественной Войны:</b></p><ul><li>За время Великой Отечественной войны 1941–1945 гг. советские артиллеристы уничтожили около 85 % всех поражённых целей противника, одержав победу и в противоборстве с его артиллерией. Артиллерия – первый род войск, в честь которого в годы Великой Отечественной войны был учреждён праздник.</li></ul><ul><li>О признании выдающихся  боевых заслуг советской артиллерии в годы минувшей войны говорит тот факт, что Указом Президиума Верховного Совета  СССР от 21 октября 1944 г. был установлен праздник – День артиллерии ( с 1964 г.- День ракетных войск и артиллерии), который отмечается ежегодно -19 ноября.</li></ul>", "25": "<p><b>Вопрос 1. Порядок применения и снятия дисциплинарного взыскания (статьи 36, </b>80–81<b>).</b></p><p><b>80.</b> К военнослужащему, совершившему дисциплинарный проступок, могут применяться только те дисциплинарные взыскания, которые определены настоящим Уставом, соответствуют воинскому званию военнослужащего и дисциплинарной власти командира (начальника), принимающего решение о привлечении нарушителя к дисциплинарной ответственности.</p><p><b>81.</b> Принятию командиром (начальником) решения о применении к подчиненному военнослужащему дисциплинарного взыскания предшествует разбирательство. Разбирательство проводится в целях установления виновных лиц, выявления причин и условий, способствовавших совершению дисциплинарного проступка. Разбирательство проводится непосредственным командиром (начальником) военнослужащего.</p><p>Материалы разбирательства о грубом дисциплинарном проступке оформляются только в письменном виде.</p><p><b>В ходе разбирательства должно быть установлено:</b></p><p class=\"li\">1. событие дисциплинарного проступка (время, место, способ…)</p><p class=\"li\">2. лицо</p><p class=\"li\">3. вина, форма вины и мотивы;</p><p class=\"li\">4. данные, характеризующие личность</p><p class=\"li\">5. наличие и характер вредных последствий</p><p class=\"li\">6. обстоятельства, исключающие дисциплинарную ответственность</p><p class=\"li\">7. обстоятельства, смягчающие</p><p class=\"li\">8. характер и степень участия каждого из военнослужащих</p><p class=\"li\">9. причины и условия</p><p><b>Грубый дисциплинарный проступок:</b></p><p>При совершении военнослужащим грубого дисциплинарного проступка или при получении данных о его совершении непосредственный командир (начальник) военнослужащего обязан немедленно доложить об этом в установленном порядке командиру воинской части. Составляется протокол.</p><p><b>Преступление:</b></p><p>Если в ходе разбирательства выяснится, что в действиях военнослужащего усматриваются признаки преступления, лицо, проводящее разбирательство, обязано незамедлительно доложить об этом в установленном порядке командиру воинской части и действовать в соответствии с его указаниями. Командир воинской части незамедлительно уведомляет об этом военного прокурора, руководителя военного следственного органа Следственного комитета Российской Федерации, а командир воинской части - также органы военной полиции и принимает меры, предусмотренные законодательством Российской Федерации.</p><p><b>81.1.</b> Срок разбирательства не должен превышать 30 суток с момента, когда командиру (начальнику) стало известно о совершении военнослужащим дисциплинарного проступка.</p><p><b>36. Снятие дисциплинарного взыскания</b> - дисциплинарный арест - осуществляется командиром воинской части, в случае если военнослужащий не совершит нового дисциплинарного проступка: с солдат - не ранее трех месяцев после исполнения постановления судьи гарнизонного военного суда о назначении дисциплинарного ареста; с сержантов и старшин - не ранее чем через шесть месяцев; с прапорщиков - не ранее чем через год.</p><p><b>Вопрос 2. Условия выполнения учебных стрельб 2 УКС из АК-74.</b></p><p><b>Стрельба с места по появляющимся целям со сменой огневой позиц</b>ии</p><p><b>Цели</b>:</p><ul><li>спешивающаяся пехота – две ростовые фигуры (мишень №8) на фронте 6–8 метров, появляются два раза по 10 секунд с промежутком 10 секунду</li></ul><ul><li>появляющаяся цель – два стрелка – поясные фигуры (мишень №7) на фронте не менее 6 метров, расположенные на разных рубежах, имитируя движения цели.</li></ul><ul><li>Залегшая пехота – две фигуры: ручной пулемет (мишень №10) и стрелок – грудная фигура (мишень №6) на фронте не менее 6 метров появляются на 30 секунд</li></ul><ul><li>Два атакующих стрелка – две ростовые фигуры (мишень №8) на фронте 6–8  метров, расположенные на площади (в габарите) по фронту 10 метров и в глубину 5 метров для метания имитационных ручных гранат, появляются на 20 секунд</li></ul><p><b>Дальности до целей:</b></p><ul><li>Спешивающаяся пехота 400–500 метров</li></ul><ul><li>Атакующая группа пехота 300–400 метров</li></ul><ul><li>Залегшая пехота 200–300 метров</li></ul><p><b>Оценка</b>:</p><ul><li>«отлично»\tпоразить все цели и попасть гранатой в габарит и выполнить норматив №7 по тактической подготовке с оценкой «отлично»</li></ul><ul><li>«хорошо»\tпоразить две цели, в том числе атакующую группу пехоты, попасть гранатой в габарит и выполнить норматив №7 по тактической подготовке с оценкой «хорошо»</li></ul><ul><li>«удовлетворительно»\tпоразить две цели и выполнить норматив №7 по тактической подготовке с оценкой «удовлетворительно»</li></ul><p><b>Вопрос 3. Основные задачи и организация боевой подготовки в       артиллерийском подразделении.</b></p><p><b>Боевая подготовка ВС РФ представляет собой</b> целенаправленный, организованный процесс воинского обучения и воспитания личного состава, боевого слаживая подразделений, воинский частей и их органов управления для выполнения боевых задач.</p><p><b>Основные задачи:</b></p><ul><li>поддержание высокой боевой готовности подразделений</li></ul><ul><li>привитие военнослужащим твердых профессиональных знаний и умений</li></ul><ul><li>подготовка военнослужащих к выполнению своих должностных и специальных обязанностей</li></ul><ul><li>слаживание экипажей, расчетов, подразделений</li></ul><ul><li>освоение новых образцов техники и вооружения, привитие знаний о ее техническом обслуживании</li></ul><ul><li>проверка в ходе обучения существующих уставных положений по организации и ведению бою</li></ul><ul><li>слаживание органов управления</li></ul><ul><li>обучение военнослужащих строгому и точному выполнению законов и общевоинских уставов</li></ul><ul><li>выработка у личного состава высокой психологической устойчивости</li></ul><ul><li>разработка средств и приемом совершенствования методик обучения и воспитания</li></ul><p><b>Организация боевой подготовки включает в себя:</b></p><ul><li>принятие решения на организацию боевой подготовки</li></ul><ul><li>планирование боевой подготовки</li></ul><ul><li>согласование разработанных документов и представление их на утверждение</li></ul><ul><li>контроль организации и хода боевой подготовки, оценка ее итогов</li></ul><ul><li>организация руководства боевой подготовкой</li></ul><p><b>Вопрос 4.  Цель, задачи и основные мероприятия военно-политической работы в Вооружённых Силах Российской Федерации, их характеристика.</b></p><p>П Р И К А З МИНИСТРА ОБОРОНЫ РОССИЙСКОЙ ФЕДЕРАЦИИ No 404 22 июля 2019 г.</p><p>ОБ ОРГАНИЗАЦИИ ВОЕННО-ПОЛИТИЧЕСКОЙ РАБОТЫ В ВООРУЖЕННЫХ СИЛАХ РОССИЙСКОЙ ФЕДЕРАЦИИ</p><p><b>Военно-политическая работа в Вооруженных Силах представляет собой:</b></p><p>комплекс согласованных и взаимосвязанных по целям, задачам, месту и времени мероприятий военно-политической пропаганды и агитации, психологических, культурно-досуговых и иных мероприятий, направленных на обеспечение высокого уровня морально-политического и психологического состояния личного состава, правопорядка и воинской дисциплины, формирование у военнослужащих морально-политических и психологических качеств, сплоченных воинских коллективов, обеспечивающих выполнение задач по предназначению в любых условиях.</p><p><b>Основной целью</b> является формирование и развитие у военнослужащих качеств патриота, военного профессионала и высоконравственной личности</p><p><b>Задачами военно-политической работы являются:</b></p><ul><li><b>поддержание высокого уровня морально</b>-политического <b>и психологического состояния</b> личного состава;</li></ul><ul><li><b>формирование у личного состава чувства патриотизма</b>, военно-политического сознания и культуры, осознанного отношения к выполнению воинского долга, приказов командиров и начальников, трудовых (служебных) обязанностей, требований законодательных и иных правовых актов Российской Федерации;</li></ul><ul><li><b>повышение мотивации профессионального мастерства военнослужащих,</b> формирование у них стремления к добросовестной высокоэффективной служебной и боевой деятельности;</li></ul><ul><li><b>обеспечение правопорядка и воинской дисциплины в воинских частях,</b> формирование у личного состава правовой культуры;</li></ul><ul><li><b>создание условий для удовлетворения военнослужащими, членами их семей</b> и лицами гражданского персонала Вооруженных Сил культурных и духовных <b>потребностей</b>, реализации установленных законодательством Российской Федерации <b>прав и социальных гарантии.</b></li></ul>", "26": "<p><b>1. Порядок привлечения к дисциплинарной ответственности и права военнослужащих, привлекаемых к ней (ст.47, 48).</b></p><p class=\"li\">47. Военнослужащие несут дисциплинарную ответственность за противоправные действия или нарушения воинской дисциплины. Это не влечет за собой уголовной или административной ответственности.</p><p>За административные правонарушения военнослужащие несут дисциплинарную ответственность, за исключением случаев, когда они несут ответственность на общих основаниях.</p><p>Военнослужащий привлекается к дисциплинарной ответственности только при наличии его вины в совершении дисциплинарного проступка. Вина может быть установлена решением командира (начальника) или судьи военного суда.</p><p class=\"li\">48. Военнослужащий, привлекаемый к дисциплинарной ответственности, имеет право на следующее:</p><p class=\"li\">1. Давать объяснения и представлять доказательства своей защиты.</p><p class=\"li\">2. Пользоваться адвокатом с момента принятия решения о назначении судебного рассмотрения материалов проступке судьей или с момента задержания.</p><p class=\"li\">3. Знакомиться со всеми материалами по окончании разбирательства.</p><p class=\"li\">4. Обжаловать действия и решения командира.</p><p class=\"li\">5. Участвовать в судебном рассмотрении материалов.</p><p><b>2. Упражнение учебных стрельб из пистолета (1уус).</b></p><p>Обучение точному прицеливанию и меткой стрельбе по неподвижной цели днём</p><ul><li>Цель: грудная фигура с кругами (мишень №4) на щите 0,75x0,75 метра, установленная на высоте уровня глаз; неподвижная</li></ul><ul><li>Дальность до цели: 25 метров</li></ul><ul><li>Количество патронов: 3</li></ul><ul><li>Время на стрельбу: 5 минут</li></ul><ul><li>Положения для стрельбы: стоя с руки</li></ul><p>Оценка:</p><ul><li>“отлично” - выбить 25 очков</li></ul><ul><li>“хорошо” - 21</li></ul><ul><li>“удовлетворительно” - 18</li></ul><p>Количество выбитых очков определяется только по попавшим в фигуру пулям. Первые 3 патрона пробные, вторые 3 патрона в зачет</p><p><b>3. Планирование боевой подготовки в батарее (взводе).  Расписание занятий в подразделении.</b></p><p>Планирование мероприятий по боевой подготовке в ВС РФ на очередной учебный год осуществляется планомерно и в течение апреля-ноября текущего года, которое условно можно разделить на три этапа:</p><p class=\"li\">1. <b>На первом этапе (апрель – май)</b> Генеральный штаб направляет в центральные военные органы Министерства обороны, в виды ВС, рода войск и военные округа директиву об организации планирования подготовки Вооруженных Сил на очередной учебный год. Главное управление боевой подготовки ВС на основе директивы Генерального штаба разрабатывает и направляет органам боевой подготовки распоряжение главнокомандующего Сухопутными войсками –приказ Министра Обороны Российской Федерации «Об итогах подготовки ВС РФ и задачах на год».</p><p>Главное управление боевой подготовки к 1 мая. Предложения по основным мероприятиям боевой подготовки войск направляются в Генеральный штаб (в адрес главного оперативного управления) к 20 мая текущего года.</p><p class=\"li\">2. <b>Второй этап (июль – август)</b> начинается после утверждения начальником Генерального штаба проекта организационно-методических указаний по подготовке Вооруженных Сил на следующий учебный год. К 20 августа текущего года проекты организационно-методических указаний направляются в подчиненные органы военного управления</p><p class=\"li\">3. <b>Третий этап (сентябрь – ноябрь)</b> начинается после утверждения Министром Обороны Плана подготовки ВС РФ на следующий учебный год</p><p>В воинской части планирование начинается с получением руководящих документов боевой подготовки в сроки, установленные командиром соединения, и должно быть завершено не позднее 15 ноября.</p><p>Расписание занятий рот (батарей) утверждаются до 25 ноября.</p><p><b>В расписании занятий для каждого взвода должны быть определены:</b></p><ul><li>дата и время проведения занятий</li></ul><ul><li>категория обучаемых по ВУС</li></ul><ul><li>предмет боевой подготовки, номера и наименование тем и занятий, форма занятия</li></ul><ul><li>место проведения, руководитель занятия</li></ul><p><b>Расписание занятий составляется лично командиром подразделения и утверждается старшим начальником не позднее пятницы текущей недели.</b></p><p><b>4. Основные направления военно-политической работы в Вооружённых Силах Российской Федерации и их характеристика.</b></p><p><b>Определение:</b></p><p>Военно-политическая работа является важной составляющей органов</p><p>военного управления ВС РФ, которая призвана решить задачи по воспитанию патриота в военнослужащем</p><p>ВПР осуществляется по следующим основным направлениям (мероприятиям):</p><ul><li><b>работа по поддержанию</b> <b>правопорядка и</b> <b>воинской дисциплины</b></li></ul><p>Работа по поддержанию правопорядка и воинской дисциплины организуется в соответствии с требованиями законодательства РФ, нормативных, правовых актов Президента РФ и Министерства обороны, регламентирующих деятельность руководителей органов военного управления, командования воинских частей.</p><ul><li><b>военно-политическая</b> <b>пропаганда и агитация;</b></li></ul><ul><li>военно-политическая подготовка личного состава: военно-политическое информирование, прослушивание и просмотр радио- и телевизионных информационных программ;</li></ul><ul><li>общие собрания, собрания по категориям военнослужащих,</li></ul><ul><li>агитационно-пропагандистские и патриотические акции,</li></ul><ul><li>теоретические, научно-практические, военно-научные конференции, диспуты</li></ul><ul><li>тематические мероприятия, посвященные гос. праздникам РФ, другим значимым событиям в жизни страны и ВС,</li></ul><ul><li>встречи л/с с командованием, ветеранами и участниками б/д, гос-ми и общ-ми деятелями;</li></ul><ul><li><b>психологическая</b> <b>Работа</b> - психологическая</li></ul><p>диагностика, психологическое сопровождение, психологическая помощь, психологическая реабилитация;</p><ul><li><b>военно-социальная работа</b> -для реализации установленных социальных гарантий и компенсаций военнослужащим, членам их семей и лицам гражданского персонала ВС.</li></ul><ul><li><b>культурно-досуговая работа</b> - Организуется в целях обеспечения средствами культуры и искусства высокого уровня морально-политического и психологического состояния личного состава,<b> </b>его патриотического, эстетического и нравственного воспитания, а также организации отдыха и досуга военнослужащих, членов их семей и лиц гражданского персонала ВС.</li></ul><ul><li><b>взаимодействие с традиционными</b></li></ul><p><b>религиозными объединениями РФ и работа с</b> <b>верующими военнослужащими</b> - Взаимодействие с традиционными религиозными объединениями РФ и работа с верующими военнослужащими осуществляется в порядке, установленном отдельным нормативным правовым актом Министерства обороны.</p><ul><li><b>социологическое сопровождение мероприятии</b></li></ul><p><b>подготовки и повседневной деятельности ВС</b> – организуется в целях изучения и оценки морально-политического и психологического состояния военнослужащих, их моральной и психологической готовности к выполнению задач по предназначению, общественного мнения и настроении личного состава.</p><ul><li><b>индивидуальная работа с личным составом</b> – Основными формами индивидуальной работы являются индивидуальная беседа, индивидуальная помощь, наставничество, постановка индивидуальных заданий и поручений, персональная оценка.</li></ul><ul><li><b>совершенствование навыков должностных лиц по вопросам организации </b>впр</li></ul><ul><li><b>обеспечение техническими средствами </b>впр</li></ul><ul><li><b>геральдическое обеспечение</b></li></ul>", "27": "<p><b>Вопрос 1. Как происходит учёт поощрений и дисциплинарных взысканий в подразделении и воинской части? (ст.102-105).</b></p><p>Учет поощрений и дисциплинарных взысканий ведется во всех подразделениях и воинских частях.</p><p>Все поощрения и дисциплинарные взыскания, предусмотренные настоящим Уставом, в том числе поощрения, объявленные командиром всему личному составу воинской части, заносятся в служебную карточку не позднее чем в семидневный срок. делается отметка о том, когда и кем взыскание снято.</p><p>Если примененное к военнослужащему дисциплинарное взыскание по истечении года не будет снято и за этот период он не совершит другого дисциплинарного проступка делается отметка о том, что по истечении срока взыскание снято.</p><p>Служебные карточки ведутся: в роте - на солдат и сержантов; в штабе воинской части - на офицеров и прапорщиков;</p><p>Каждая запись в служебную карточку на солдат, матросов, сержантов и старшин должна быть заверена командиром роты/</p><p>Командиры батальонов, полков, кораблей и им равные обязаны периодически просматривать служебные карточки для проверки правильности применения поощрений и взысканий. Каждый военнослужащий один раз в шесть месяцев, а также перед перемещением или переводом к новому месту службы должен быть ознакомлен со своей служебной карточкой под личную подпись.</p><p><b>Вопрос 2. Условия выполнения 1-го упражнения в метании ручных гранат</b></p><p>Метание наступательных ручных гранат на меткость с места</p><p><b>Цель:</b> ростовая фигура (мишень №8), в круге радиусом 3 метра</p><p><b>Дальность до цели:</b> 30 метров</p><p><b>Время:</b> 40 секунд</p><p><b>Кол-во гранат:</b> две учебно-имитационные гранаты</p><p><b>Оценка:</b></p><ul><li>«отлично» - попасть в круг двумя гранатами</li></ul><ul><li>«хорошо» - попасть в круг первой гранатой</li></ul><ul><li>«удовлетворительно» - попасть в круг второй гранатой</li></ul><p><b>Вопрос 3. Учёт боевой подготовки во взводе, батарее.</b></p><p><b>Учет результатов боевой подготовки</b> – есть отражение количественных и качественных показателей выполнения планов подготовки личного состава и уровня обученности войск.</p><p><b>Учет подразделяется:</b></p><ul><li>оперативный (повседневная запись и отработка результатов выполнения планов боевой подготовки)</li></ul><ul><li>периодический (обобщение результатов оперативного учета с последующим анализом за установленный отрезок времени учебного периода)</li></ul><p>Основным учетным документов по боевой подготовке является <b>Журнал учета боевой подготовки взвода и роты. </b>Каждый командир подразделения ведет учет результатов боевой подготовки:</p><ul><li>во взводе – индивидуальный и за отделения</li></ul><ul><li>в роте (батареи) – индивидуальный, за отделения и взводы</li></ul><p><b>Журнал учета боевой подготовки взвода состоит из:</b></p><ul><li>Правила ведения журнала</li></ul><ul><li>Именной список личного состава</li></ul><ul><li>Учет посещаемости занятий</li></ul><ul><li>Учет результатов выполнения упражнений стрельб</li></ul><ul><li>Учет результатов выполнения упражнений по вождению машин</li></ul><ul><li>Замечания старших начальников</li></ul><p><b>Журнал учета боевой подготовки роты на год состоит из:</b></p><ul><li>Учет отработанных тем по предметам обучения</li></ul><ul><li>Индивидуальный учет результатов выполнения упражнений стрельб</li></ul><ul><li>Учет результатов выполнения упражнений стрельб по специальностям</li></ul><ul><li>Индивидуальный учет результатов выполнения упражнений по вождению</li></ul><ul><li>Учет результатов выполнения упражнений по вождению по специальностям</li></ul><ul><li>Учет стажа практического вождения машин (танков)</li></ul><ul><li>Учет командирских и инструкторско-методических занятий с сержантами</li></ul><ul><li>Учет тренировок и выполнения нормативов</li></ul><ul><li>Персональный учет отличников боевой подготовки</li></ul><ul><li>Персональный учет классных специалистов</li></ul><ul><li>Учет спортивных разрядников</li></ul><ul><li>Учет сдачи норм ВСК</li></ul><ul><li>Учет выполнения взятых обязательств</li></ul><ul><li>Замечания и указания старших начальников</li></ul><p><b>Вопрос 4. Основы организации военно-политической подготовки в подразделении.</b></p><p>Общее руководство ВПП возлагается на командиров (начальников) воинских частей, а планирование дат и времени проведения занятий по ВПП – на соответствующих начальников штабов воинских частей. Непосредственную организацию, учебно-методическое обеспечение и контроль за проведением занятий по ВПП осуществляют военно-политические органы Вооруженных Сил.</p><p>В соединениях и воинских частях ВПП планируется и проводится с учетом рекомендаций в учебных планах ВПП и организационно-методических указаниях к ним по изучению тем в модулях боевой подготовки подразделений (наступление, оборона, марш, специальные задачи).</p><p>На период непосредственной подготовки воинских частей и подразделений к выполнению специальных (контртеррористических, миротворческих и других) задач разрабатывается специальная тематика занятий по ВПП. На указанный период предусматривается изучение военно-политической обстановки, причин конфликта, истории, государственно-политического и военного устройства, законодательства, географии, обычаев народов, правил поведения военнослужащих в стране (регионе), где предстоит выполнять задачи, а также основ международного гуманитарного права.</p><p>В ходе учений, полевых выходов, при выполнении миротворческих, контртеррористических и других специальных задач, а также при нахождении подразделений в отрыве от ППД - ВПП организуется и проводится по отдельному плану не менее 1 часа в неделю.</p><p><b>ВПП проводится в течение всего учебного года:</b></p><ul><li>с офицерами, прапорщиками, мичманами – в системе профессионально-должностной подготовки;</li></ul><ul><li>с сержантами, старшинами – в системе должностной и боевой подготовки; с солдатами, матросами – в системе боевой подготовки;</li></ul><ul><li>с курсантами (слушателями) военных образовательных организаций высшего образования Министерства обороны – при изучении предусмотренных учебными планами и программами [гуманитарных и социально-экономических дисциплин](https://topuch.ru/lisevenskij-filial-kafedra-gumanitarnih-i-socialeno-ekonomiche/index.html);</li></ul><ul><li>с лицами гражданского персонала Вооруженных Сил – по планам командиров (начальников) воинских частей по военно-политическим, социально-экономическим и правовым вопросам методом информирования.</li></ul><p>Планирование ВПП осуществляется на учебный год и уточняется на учебный период. В дни, когда не проводится ВПП, перед началом занятий по боевой подготовке командирами (начальниками) ежедневно в течение 15–20 минут проводится военно-политическое, правовое, военно-техническое и иное информирование личного состава по специально разработанной тематике, исходя из особенностей региона, складывающейся обстановки и характера выполняемых задач. В конце каждого периода подготовки проводятся контрольные занятия с выставлением оценок каждому военнослужащему в журналах по боевой подготовке.</p><p>ВПП является важнейшей формой воспитательной работы со всеми категориями личного состава, главным содержанием которой является проведение в войсках государственной политики, формирование у военнослужащих качества гражданина-патриота, военного профессионала, надежного защитника Отечества.</p><p>Основное назначение ВПП состоит в том, чтобы помочь личному составу предметно всесторонне разобраться в содержании имеющейся информации, понять и осмыслить ее, сделать правильные выводы для себя, своей профессиональной деятельности, сверить ее результаты с предъявляемыми требованиями.</p>", "28": "<p><b>1.  Об </b>обращениях (предложениях, заявлениях или жалобах<b>) военнослужащих (ст. </b>106–120<b>).</b></p><ul><li>Военнослужащие имеют право обращаться лично, а также направлять письменные обращения в государственные органы</li></ul><p>Военнослужащий, которому стало известно о фактах преступления или нарушения должен немедленно доложить об этом непосредственному начальнику</p><ul><li>Должностные лица воинской части обязаны рассмотреть полученное обращения.</li></ul><ul><li>Военнослужащий, подавший обращение имеет право:</li></ul><ul><li>Представлять дополнительные материалы</li></ul><ul><li>Знакомиться с материалами, касающимися его обращения</li></ul><ul><li>Получать письменный ответ по существу вопросов в обращение</li></ul><ul><li>Обращаться с заявлением на прекращение рассмотрения обращения</li></ul><ul><li>Запрещается подавать обращение во время несения боевого дежурства, при нахождении в строю, в карауле и т. д.</li></ul><ul><li>Запрещается препятствовать подаче обращения военнослужащим и подвергать его за это наказанию</li></ul><ul><li>Обращение может быть заявлено устно на опросе</li></ul><ul><li>Обращение может быть рассмотрено в ходе личного приема</li></ul><ul><li>Обращения подлежат обязательному рассмотрению в срок до 30 суток со дня регистрации</li></ul><ul><li>Обращения, поступившие в воинскую часть, в срок не более трех суток регистрируются в Книге учета письменных обращений воинской части</li></ul><p><b>2. Начальная скорость пули. Траектория и её элементы.</b></p><p><b>Начальной скоростью пули называется скорость</b>, с которой пуля покидает канал ствола, - скорость движения пули у точки вылета. <b>Чем длиннее ствол</b> (до известных пределов), тем дольше действуют на пулю пороховые газы и <b>тем больше ее начальная скорость.</b></p><p><b>Образование траектории</b></p><p>В момент выстрела ствол автомата в зависимости от угла возвышения занимает определенное положение. Полет пули в воздухе начинается по прямой линии, представляющей продолжение оси канала ствола в момент вылета пули (<b>линия бросания</b>). При полете в воздухе на пулю <b>действуют две силы: сила тяжести и сила </b>сопротивления воздуха. Сила тяжести все больше и больше отклоняет пулю вниз от линии бросания, а сила сопротивления воздуха замедляет движение пули в воздухе. Под действием этих двух сил пуля продолжает полет по кривой, расположенной ниже линии бросания. Кривая линия, которую описывает центр тяжести пули при полете в воздухе, называется траекторией. Форма траектории зависит от величины угла возвышения и влияет на величину дальности прямого выстрела. С увеличением угла возвышения высота траектории и полная горизонтальная дальность полета пули увеличиваются, но это происходит до известного предела.</p><p><b>Угол возвышения, при котором полная горизонтальная дальность полета пули становится </b>наибольшей,<b> составляет около 35°.</b></p><p>Траектории, получаемые при углах возвышения, меньших угла наибольшей дальности, называются настильными.</p><p><b>3. Принципы, формы и методы воинского обучения, виды занятий в системе боевой подготовки.</b></p><p><b>Основными принципами воинского обучения являются:</b></p><p>1 учить войска тому, что необходимо на войне;</p><p>2 сознательность, активность и самостоятельность обучения;</p><p>3 наглядность в обучении;</p><p>4 систематичность, последовательность и комплексность в обучении;</p><p>5 обучение на высоком уровне трудностей;</p><p>6 прочность овладения знаниями, умениями и навыками;</p><p>7 коллективизм и индивидуальный подход в обучении.</p><p><b>Формы обучения:</b></p><ul><li>учебно-плановые занятия;</li></ul><ul><li>служебно-плановые мероприятия;</li></ul><ul><li>общественно-плановые мероприятия (внеучебная работа).</li></ul><p><b>Учебно-плановые занятия</b> – основная группа форм обучения. К ней относятся: теоретические и практические занятия, тренировочные занятия, боевые стрельбы, учебно-боевые пуски ракет, учения, военные игры.</p><p><b>Служебно-плановые мероприятия</b> проводятся с целью поддержания боевой техники и вооружения в боевой готовности.</p><p><b>Общественно-плановые мероприятия</b> (внеучебная работа) – организуются в основном в часы воспитательной работы и при правильной постановке являются дополнительным резервом для повышения воинского мастерства, для быстрого освоения боевой техники.</p><p>Методы обучения под руководством обучающего по источникам получения знаний можно подразделить на группы: словесные методы; наглядные методы; практические методы.</p><p><b>4. Планирование, организация, проведение занятий и оценка военно-политической подготовки военнослужащих. План-конспект руководителя группы по военно-политической подготовке.</b></p><p>ПРИКАЗ МИНИСТРА ОБОРОНЫ РОССИЙСКОЙ ФЕДЕРАЦИИ «22» февраля 2019 г. № 95.</p><p>Общее руководство ВПП возлагается на командиров (начальников) воинских частей, а планирование дат и времени проведения занятий по ВПП – на соответствующих начальников штабов воинских частей. Непосредственную организацию, учебно-методическое обеспечение и контроль за проведением занятий по ВПП осуществляют военно-политические органы Вооруженных Сил. Типовые учебные планы военно-политической подготовки разрабатываются Главным управлением военно-идеологической работы Вооруженных Сил Российской Федерации на каждый учебный год. В них определяются темы, обязательные для изучения всеми категориями военнослужащих, а также время и формы проведения занятий.</p><p>Планирование ВПП осуществляется на учебный год и уточняется на учебный период.</p><p><b>Занятия по ВПП проводятся командирами</b> воинских частей и подразделений, а также должностными лицами военно-политических органов Вооруженных Сил в <b>соответствии с учебными программами</b></p><p>Основными методами проведения занятий по ВПП <b>являются лекции, рассказ-беседа, семинар, самостоятельная работа.</b></p><p>Степень усвоения личным составом Вооруженных Сил знаний по ВПП оценивается по четырехбалльной системе. Учет успеваемости по ВПП ведется в журналах учета боевой подготовки.</p><p><b>Руководители групп перед каждым занятием по ВПП составляют план-конспект </b>проведения занятий, который утверждают у своего непосредственного начальника.</p><p><b>Руководителю следует подготовить конспект, в котором необходимо:</b></p><ul><li>составить развернутый план занятия;</li></ul><ul><li>определить, какой материал отобрать для рассказа-беседы, тезисно записать его;</li></ul><ul><li>продумать, какие теоретические понятия раскрыть подробно, а какие просто упомянуть или вообще не затрагивать;</li></ul><ul><li>привлечь примеры из жизни подразделения, их анализ.</li></ul>"};

document.getElementById('nav').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  var n = parseInt(btn.getAttribute('data-n'));
  if (!n) return;

  document.querySelectorAll('#nav button').forEach(function(b) {
    b.classList.remove('active');
  });
  btn.classList.add('active');

  document.getElementById('badge').classList.add('visible');
  document.getElementById('badge-num').textContent = n;

  var html = TICKETS[String(n)] || '<p>Не найдено</p>';
  document.getElementById('content').innerHTML = '<div class="ticket">' + html + '</div>';
  window.scrollTo(0, 0);
});

document.getElementById('top-btn').addEventListener('click', function() {
  window.scrollTo({top: 0, behavior: 'smooth'});
});

window.addEventListener('scroll', function() {
  var btn = document.getElementById('top-btn');
  if (window.scrollY > 200) btn.classList.add('visible');
  else btn.classList.remove('visible');
});
</script>
