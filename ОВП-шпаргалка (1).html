русская конница (под командованием Платова и Уварова) смогла обойти левый фланг неприятеля, тем самым отвлекла внимание Бонапарта на 2 часа от атаки батареи. Это позволило Кутузову подтянуть резервы и перегруппироваться. К вечеру русская армия отошла на новую линию обороны, а Бонапарт, напротив, отвел свою армию на исходные позиции. На военном совете, состоявшимся 1 сентября в деревне Фили, было решено оставить Москву неприятелю, <b>чтобы сохранить армию.</b></p><p><b>ЗНАЧЕНИЕ БИТВЫ:</b></p><ul><li>Бородинская битва стала началом конца величия Наполеона и его армии, переломным этапом в Отечественной войне 1812 г. Считается самой кровопролитной с обеих сторон.  В «битве гигантов» стороны понесли огромные потери, о которых исследователи ведут дискуссии и поныне. Считается, что за 26 августа русская армия потеряла от 45 до 50 тыс. человек (прежде всего от массированного артиллерийского огня), а «Великая армия» – примерно 35 тыс.</li></ul><ul><li>Наполеон сумел заставить российскую армию принять бой, но не сумел ее разбить.</li></ul><ul><li>После Бородина русская армия, боевой дух которой окреп, восстановила свои силы и была готова к изгнанию неприятеля из пределов России. «Великая» же «армия» Наполеона, наоборот, упала духом, потеряла прежнюю свою маневренность и способность побеждать. Москва стала для нее подлинной ловушкой, а отступление из нее превратилось скоро в подлинное бегство.</li></ul><p><b>Основные события 1812 г.</b></p><p><b>12 (24) июня </b>— переход французской армии через Неман (силы сторон к началу Отечественной войны: французы— 610 тыс. человек; русские —240 тыс. человек);</p><p><b>4–6 августа </b>— Смоленское сражение, неудачная попытка Наполеона разгромить основные силы русских войск;</p><p><b>8 августа</b> — назначение главнокомандующим М. И. Кутузова;</p><p><b>26 августа </b>— Бородинское сражение;</p><p><b>1 сентября </b>— военный совет в Филях, - решение Кутузова оставить Москву: вступление французских войск в Москву;</p><p><b>2–6 сентября </b>— пожар Москвы;</p><p><b>7 октября </b>наполеон покинул Москву, но русские, определили его фланговое движение на Калугу;</p><p><b>сентябрь — октябрь </b>—Кутузов проводит Тарутинский марш-маневр, вынуждает французов уйти из Москвы и отступать по Старой Смоленской дороге, развертывается партизанская война;</p><p><b>14–16 ноября </b>— сражение при Березине;</p><p><b>14 декабря</b> —изгнание остатков «великой армии» из России. Главным итогом Отечественной войны 1812 г.  стала гибель французской армии в России. Оставило сильный отпечаток в общественном сознании французов: до сих пор употребляющих слово «Березина» как метафору полного провала или катастрофы. Свыше 550 тысяч солдат из стран Западной Европы нашли свою смерть или попали в плен в России.</p><p><b>В январе 1813 </b>г. русская армия освободила от наполеоновских войск территорию Польши, к середине февраля достигла Одера, а <b>20 февраля </b>взяла Берлин, отбросив французские войска за Эльбу. Походы завершились вступлением русских войск <b>18 марта 1814 г</b>. в Париж, крушением империи Наполеона и отречением его от престола.</p><p>Граф Воронцов.</p>", "13": "<p><b>1. Внутренний порядок и чем он достигается</b> <b>(статья 163)</b></p><p><b>Внутренний порядок</b> — это строгое соблюдение военнослужащими определенных ФЗ и иных НПА, уставов правил размещения, быта, несения службы в наряде и выполнении других мероприятий повседневной деятельности.</p><p>Внутренний порядок <b>достигается: знанием</b>, пониманием, сознательным и точным исполнением всеми военнослужащими обязанностей, определённых НПА и уставами; <b>целенаправленной воспитательной работой, организацией боевой подготовки, точным выполнением распорядка дня, соблюдением правил эксплуатации вооружения, соблюдением безопасных условий.</b></p><p><b>2. Порядок сборки автомата (АК-74) после неполной разборки</b></p><ul><li>Присоединить газовую трубку со ствольной накладкой</li></ul><ul><li>Присоединить затвор к затворной раме</li></ul><ul><li>Присоединить затворную раму с затвором</li></ul><ul><li>Присоединить возвратный механизм</li></ul><ul><li>Присоединить крышку ствольной коробки</li></ul><ul><li>Спустить курок с боевого взвода и поставить на предохранитель</li></ul><ul><li>Присоединить дульный тормоз-компенсатор</li></ul><ul><li>Присоединить шомпол</li></ul><ul><li>Вложить пенал принадлежности в гнездо приклада</li></ul><ul><li>Присоединить магазин к автомату</li></ul><p><b>3.</b> Понятие боевой готовности. Степени боевой готовности войск и их    содержание.</p><p><b>Боевая готовность</b> – состояние подразделений и частей, позволяющее им в установленные сроки осуществить переход с мирного на военное время.</p><p><b>Степени боевой готовности:</b></p><p><b>Постоянная</b> представляла собой обычное повседневное функционирование воинских частей и соединений в мирное время, занятых боевой подготовкой и организацией непосредственного охранения, гарнизонной и караульной службы.</p><p><b>Повышенная</b> - характеризуется следующими мероприятиями: полный сбор личного состава, доукомплектация личного состава, проверка состояния техники и вооружений, занятия по-боевому слаживанию, подготовка к передислокации, подготовка материальных резервов и транспорта.</p><p><b>Военная опасность</b> - мероприятия, проводимые после объявления боевой тревоги: выезд формирований B район сосредоточения, получение провизии и средств связи, боеприпасов и средств защиты, организация сторожевого охранения.</p><p><b>Полная</b> - выдвижение войск на позиции, получение боевых задач, развёртывание огневых средств, организация комендантской службы и боевого охранения.</p><p><b>4. Морское сражение у мыса Синоп (1853 г.), значение сражения.</b></p><p><b>ХОД БИТВЫ:</b></p><p>В октябре 1853 г. Турция, подстрекаемая Англией и Францией, открыла военные действия на Кавказе и Дунае. Так началась Крымская война 1853—1856 гг.<b> </b>В ноябре было получено известие о появлении в Синопской бухте турецких военных кораблей, которые предполагалось использовать для осуществления десантной операции у русских берегов. Нахимов получил приказ блокировать османскую эскадру.  30 ноября 1853 г. вице-адмирал Павел  Степановича Нахимова, подготовившись, решил атаковать врага в его гавани, имея в своём составе на кораблях 720 орудий, против 518 у турок (476 пушек на кораблях и 44 на береговых батареях). Турецкая корабельная артиллерия и береговые батареи подвергли русскую эскадру, входившую на Синопский рейд, шквальному огню. Корабли Нахимова ответили на яростный неприятельский обстрел, только заняв выгодные позиции. Тогда-то и выяснилось полное превосходство русской артиллерии.  За четыре часа боя были потоплены 15 кораблей турецкой эскадры, кроме одного, а береговые батареи уничтожены. Турки потеряли убитыми и ранеными около 4 тыс. человек и около 200 попали в плен. Эскадра Нахимова не потеряла ни одного корабля, а потери русской эскадры составили 37 человек убитых и 233 раненых.</p><p><b>ЗНАЧЕНИЕ БИТВЫ:</b></p><ul><li>Блестящая победа русского флота лишила турок господства на Черном море, не позволила им    высадить войска на побережье Кавказа.</li></ul><ul><li>Синопской победа показала полное превосходство передового русского военно-морского искусства над турецким и высокий уровень тактики русского флота.</li></ul><ul><li>Высокий моральный дух русских моряков в Синопском сражении был обусловлен передовой системой воинского воспитания и чувством национальной военной гордости.</li></ul><ul><li>В Синопском сражении впервые в истории было успешно применено русскими морскими артиллеристами новое боевое средство — бомбическая артиллерия.</li></ul><p>Синопское морское сражение стало последним сражением эпохи парусного флота.</p>", "14": "<p><b>1. </b>Размещение военнослужащих: перечислить помещения роты (батареи) и раскрыть их предназначение, что запрещается военнослужащим в расположении полка (статьи <b>170–172</b>).</p><ul><li>13: спальное помещение (жилые комнаты);</li></ul><p>комната информирования и досуга (психологической разгрузки) военнослужащих; канцелярия роты; комната для хранения оружия; комната (место) для чистки оружия; комната (место) для спортивных занятий; комната бытового обслуживания; кладовая для хранения имущества роты и личных вещей военнослужащих; место для чистки обуви; сушилка для обмундирования; комната для умывания; душевая; туалет.</p><p>Военнослужащим в расположении полка запрещается:</p><p>хранить в месте своего размещения агитационные политические и пацифистские материалы, спиртные напитки, наркотические средства, психотропные вещества или их аналоги, новые потенциально опасные психоактивные вещества либо другие одурманивающие вещества, а также токсичные, горючие и взрывчатые вещества;</p><p>осуществлять сбор подписей под какими-либо обращениями;</p><p>организовывать азартные игры и участвовать в них.</p><p>12 куб. метров объёма воздуха на одного человека, нельзя спать не в спальне.</p><p><b>2. </b>Изготовка к стрельбе из различных положений</p><p>Изготовка к стрельбе с упора должна обеспечивать хорошую устойчивость оружия при производстве стрельбы. В качестве упора для стрельбы используются имеющиеся поблизости предметы и местные материалы.</p><p><b>Для стрельбы лежа</b> подготавливается упор высотой 25–30 см так, чтобы он был устойчивым (без качания) и имел ровную верхнюю плоскость. Упор должен служить и укрытием от огня противника.</p><p><b>Для стрельбы с колена</b> без использования укрытия нужно взять автомат (пулемет) в правую руку за ствольную накладку и одновременно с этим отставить правую ногу назад на ширину плеч, опуститься на правое колено; голень левой ноги должна остаться в вертикальном положении, а бедра обеих ног должны составлять угол, близкий к прямому. После этого переложить оружие в левую руку, поставить локоть на бедро левой ноги или упереть на коленный сустав.</p><p>Очень важно соблюдать равновесие, поэтому нужно сидеть прямо, не заваливать корпус назад и вправо. Локоть правой руки держать на уровне плеча. Оружие удерживается левой рукой за магазин или цевьё (в зависимости от телосложения солдата), а правой рукой за пистолетную рукоятку. Нужно помнить, что голень левой ноги, локоть левой руки и оружие должны быть в одной вертикальной плоскости, от этого во многом зависит меткость стрельбы.</p><p><b>Для стрельбы стоя</b> нужно повернуться вполоборота направо по отношению к цели и, не приставляя левой ноги, отставить ее влево так, чтобы обе ноги находились примерно на ширине плеч, как удобнее солдату, а тяжесть тела была равномерно распределена на обе ноги. Локоть левой руки (удерживающей оружие за магазин или цевьё) упереть в бедро или подсумок для гранат. Удерживая оружие правой рукой за пистолетную рукоятку, плотно прижать приклад к плечу и не наклоняться ВПЕРЕД, корпус и голову держать прямо.</p><p>При ведении огня не напрягаться, стоять свободно. После изготовки к стрельбе (из выбранного солдатом положения), а также определения расстояния и установки прицела производится прицеливание, а затем стрельба.</p><p><b>Прицеливание слагается</b> из нескольких быстро выполняемых элементов: выравнивания мушки в прорези прицела по вертикали и горизонтали (взятие ровной мушки) и одновременной проверки правильности ее положения, подведения мушки к точке прицеливания и удержания ее в этом положении с одновременным нажатием первым суставом указательного пальца на спусковой крючок. Основное внимание в этот момент должно сосредоточиваться на удержании ровной мушки в прорези прицела и удержании ее под целью. Целесообразно выстрел производить в тот момент, когда выдох закончился, а ровная мушка находится под целью.</p><p><b>3. Боевой расчёт роты (батареи), его предназначение и содержание.</b></p><p><b>Боевой расчёт определяет</b> обязанности военнослужащих по оповещению командного состава, усилению суточного наряда, погрузке запасов материальных средств и др. Боевой расчёт производит командир подразделения, исходя из поставленной боевой или учебной задачи, условий обстановки, степени боевой выучки подчиненных, боевой готовности (способности) подразделений. Боевой расчёт доводится до каждого военнослужащего ежедневно на вечерней поверке.</p><p><b>В боевом расчете подразделения указываются:</b></p><ul><li>основные временные показатели выполнения мероприятий по степеням боевой готовности;</li></ul><ul><li>порядок оповещения военнослужащих, проходящих службу по контракту, и проживающих вне казармы;</li></ul><ul><li>порядок получения оружия и боеприпасов, предметов экипировки и имущества л/с роты;</li></ul><ul><li>порядок выноса (вывоза) имущества и материальных средств;</li></ul><ul><li>порядок охраны и обороны расположения роты (батареи);</li></ul><ul><li>команды, назначаемые от подразделения, и порядок их убытия;</li></ul><ul><li>действия личного состава в пункте сбора и в районе сосредоточения;</li></ul><ul><li>состав связных к командиру батальона, к командиру роты;</li></ul><ul><li>организация связи;</li></ul><ul><li>расчёт на вывод боевой техники;</li></ul><ul><li>порядок вывода техники из парка в пункт сбора (место, район) формирования колонны;</li></ul><ul><li>сигналы оповещения;</li></ul><ul><li>порядок смены суточного наряда.</li></ul><p><b>4. Значение побед Русского воинства в XIII–XIX веках</b> для укрепления мощи Российского государства.</p><p><b>Победы способствовали:</b></p><p>1.Становлению российской государственности. Территориальной целостности, самостоятельности и независимости родной земли от чужеземных захватчиков.</p><p>2.Проявлению у народа самосознания, патриотизма, которые оказывал наиболее сильное воздействие на боеспособность вооруженных защитников Отечества в периоды тяжелых испытаний.</p><p>3.Формированию руководителей, способных поднять, возглавить и добиться разгрома захватчиков родной земли.</p><p class=\"li\">4. Развитию военного искусства и тактики Русской армии в ходе сражений, битв и походов. Высокой организации военного дела.</p><p class=\"li\">5. Формированию   воинских традиции на Руси. Стоять насмерть за друга, брата, за Отечество - являлось неписаным правилом для русских воинов. Они были готовы к самопожертвованию и взаимовыручке, считали плен позором.</p><p class=\"li\">6. Решению Россией важнейших внешнеполитических задач: обеспечению выходов к Балтийскому, Азовскому и Черному морям; предотвращению агрессий крымского ханства и турок; объединению в единое государство русских, белорусских и украинских земель.</p><p class=\"li\">7. Ускорили модернизацию российского общества, сократили отставание России от Запада.</p><p class=\"li\">8. Превратили Россию в морскую державу, придали России статус империи и великой европейской державы.</p><p class=\"li\">9. Ратная слава нашего Отечества вместе со славными боевыми традициями шагнула в советское и наше время</p>", "15": "<p><b>1 вопрос</b>.<b> Содержание помещений и территории воинской части (</b>185–198<b>)</b></p><p class=\"li\">1. Здания, помещения и участки территории полка должны всегда содержаться в чистоте и порядке.</p><p class=\"li\">2. Комнаты должны быть пронумерованы с указанием номера комнаты и ее назначения. Внутри каждой комнаты должна быть опись находящегося в ней имущества.</p><p class=\"li\">3. В спальных помещениях казармы, жилых комнатах общежития или других помещениях для личного состава на видном месте должны быть вывешены на специальных щитах распорядок дня, регламент служебного времени, расписание занятий, листы нарядов, схема размещения личного состава, опись имущества и необходимые инструкции.</p><p class=\"li\">4. Во всех жилых помещениях для питья воды оборудуются фонтанчики. В помещениях, где нет водопровода, устанавливаются закрытые на замок бачки с питьевой водой, которые оборудуются водоразборными краниками.</p><p class=\"li\">5. Все помещения обеспечиваются достаточным количеством урн для мусора, а места для курения - урнами с водой.</p><p class=\"li\">6. Ежедневная утренняя уборка спальных помещений в казарме и жилых комнат в общежитии производится очередными уборщиками под непосредственным руководством дежурного по роте.</p><p class=\"li\">7. Одну раз в неделю производится общая уборка, во время которой постельные принадлежности выносятся во двор для вытряхивания и проветривания.</p><p class=\"li\">8. Туалеты должны содержаться в чистоте, ежедневно дезинфицироваться, иметь хорошую вентиляцию и освещение.</p><p class=\"li\">9. Район расположения полка, территория военного городка и прилегающие к нему улицы должны быть озеленены и содержаться в чистоте и порядке. В темное время суток должно быть достаточное освещение.</p><p><b>Вопрос 2.  Правила обращения со стрелковым оружием и его эксплуатация</b></p><p class=\"li\">1. Заряжать и приводить оружие в боевую готовность можно лишь перед выстрелом. При подходе к табору, палатке оружие должно быть разряжено.</p><p class=\"li\">2. При использовании огнестрельного оружия необходимо:</p><ul><li>при зарядке, разрядке и спуске курков с боевого взвода направлять ствол вверх, в сторону от людей;</li></ul><ul><li>никогда не направлять оружие на человека вне зависимости от того, заряжено оно или нет;</li></ul><ul><li>быть особо внимательным перед проведением выстрела при нахождении поблизости людей или домашних животных;</li></ul><p class=\"li\">3. На всех видах транспорта ружья необходимо перевозить в чехлах.</p><p class=\"li\">4. При стрельбе необходимо учитывать траекторию и поражающие свойства боеприпасов</p><p class=\"li\">5. Ружье на погонном ремне следует носить только вверх стволами. Стволами вниз допускается носить ружье при проливном дожде, сильном снегопаде.</p><p class=\"li\">6. После падения, а также прохождения густых зарослей, необходимо сразу осмотреть оружие - не забит ли ствол землей или случайно сломавшейся веткой, не взвелся ли курок, предохранитель, не засорился ли затвор автоматического оружия.</p><p class=\"li\">7. Ружье необходимо хранить в разобранном виде, отдельно от боеприпасов, в чехле и специально предназначенном для этого металлическом ящике с замком. Хранение оружия должно обеспечивать доступ к нему только владельцу. Небрежное хранение оружия, создающее условия его использования другими лицами, квалифицируется как уголовное преступление.</p><p><b>3 вопрос. Порядок действий военнослужащих при объявлении тревоги (</b>368–<b>372 </b>статьи<b>)</b></p><p>Во всех случаях при объявлении тревоги личный состав должен действовать быстро и организованно</p><p>Тревоги подразделяются на:</p><ul><li>Боевые (проводятся в случаях угрозы нападения противника с целью приведения подразделений в полную боевую готовность для немедленного выполнения боевой задачи)</li></ul><ul><li>Учебные (проводятся в целях подготовки подразделений к действиям по боевой тревоги)</li></ul><p>В степени боевой готовности «Военная опасность» и «Полная» подразделения могут приводиться по сигналу «Тревога»</p><p>При этом выводится весь личный состав полка с положенными ему вооружением, военной техникой и другим военным имуществом.</p><p><b>Порядок подъема полка по боевой тревоге, в нём должно быть указано:</b></p><ul><li>лица, имеющие право объявлять боевую тревогу, порядок оповещения подразделений</li></ul><ul><li>сигналы тревоги и команды, подаваемые при ее объявлении;</li></ul><ul><li>действия дежурного по полку и других лиц суточного наряда при объявлении тревоги;</li></ul><ul><li>район сбора полка, пункты сбора подразделений и порядок выхода в них личного состава и вывода вооружения и военной техники;</li></ul><ul><li>районы сосредоточения полка и места расположения в них подразделений</li></ul><ul><li>мероприятия по всестороннему обеспечению полка;</li></ul><ul><li>организация управления и связи при подъеме полка по боевой тревоге, выдвижении и в районе сосредоточения;</li></ul><ul><li>порядок выноса (вывоза) Боевого знамени воинской части и его охраны;</li></ul><ul><li>порядок выдачи боеприпасов, продовольствия и другого военного имущества</li></ul><ul><li>организация комендантской службы при выходе в районы сбора и сосредоточения.</li></ul><p><b>Действия дежурного по роте при получении сигнала «Тревога» ночью</b>:</p><ul><li>докладывает дежурному по воинской части о получении сигнала</li></ul><ul><li>производит подъем личного состава</li></ul><ul><li>руководит обеспечением светомаскировки</li></ul><ul><li>отправляет посыльных для оповещения военнослужащих, проходящих военную службу по контракту</li></ul><ul><li>выдает оружие личному составу</li></ul><ul><li>отправляет команды, назначаемые от подразделения, на склады и в парк боевых машин</li></ul><ul><li>выставляет охрану расположения роты</li></ul><ul><li>с прибытием командира роты (старшины роты), докладывает о выполненных мероприятиях, действует по их указаниям</li></ul><p><b>Вопрос 4. Начало Великой Отечественной войны (1941г.). Планы фашистского командования и их итоги.</b></p><p><b>Начало Великой Отечественной войне 1941г.</b></p><p>Вероломно, без объявления войны, 22 июня 1941г., напав на Советский Союз, гитлеровское руководство в основу своей военной стратегии положило идею так называемой «молниеносной войны», рассчитывая разгромить СССР в одной военной кампании.</p><p><b>Основные причины войны</b></p><ul><li>национал-социализм претендовал на мировое господство;</li></ul><ul><li>Германия стремилась завоевать «жизненное пространство»;</li></ul><ul><li>захватить ресурсы СССР.</li></ul><p><b>Кроме этих причин</b>:</p><p>Гитлер - Славянским народам предписывал низменные качества, а также тупость, лень, склонность к анархии. Славяне, утверждал он, - прирожденные рабы, понимающие только удары кнута.</p><ul><li>Гитлеровское руководство планировало на нашей территории осуществить план «ОСТ».</li></ul><p><b>По плану «Ост»,</b> Россию надо было уничтожить как государство. Завоеванную Германией территорию предполагалось колонизовать, а ресурсы России использовать в интересах Германии. 30–40% населения намечалось выселить за Урал, 10–15 % «онемечить» и использовать как рабов, а остальных – истребить, уничтожая ежегодно 3–4 млн человек в концлагерях и газовых камерах.</p><p>План предусматривал быстрое сокращение коренного населения в СССР путем голода, насильственного выселения и истребления. Использовать местное население предполагалось в качестве дешевой рабочей силы, преимущественно для строительства дорог. Им не надо было давать образование, они должны только уметь читать дорожные указатели. Интеллигенция, члены партии, офицеры, евреи, цыгане должны быть уничтожены. Должно ликвидировать все органы власти, русское государство будет уничтожено, народы истреблены.</p><p>В указе Гитлера от 13 мая 1941 г. говорилось, что за действия против гражданских лиц - не будут преследоваться солдаты и офицеры.</p><p><b>План Барбаросса</b> – план нападения Германии на СССР, основанный на принципе молниеносной войны, «блицкрига». План начал разрабатываться летом 1940 года, а 18 декабря 1940 года Гитлер утвердил план, по которому война должна была быть закончена за 8–16 недель, самое позднее, в ноябре 1941 года. Войска должны разгромить Красную Армию в приграничных сражениях и в дальнейшем, развивая наступление в восточном направлении, овладеть рубежом: Архангельск, Волга, Астрахань.</p><p><b>Численность войск для реализации плана:</b></p><p>Германия готовила 190 дивизий для ведения войны и 24 дивизии в качестве резерва. Для войны выделялось 19 танковых и 14 моторизованных дивизий, поддерживаемые 4 воздушными флотами, румынской и финской авиацией. Общая численность контингента, который Германия направляла на СССР, по разным оценкам колеблется от 5 до 5,5 миллионов человек, около 47 тыс. орудий артиллерии и миномётов, 4300 тыс. танков, 5 тыс. самолетов.</p><p>Командующие немцев</p><p><b>Итоги плана</b></p><ul><li>На Севере не удалось захватить Ленинград и Мурманск. Продвижение войск останавливалось.</li></ul><ul><li>В Центре с большим трудом удалось выйти к Москве. На момент выхода немецкой армии к советской столице уде было понятно, что никакого «блицкрига» не получилось.</li></ul><ul><li>На Юге не удалось взять Одессу и захватить Кавказ. К концу сентября гитлеровские войска только захватили Киев и начали наступление на Харьков и Донбасс.</li></ul>", "16": "<p><b>1. Распределение времени и распорядок дня воинской части (статьи </b>219–226<b>).</b></p><p>Ст. 222. Распределение времени в воинской части в течение суток, а по некоторым положениям и в течение недели осуществляется распорядком дня и регламентом служебного времени.</p><p><b>Распорядок дня воинской части</b></p><ul><li>Определяет по времени выполнение основных мероприятий повседневной деятельности, учебы и быта личного состава</li></ul><ul><li>Устанавливает командир воинской части или соединения с учетом вида и рода войск</li></ul><p>Ст. 223. Распорядком дня воинской части предусматривается время проведения утренней физической зарядки, утреннего и вечернего туалета, утреннего осмотра, учебных занятий и подготовки к ним, смены специальной (рабочей) одежды, чистки обуви и мытья рук перед приемом пищи, приема пищи, ухода за вооружением и военной техникой, воспитательной, культурно-досуговой и спортивно-массовой работы, информирования личного состава, прослушивания радио и просмотра телепередач, приема больных в медицинском пункте, а также время для личных потребностей военнослужащих (не менее двух часов), вечерней прогулки, вечерней поверки и не менее восьми часов для сна.</p><p>Распределение времени и внутренний порядок в повседневной деятельности военнослужащих. Распорядок дня и регламент служебного времени — обеспечение постоянной боевой готовности и создание условий для проведения боевой учебы, поддержание воинской дисциплины и внутреннего порядка, воспитание военнослужащих.</p><p><b>Воскресные и праздничные дни</b> — это дни отдыха для всего личного состава, кроме лиц, несущих боевое дежурство и службу в суточном и гарнизонном нарядах. Не менее одних суток еженедельно и не менее шести суток отдыха в месяц</p><p>Каждую неделю в субботу проводится парково-хозяйственный день.  В этот же день обычно производится общая уборка всех помещений, а также помывка личного состава в бане</p><p><b>Подъем, утренний осмотр и вечерняя поверка</b>. Подъем подразделения по сигналу «Подъем», проводят утреннюю физическую зарядку, заправку постелей, утренний туалет и утренний осмотр. Вечером перед поверкой проводят вечернюю прогулку, во время которой личный состав исполняет строевые песни.</p><p><b>Учебные занятия</b>. Боевая подготовка — основное содержание повседневной деятельности военнослужащих.</p><p><b>Завтрак, обед и ужин.</b> Солдаты и сержанты должны прибывать в столовую в вычищенных одежде и обуви, в строю. Запрещено принимать пищу в головных уборах, пальто (зимних полевых костюмах) и в специальной рабочей форме одежды. Промежутки между приемами пищи не должны превышать 7 часов. После обеда не мене 30 минут не должны проводиться занятия.</p><p><b>Увольнение из расположения части</b>. Военнослужащие, проходящие военную службу по призыву, если на них не наложено дисциплинарное взыскание в виде лишения очередного увольнения, имеют право на одно увольнение в неделю из расположения воинской части.</p><p><b>2</b>.<b> Приведение оружия к нормальному бою. Определение средней точки попадания</b></p><p>Приведение оружия к нормальному бою производится стрельбой с последующей регулировкой прицельных приспособлений.</p><ul><li>Ближайшие друг к другу пробоины (рис. 15 а) соединяют прямой линией и делят её пополам. Полученную точку соединяют с третьей пробоиной. А расстояние между ними делят на три равные части. Точку деления, ближайшую к двум первым пробоинам, соединяют с четвертой пробоиной и расстояние делят на четыре равные части. Точка деления, ближайшая к трем первым пробоинам, и будет СТП.</li></ul><ul><li>Можно пробоины соединить попарно (рис. 15 б), середины полученных прямых снова соединить, точка деления полученной прямой пополам и будет СТП.</li></ul><ul><li>Если одна из пробоин явно оторвалась от остальных, то ее следует отбросить как случайную и определить СТП по трем пробоинам.</li></ul><ul><li>Явно оторвавшейся пробоиной является такая, расстояние до которой от СТП остальных пробоин более 2,5 радиусов наименьшего круга, вмещающего эти остальные пробоины.</li></ul><ul><li>При большом числе (6–10) пробоин СТП определяется несколько иначе. Отбросив явно оторвавшиеся пробоины, остальные последовательно разделяют пополам вертикально и горизонтально проведенными линиями. Линии проводятся на равном удалении от двух ближайших пробоин, лежащих в плоскости деления. Точка пересечения линий деления принимается за СТП (рис.15 г).</li></ul><p><b>3. </b>Служба войск и её задачи. Руководящие документы по службе войск.</p><p>Составной частью повседневной жизни и деятельности военнослужащих является служба войск.</p><p><b>Служба войск</b> — это повседневная воинская служба, обеспечивающая поддержание боевой готовности, внутреннего порядка, требований безопасности военной службы, дисциплины и норм, установленных законами, общевоинскими уставами.</p><p><b>Задачами службы войск являются</b> организация и руководство:</p><ul><li>внутренней службы</li></ul><ul><li>гарнизонной службы</li></ul><ul><li>караульной службы</li></ul><p><b>1.Внутренняя служба</b> - совокупность ежедневно проводимых в воинской части мероприятий:</p><ul><li>по поддержанию внутреннего порядка и воинской дисциплины,</li></ul><ul><li>обеспечению постоянной боевой готовности, условий быта и учебы личного состава,</li></ul><ul><li>контроля за строгим выполнением им обязанностей</li></ul><ul><li>организованному выполнению других задач в повседневной деятельности войск и сохранения здоровья военнослужащих.</li></ul><p>Руководство внутренней службой в воинской части осуществляет командир воинской части, а в подразделении – командир подразделения.</p><p><b>2. Караульная служба</b> – составная часть внутренней службы, предназначенная для охраны и обороны военных объектов особой важности</p><p><b>3. Гарнизонная служба</b> - составная часть внутренней службы, предназначенная для организации повседневной деятельности и боевой подготовки, а также других мероприятий с участием войск</p><p><b>Основные руководящие документы, регламентирующие вопросы организации и руководства службой войск</b></p><p class=\"li\">1. Конституция Российской Федерации.</p><p class=\"li\">2. Уголовной кодекс Российской Федерации.</p><p class=\"li\">3. Уголовно-процессуальный кодекс Российской Федерации.</p><p>4.Федеральный закон Российской Федерации «О статусе военнослужащих».</p><p>5.Федеральный закон Российской Федерации «О воинской обязанности и военной</p><p>службе».</p><p class=\"li\">6. Общевоинские уставы Вооруженных сил РФ,</p><p class=\"li\">7. Приказы Министра обороны РФ:</p><p>«Об организации учета, хранения и выдачи стрелкового оружия и боеприпасов к нему, а также инженерных боеприпасов в ВС РФ»;</p><p>«О мерах по дальнейшему оснащению военных объектов ВС техническими средствами охраны»;</p><p>«О недопущении к несению боевого дежурства, караульной службы лиц, имеющих 3–4 группу нервно-психологической неустойчивости» и др.</p><p class=\"li\">8. Директивы Генерального штаба ВС РФ:</p><p>«О мерах по улучшению организаторской работы командиров (начальников) в повседневной плановой деятельности и боевой подготовке войск, обеспечении правопорядка и безопасности личного состава в ВС РФ».</p><p>«О порядке оценки службы войск при инспектировании и проверке войск (сил)».</p><p>«Руководство по оснащению объектов МО РФ ТСО и их эксплуатации».</p><p><b>4. Бои на Московском направлении. Смоленское сражение (10 июля — 10 сентября 1941г.). Значение Смоленского сражения.</b></p><p>Смоленское сражение является первой операцией Великой Отечественной войны. В результате было задержано наступление гитлеровских армий на Москву и выиграно время для подготовки к обороне столицы. Но несмотря на победы под Ельней и на Духовщине, Красной армии не удалось разгромить противника.</p><p><b>Ход сражения:</b></p><p>Первый этап. В период с 10 по 20 июля немецкие войска перешли в наступление. Противник прорвал оборону на Западном фронте в районе Могилева и Витебска. Передовые отряды неприятеля продвинулись почти на 200 км. Танковая группа под командованием Гейнца Гудериана форсировала Днепр, севернее и южнее Могилева. Город окружили танковые и мотопехотные войска противника.</p><p>Второй этап Смоленского сражения с 21 июля по 7 августа. Советская армия получила значительное подкрепление. Из войск Фронта резервных армий были созданы оперативные армейские группы. Из районов Белого, Ярцева и Рославля советские войска нанесли удары по направлению к Смоленску. Перед советскими войсками стояла цель отбросить противника с позиций севернее и южнее города и соединиться с войсками, находящимися в окружении.</p><p>Третий этап сражения с 8 по 21 августа. Основные бои проходили на сформированном 16 августа Брянском фронте. 8 августа началось новое наступление немецко-фашистских войск. Подразделения Красной армии были вынуждены отступать в южном и юго-восточном направлениях. Противнику удалось продвинуться на 130–140 км и выйти к Гомелю.</p><p>Четвертый этап сражения с 21 августа по 10 сентября.  8 сентября завершилась Ельнинская операция. Противник понес значительные потери: около 600 тыс. человек и 1300 танков, и был вынужден перейти к глухой обороне на рубежах рек Устром и Стряна.</p><p><b>Значение сражения:</b></p><ul><li>План «блицкрига» потерпел крах. Наступления немецко-фашистских армий задержано на 2 месяца.</li></ul><ul><li>Первые победы в Ельнинской и Духовщинской операциях подняли боевой дух советских людей на всех участках фронта и в тылу.</li></ul><ul><li>Впервые в ходе Смоленского сражения были применены советские реактивные установки БМ-13 («Катюши»). Командир батареи капитан Флёров И. А.- Герой Российской Федерации (21.06.1995, посмертно)</li></ul><ul><li>За массовый героизм, мужество личного состава, высокое воинское мастерство, проявленные в ходе кровопролитных боёв Смоленского сражения, по решению Ставки ВГК приказом Наркома Обороны СССР 18.09. 1941 г.  № 308 четыре стрелковые дивизии: 100,127,153,161 были переименованы в 1,2,3,4 гвардейские.</li></ul>", "17": "<p><b>1. Назвать элементы распорядка дня и раскрыть их основное содержание (статьи </b>227–245<b>).</b></p><p>Утром, за десять минут до сигнала «Подъем», дежурный по роте производит подъем заместителей командиров взводов и старшины роты.</p><p>После подъема проводятся утренняя физическая зарядка, заправка постелей, утренний туалет и утренний осмотр.</p><p>Для утреннего осмотра по команде дежурного по роте «Рота, для утреннего осмотра - СТАНОВИСЬ». На утренних осмотрах проверяются наличие личного состава, внешний вид военнослужащих и соблюдение ими правил личной гигиены.</p><p>Перед вечерней поверкой военнослужащих, проходящих военную службу по призыву, во время, предусмотренное распорядком дня, под руководством старшины роты или одного из заместителей командиров взводов проводится вечерняя прогулка. После прогулки по команде дежурного по роте «Рота, на вечернюю поверку - СТАНОВИСЬ».</p><p>По окончании вечерней поверки старшина роты. Объявляет приказы и приказания в части, касающейся всех военнослужащих, наряд на следующий день и производит (уточняет) боевой расчет на случай тревоги. В установленный час подается сигнал «Отбой», включается дежурное освещение и соблюдается полная тишина. Периодически по плану полка проводятся общие батальонные или полковые вечерние поверки.</p><p><b>Боевая подготовка </b>является <b>основным содержанием повседневной деятельности военнослужащих.</b> Она проводится как в мирное, так и в военное время. Занятия и учения в целях овладения военнослужащими приемами действий в современном бою должны проводиться без послаблений и упрощений. На занятиях и учениях должен присутствовать весь личный состав полка.</p><p>Военнослужащие, проходящие военную службу по призыву, увольняются из расположения полка командиром роты в назначенные командиром полка дни и часы. Одновременно из подразделения <b>может быть уволено не более 30 процентов военнослужащих. Увольнение предоставляется военнослужащим в порядке очередности.</b></p><p>Старшина роты осматривает увольняемых, проверяет, хорошо ли они выбриты и подстрижены, состояние и подгонку их обмундирования, знание ими правил выполнения воинского приветствия, поведения в общественных местах.</p><p><b>Военнослужащие, увольняемые из расположения полка, должны иметь при себе военный билет.</b></p><p>По возвращении из увольнения военнослужащие прибывают к дежурному по полку и докладывают о прибытии. Дежурный по полку делает отметку на увольнительных записках о времени прибытия, возвратившихся из увольнения. Затем военнослужащие следуют в подразделение к дежурному по роте, сдают ему увольнительные записки и докладывают о прибытии своему непосредственному начальнику: «Товарищ сержант. Рядовой Рыбаков из увольнения прибыл. Во время увольнения замечаний не имел (или имел такие-то замечания от такого-то)».</p><p>в дни отдыха могут проводиться групповые выезды в близлежащие крупные населенные пункты (города).</p><p><b>2. Основные положения внутренней баллистики</b></p><p><b>Выстрелом</b> называется выбрасывание пули из канала ствола оружия энергией газов, образующихся при сгорании порохового заряда.</p><p>Выстрел происходит в очень короткий промежуток времени (0,001–0,06 с). При выстреле различают <b>четыре последовательных периода</b>: предварительный, первый или основной, второй, третий или период последействия газов.</p><p><b>Предварительный период</b> длится от начала горения порохового заряда до полного врезания оболочки пули в нарезы ствола.</p><p><b>Первый или основной период </b>длится от начала движения пули до момента полного сгорания порохового заряда. В этот период горение порохового заряда происходит в быстро изменяющемся объеме.</p><p><b>Второй период</b> длится от момента полного сгорания порохового заряда до момента вылета пули из канала ствола.</p><p><b>Третий период, или период последействия газов,</b> длится от момента вылета пули из канала ствола до момента прекращения действия пороховых газов на пулю.</p><p><b>Начальной скоростью</b> (υ0) называется скорость движения пули у дульного среза ствола. Величина начальной скорости пули указывается в боевых характеристиках оружия.</p><p><b>Отдачей</b> называется движение оружия назад во время выстрела. Отдача ощущается в виде толчка в плечо, руку или грунт. Действие отдачи оружия характеризуется величиной скорости и энергии, которой оно обладает при движении назад.</p><p>Сочетание влияния вибрации ствола, отдачи оружия и других причин приводит к образованию угла между направлением оси канала ствола до выстрела и ее направлением в момент вылета пули из канала ствола. Этот угол называется <b>углом вылета</b> (γ). Угол вылета считается положительным, когда ось канала ствола в момент вылета пули выше ее положения до выстрела, и отрицательным, когда она ниже.</p><p><b>Прочностью ствола</b> называется способность его стенок выдерживать определенное давление пороховых газов в канале ствола. Так как давление газов в канале ствола при выстреле неодинаково на всем его протяжении, стенки ствола делаются разной толщины – толще в казенной части и тоньше в дульной. При этом стволы изготавливаются такой толщины, чтобы они могли выдержать давление, в 1,3–1,5 раза превышающее наибольшее.</p><p><b>Живучестью ствола</b> называется способность ствола выдержать определенное количество выстрелов, после которого он изнашивается и теряет свои качества (значительно увеличивается разброс пуль, уменьшается начальная скорость и устойчивость полета пуль). Живучесть хромированных стволов стрелкового оружия достигает 20–30 тыс. выстрелов.</p><p><b>Режимом огня</b> называется наибольшее количество выстрелов, которое может быть произведено за определенный промежуток времени без ущерба для материальной части оружия, безопасности и без ухудшения результатов стрельбы. Каждый вид оружия имеет свой режим огня.</p><p><b>3. </b>Обязанности командира подразделения по руководству службой     войск.</p><p><b>Командир обязан:</b></p><p>1)разрабатывать планы мероприятий</p><p>2)добиваться полной обеспеченности вооружением</p><p>3)повышать полевую выучку</p><p>4)знать действительное состояние воинской части</p><p>5)принимать меры по обеспечению сохранения государственной тайны</p><p>6)планировать и своевременно ставить задачи по организации боевой подготовки</p><p>7)постоянно совершенствовать профессиональные знания</p><p>8)лично проводить занятия и учения</p><p>9)осуществлять контроль и оказывать подчиненным военнослужащим необходимую помощь в ходе боевой подготовки</p><p>10)постоянно воспитывать подчиненных военнослужащих</p><p>11)формировать и поддерживать у них морально-политическую и психологическую готовность к защите РФ</p><p>12)повышать культуру межнационального общения</p><p><b>Система работы командира подразделения по руководству службой войск:</b></p><p><b>1) Ежедневно</b> – подбор и подготовки личного состава к несению службы в суточном и гарнизонном наряде, проверка его готовности. Изучение морально-боевых и психологических качеств военнослужащих</p><p><b>2) Еженедельно</b> – доведение до личного состава приказов</p><p><b>3) Ежемесячно</b> – прием зачетов по знанию общевоинских уставов</p><p><b>4. Битва под Москвой (1941г.). Значение битвы.</b></p><p>Битва делится на два периода: оборонительный (30 сентября — 4 декабря 1941 года) и наступательный, который состоит из двух  этапов: контрнаступления (5 декабря 1941 года — 7 января 1942 года) и наступления советских войск (8 января — 20 апреля 1942 года)</p><p><b>Ход битвы:</b></p><p>Немецким командованием разработана стратегическая наступательная операция под названием «Тайфун» с целью взять Москву в кольцо, захватить город и уничтожить.  Немцы бросили в бой 1,8 млн солдат, свыше 14 тыс. орудий и миномётов, около 1700 танков и 1400 самолётов.</p><p>Фашистам противостояли силы трёх фронтов Красной Армии: Западного, Резервного, Брянского. Их общая численность составляла: 1,25 млн солдат, 7,6 тыс. орудий и миномётов, около 1 тыс. танков и 700 самолётов.</p><p>Группа армий «Центр» начала наступление 30 сентября 1941 г. на Брянском направлении, 2 октября – на Вяземском, 10 октября – на Калининском. Немцам удалось прорвать оборону упорно сопротивляющихся советских войск и взять несколько армий в окружение (в районе Брянска и Вязьмы). Также фашисты захватили Калинин, Волоколамск, Можайск, Орел, подошли к Туле. Воины Красной Армии на фронте и в окружении вели оборонительные бои, в захваченных врагом районах Подмосковья активно действовали партизанские отряды.</p><p>К началу декабря немецкое наступление на столицу СССР было остановлено удержанием оборонительных рубежей и контрударами советских войск. За период с 16 ноября по 5 декабря 1941 года гитлеровцы потеряли 155 тыс. убитыми, ранеными и обмороженными, около 800 танков, 300 орудий и миномётов, до 1500 самолётов.  Немецкие ударные группировки, потеряв свои наступательные возможности, терпели поражение.</p><p>Советские войска 5 декабря начали стратегическую контрнаступательую операцию, в ходе которой нанесли крупное поражение непобедимой группе армий «Центр», отбросив ее от Москвы на 100–250 км, сняли угрозу столице и Московскому промышленному району.</p><p><b>Значение битвы:</b></p><ul><li>Впервые во Второй Мировой войне Советский Союз нанёс поражение немецко-фашистским войскам, захватил инициативу и заставил противника перейти на всем советско-германском фронте к обороне.</li></ul><ul><li>Был развеяла миф о непобедимости германской армии, похоронен гитлеровский план «молниеносной» войны,<b> </b>возникла необходимость ведения затяжной войны.</li></ul><ul><li>1 января 1942 г. представители 26 государств, в том числе СССР, США, Англия и Китай, подписали Декларацию Объединенных Наций.</li></ul><ul><li>Разгром немецкой армии под Москвой вдохновил свободолюбивые народы мира на борьбу с фашизмом.</li></ul><ul><li>Турция и Японии не решились вступить в войну против СССР на стороне Германии.</li></ul>", "18": "<p><b>1. Предназначение, состав и вооружение суточного наряда воинской части (статьи </b>256–265<b>).</b></p><p>Суточный наряд назначается для поддержания внутреннего порядка, охраны личного состава, вооружения, военной техники и боеприпасов, помещений и другого военного имущества воинской части, контроля за состоянием дел в подразделениях и своевременного принятия мер по предупреждению правонарушений.</p><p>Предусматривается следующий состав суточного полкового наряда:</p><p>дежурный по полку; помощник дежурного по полку; дежурное подразделение;</p><p>караул; дежурный и дневальные по парку, а также механики-водители (водители) дежурных тягачей; дежурный фельдшер или санитарный инструктор и дневальные по медицинскому пункту; дежурный и помощники дежурного по контрольно-пропускному пункту; дежурный по столовой и рабочие в столовую; дежурный по штабу полка; дежурный сигналист-барабанщик; посыльные; пожарный наряд.</p><p>Дежурный по полку, помощник дежурного по полку, дежурный по парку, дежурный по контрольно-пропускному пункту, дежурный по штабу полка, назначенные из числа офицеров и прапорщиков, вооружаются пистолетами с двумя снаряженными магазинами.</p><p>Дежурный по парку, дежурный по контрольно-пропускному пункту, дежурный по штабу полка, назначенные из числа сержантов, помощники дежурного по контрольно-пропускному пункту, дежурные и дневальные по подразделениям, кроме военнослужащих женского пола, входящих в состав суточного наряда по общежитию, а также дневальные по парку и посыльные вооружаются штыками-ножами в ножнах. Штык-нож должен находиться на поясном ремне с левой стороны на ширину ладони от пряжки.</p><p><b>2</b>. Основные положения внешней баллистики.</p><p><b>ВНЕШНЯЯ БАЛЛИСТИКА</b> — это наука, изучающая движение пули (гранаты) после прекращения действия на нее пороховых газов.</p><p>Необходимо иметь в виду, что пуля, вылетев из канала ствола, движется по инерции, а граната, имеющая реактивный двигатель, движется по инерции после истечения газов из реактивного двигателя.</p><p><b>Цели внешней баллистики:</b></p><ul><li>Получение исходных данных для проектирования артиллерийских и ракетных комплексов, снарядов и ракет к ним;</li></ul><ul><li>Обеспечение испытаний новых систем;</li></ul><ul><li>Составление таблиц стрельбы, по которым решаются задачи прицеливания;</li></ul><ul><li>Обобщение в форме баллистических алгоритмов результатов стрельбы и баллистических расчетов.</li></ul><p><b>Основные разделы внешней баллистики:</b></p><p>изучение сил и моментов, действующих на пулю в полете;</p><p>изучение движения центра масс пули для расчета элементов траектории;</p><p>изучение движения пули относительно центра масс с целью определения его устойчивости и характеристик рассеивания.</p><p><b>3.</b> Безопасность военной службы и основные условия её обеспечения.</p><p><b>Безопасность военной службы</b> заключается в поддержании в подразделении условий военной службы и порядка ее несения, обеспечивающих защищенность личного состава, каждого военнослужащего, местного населения и окружающей среды от воздействия опасных факторов военной службы</p><p><b>Условия обеспечения безопасности военной службы являются:</b></p><ul><li>поддержание воинской дисциплины</li></ul><ul><li>обеспечение удовлетворения морально-психологического состояния и здоровья военнослужащих</li></ul><ul><li>соблюдение правил внутреннего порядка</li></ul><ul><li>обеспечение социальной защиты военнослужащих</li></ul><ul><li>обеспечение удовлетворительного санитарно-эпидемического состояния полка</li></ul><p><b>4. Битва за Сталинград (1942–1943 гг.). Значение битвы.</b></p><p>Битва делится на два периода: Оборонительный-17.07.1942-18.11.1942г Наступательный 19.11.1942-2.02. 1943 г. Битва длилась 200 дней и ночей. Она развернулась на территории площадью 100 тыс. кв. км. По целям, размаху и напряженности боевых действий Сталинградская битва превзошла все предшествующие ей сражения мировой истории.</p><p><b>Ход </b>битвы:</p><p>Оборонительный этап Сталинградской битвы начинался сложно для Красной Армии. Вермахт имел превосходство над советскими войсками: в личном составе в 1,7 раз; в танках в 1,3 раза; в артиллерии в 1,3 раза; в самолетах более чем в 2 раза. В этих условиях 28 июля 1942г.  до войск Сталинградского и других фронтов был доведен приказ Ставки ВГК №227, который в народе назвали: «Ни шагу назад!». Оборонительная операция на сталинградском направлении включала два этапа. Первый этап — ведение оборонительных боев действий войсками фронтов на дальних подступах к Сталинграду (17 июля — 12 сентября). Второй этап — ведение оборонительных действий по удержанию Сталинграда (13 сентября — 18 ноября). Главная задача оборонительного этапа была – обескровить ударные группировки врага, отстоять город, и подготовили условия для перехода в контрнаступление. Проявляя мужество, героизм, стойкость воины Красной Армии выполнили поставленную задачу. Контрнаступление, а затем наступление советских войск продолжалось с 19 ноября 1942 по 2 февраля 1943 г. Утром 19 ноября загрохотали тысячи пушек. Это началась мощная артиллерийская подготовка, которая нанесла врагу тяжелые потери, разрушила его оборону. После неё, через 1,5 часа, начали   атаку танки и пехота. Они прорвали оборону противника и устремились, в направлении г. Калач. 23 ноября войска Юго-Западного и Сталинградского фронтов соединились в районе г. Калача. Были окружены 22 немецкие дивизии общей численностью 330 тыс. солдат и офицеров. 2 февраля 1943 г, окруженные войска противника во главе с генерал-фельдмаршалом Ф. Паулюсом сдались.</p><p><b>Значение битвы:</b></p><ul><li>Победа в Сталинградской битве положила начало коренного перелома в ходе Великой̆ Отечественной̆ и Второй̆ мировой̆ войны, началось изгнание вражеских войск с советской территории.</li></ul><ul><li>СССР прочно и окончательно захватила стратегическую инициативу на советско-германском фронте.</li></ul><ul><li>Подорваны военная мощь, престиж и миф о «несокрушимости» фашистской армии.</li></ul><ul><li>Победа в битве показала превосходство советского военного искусства над военным искусством немецко-фашистской армии.</li></ul><ul><li>Повысился международный̆ авторитет СССР, который способствовала сплочению государств антигитлеровской̆ коалиции, активизировалось борьба антифашистов во всех странах Европы.</li></ul><ul><li>Эта победа явилась результатом беспримерного мужества, героизма и стойкости советских людей.</li></ul><ul><li>Обострились межгосударственные отношения Германии с Япония и Турция сохранившим   нейтралитет.</li></ul>", "19": "<p><b>1. Обязанности дежурного и дневального по батарее (статьи </b>298–303<b>)</b></p><p><b>Дежурный по роте</b></p><p class=\"li\">298. Дежурный по роте назначается из сержантов. Отвечает:</p><ul><li>за выполнение распорядка дня;</li></ul><ul><li>за сохранность оружия, ящиков с боеприпасами, имущества роты</li></ul><p>Дежурный по роте подчиняется дежурному по полку и его помощнику, а в порядке внутренней службы в роте - командиру роты и старшине роты.</p><p class=\"li\">300. <b>Дежурный по роте обязан:</b></p><ul><li>Оповещать военнослужащих в случае тревоги</li></ul><ul><li>Следить за точным выполнением распорядка дня в роте</li></ul><ul><li>Знать местонахождение роты, порядок ее вызова, наличие людей в роте и количество находящихся в наряде</li></ul><ul><li>Выдавать оружие по приказу командира или старшины роты, делая запили в книге выдачи оружия и боеприпасов</li></ul><ul><li>Проверить номера и комплектность при приеме оружия</li></ul><ul><li>Постоянно иметь при себе ключи от комнаты для хранения оружия и никому их не передавать</li></ul><ul><li>В случае каких-либо происшествий в роте принять меры по наведению порядка, а после – немедленно доложить командиру роты</li></ul><ul><li>Следить за тщательной уборкой и содержанием помещений роты</li></ul><ul><li>Следить за наличием и исправностью средств пожаротушения роты</li></ul><p><b>Дневальный по роте</b></p><p class=\"li\">302. Дневальный по роте назначается из солдат. Дневальный по роте отвечает:</p><ul><li>за сохранность находящихся под его охраной оружия, шкафов (ящиков) с пистолетами, ящиков с боеприпасами, имущества роты и личных вещей солдат и сержантов.</li></ul><p>Дневальный по роте подчиняется дежурному по роте.</p><p><b>Обязанности дневального по роте</b>:</p><ul><li>Постоянно находиться в расположении роты и наблюдать за комнатой для хранения оружия</li></ul><ul><li>Не пропускать посторонних лиц и не допускать вынос оружия и боеприпасов без разрешения дежурного по роте</li></ul><ul><li>Докладывать обо всех происшествиях дежурному по роте</li></ul><ul><li>Будить личный состав по тревоге, своевременно подавать команды в соответствии с распорядком дня</li></ul><ul><li>Следить за чистотой и порядком в помещениях. Следить, чтобы военнослужащие курили, чистили обувь и одежду только в специально отведенных местах</li></ul><ul><li>По прибытии в расположение роты командира роты и выше подавать команду «Смирно!»</li></ul><ul><li>По прибытии в роту любого другого офицера или старшины вызвать дежурного по роте</li></ul><ul><li>Выполнять обязанности дежурного по роте в его отсутствие</li></ul><p><b>3. Основные мероприятия командира подразделения по обеспечению безопасности военной службы.</b></p><p><b>Командир воинской части (подразделения)</b> руководит обеспечением безопасности военной службы, организуя работу по следующим направлениям:</p><ul><li>обеспечение травмобезопасности и безаварийности при несении боевого дежурства (боевой службы), караульной и внутренней служб, в ходе боевой подготовки, эксплуатации вооружения и военной техники, проведения ремонтно-строительных работ, а также при выполнении других задач повседневной деятельности;</li></ul><ul><li>проведение мероприятий медицинского обеспечения безопасности военной службы;</li></ul><ul><li>организация пожарной безопасности и проведение мероприятий по охране окружающей среды.</li></ul><p><b>При выполнении практических мероприятий любой командир:</b></p><ul><li>определяет опасные и вредные факторы, которые могут воздействовать на личный состав при выполнении задачи;</li></ul><ul><li>определяет требования безопасности (при подготовке личного состава к несению и при несении боевого дежурства, внутренней, гарнизонной и караульной служб;</li></ul><ul><li>при организации и выполнении работ с ВВТ;</li></ul><ul><li>при подготовке и совершении марша;</li></ul><ul><li>на учениях, боевых стрельбах и специальных занятиях); -</li></ul><ul><li>доводит требования безопасности до подчиненных (при постановке задач на проведение занятий, работ и других мероприятий при проведении инструктажей);</li></ul><ul><li>организует систематический контроль выполнения подчиненными требований безопасности;</li></ul><ul><li>разрабатывает (определяет) организационные и технические меры по защите личного состава от возможного поражения, порядок безопасного выполнения задачи;</li></ul><ul><li>назначает руководителей, исполнителей, лиц для осуществления контроля, а также средства защиты;</li></ul><ul><li>определяет порядок оказания доврачебной медицинской помощи пострадавшим в аварийных ситуациях;</li></ul><p>Должностные лица, организующие мероприятия повседневной деятельности или руководящие их проведением непосредственно при организации и проведении каждого мероприятия повседневной деятельности <b>обязаны</b>:</p><ul><li>уточнять опасные факторы военной службы, которые могут возникнуть при выполнении мероприятия;</li></ul><ul><li>определять порядок организации и выполнения мероприятий повседневной деятельности;</li></ul><ul><li>обеспечивать создание безопасных условий военной службы на каждом месте;</li></ul><ul><li>–проводить лично (организовывать) занятия по изучению требований безопасности;</li></ul><ul><li>лично убедиться перед проведением мероприятий что для этого созданы безопасные условия;</li></ul><ul><li>добиваться выполнения требований БВС, принимать в ходе контроля за их выполнением меры по предупреждению гибели, увечий (ранений, травм, контузий), заболеваний военнослужащих и гражданских лиц, причинения вреда окружающей среде;</li></ul><ul><li>в случае выявления нарушений требований безопасности или в аварийных ситуациях приостанавливать проведение мероприятия;</li></ul><ul><li>обеспечивать по окончании мероприятия повседневной деятельности приведение места его выполнения (рабочего места) в порядок.</li></ul><p><b>2. Явление выстрела и его периоды.</b></p><p><b>Выстрелом</b> называется выбрасывание пули из канала ствола оружия энергией газов, образующихся при сгорании порохового заряда.</p><p>Выстрел происходит в очень короткий промежуток времени (0,001–0,06 с). При выстреле различают <b>четыре последовательных периода</b>: предварительный, первый или основной, второй, третий или период последействия газов.</p><p><b>Предварительный период</b> длится от начала горения порохового заряда до полного врезания оболочки пули в нарезы ствола.</p><p><b>Первый или основной период </b>длится от начала движения пули до момента полного сгорания порохового заряда. В этот период горение порохового заряда происходит в быстро изменяющемся объеме.</p><p><b>Второй период</b> длится от момента полного сгорания порохового заряда до момента вылета пули из канала ствола. У некоторых видов стрелкового оружия, особенно короткоствольных (ПМ, АПС), второй период отсутствует, так как полного сгорания порохового заряда к моменту вылета пули из канала ствола фактически не происходит</p><p><b>Третий период, или период последействия газов,</b> длится от момента вылета пули из канала ствола до момента прекращения действия пороховых газов на пулю. В течение этого периода пороховые газы, истекающие из канала ствола со скоростью 1200—2000 м/с, продолжают действовать на дно пули и сообщают ей дополнительную скорость. Кончается период на удалении нескольких сантиметров от дульного среза.</p><p><b>4. Курская битва (5 июля — 23 августа 1943г.). Значение битвы.</b></p><p><b>Битва состоит из двух периодов:</b> оборонительного (5—23 июля) и наступательного (12 июля — 23 августа). Цель: отразить наступление сил вермахта, нанести им максимальное поражение и, перейдя в наступление, разгромить его группировку. Является одной из ключевых сражений Великой Отечественной войны.</p><p>Пользуясь отсутствием 2-го фронта в Европе, гитлеровцы хотели взять реванш за поражение под Сталинградом и добиться в ходе войны перелома в свою пользу. Летом1943 г. они решили провести наступление в районе Курска</p><p><b>Ход битвы:</b></p><p>Советскому командованию было точно известно день и время начала операции - 3 часа ночи. Поэтому, когда враг приготовился к наступлению, советские войска провели мощную артиллерийскую контрартподготовка. Понеся значительные потери, гитлеровцы начали наступление с опозданием на два часа. 5 июля 1943 года немецкие ударные группировки начали наступление на Курск из районов Орла и Белгорода. Советские артиллеристы, танкисты, пехотинцы встретили неприятеля огнем. Ударная немецкая группировка, наступавшая с севера, была остановлен, но ей удалось продвинуться на 10–12 км. Из района Белгорода гитлеровским войскам удалось продвинуться на север, в направлении Курска, до 35 км. Чтобы остановить врага, советское командование решило ввести в бой крупные резервы. 12 июля в ходе оборонительной фазы Курской битвы на Прохоровском поле произошло крупнейшее в истории войны танковое сражение. В нем с обеих сторон одновременно участвовали до 1 200 танков и самоходных орудий. В ожесточенных боях войска вермахта потеряли до 350 танков и штурмовых орудий. В ожесточенном оборонительном сражении советские войска обескровили ударные группировки противника и сорвали его план добиться победы под Курском. Последнее крупное наступление гитлеровцев на советско-германском фронте полностью провалилось, и они перешли к обороне. 12 июля начался второй этап Курской битвы, контрнаступление советских войск: Орловская стратегическая наступательная операция \"Кутузов\" (12 июля — 18 августа) и Белгородско-Харьковская стратегическая наступательная операция \"Румянцев\" (3–23 августа).  В ходе Курской битвы в тылу немецких войск партизанскими соединениями проводилась операция \"Рельсовая война «, с целью диверсии на объектах ж/д для затруднения переброски немцами подкреплений. В результате наступательных операций были освобождены Орел, Белгород и Харьков.</p><p><b>Значение битвы:</b></p><ul><li>Победа в Курской битве завершила коренной перелом в ходе Второй мировой войны в пользу СССР. Стратегическая инициатива окончательно перешла на сторону Советского командования, лишив немцев возможности проводить крупные наступательные операции.</li></ul><ul><li>Явилась триумфом советского военного искусства, преднамеренно перейдя к обороне, имея превосходство над противником в силах и средствах, умело организовав взаимодействие различных родов войск и авиации.</li></ul><ul><li>Победный исход ускорил развал гитлеровского блока.  Активизировалась движение сопротивления в Европе.</li></ul><ul><li>Советские воины проявили массовый героизм, мужество, воинское мастерство.</li></ul>", "20": "<p><b>1. Понятие воинской дисциплины, на чём она основывается и к чему обязывает каждого военнослужащего (статьи </b>1–3<b>).</b></p><p class=\"li\">1. Воинская дисциплина есть строгое и точное соблюдение всеми военнослужащими порядка и правил, установленных федеральными конституционными законами, федеральными законами, общевоинскими уставами и приказами командиров.</p><p class=\"li\">2. Воинская дисциплина основывается на осознании каждым военнослужащим воинского долга и личной ответственности за защиту Российской Федерации.</p><p class=\"li\">3. Воинская дисциплина обязывает каждого военнослужащего:</p><ul><li>быть верным Военной присяге, строго соблюдать Конституцию и законы РФ</li></ul><ul><li>выполнять свой воинский долг умело и мужественно, добросовестно изучать военное дело, беречь государственное и военное имущество;</li></ul><ul><li>беспрекословно выполнять поставленные задачи в любых условиях</li></ul><ul><li>быть бдительным, строго хранить государственную тайну;</li></ul><ul><li>поддерживать определенные общевоинскими уставами правила взаимоотношений между военнослужащими</li></ul><ul><li>соблюдать правила воинской вежливости</li></ul><ul><li>вести себя с достоинством в общественных местах, помогать гражданам;</li></ul><ul><li>соблюдать нормы международного гуманитарного права</li></ul><p><b>Вопрос 2. Правила и способы стрельбы из автомата Калашникова (АК – 74).</b></p><p><b>Приемы и способы стрельбы из автомата</b></p><p>Стрельба из автомата может вестись из различных положений-стоя, с колена, лежа. В движении огонь можно вести на ходу и с короткой остановки.</p><p><b>Стрельба из автомата слагается</b>:</p><p class=\"li\">1. из изготовки к стрельбе</p><p class=\"li\">2. производства стрельбы (выстрела)</p><p class=\"li\">3. прекращения стрельбы.</p><p><b>Изготовка к стрельбе </b>сводится к занятию автоматчиком требуемого положения и заряжания автомата. При необходимости магазин снаряжается патронами.</p><p><b>Производство стрельбы</b> включает установку прицела, целика для, переводчика на требуемый вид огня, прикладку, прицеливание, открытие огня и удержание автомата на цели. Автоматический огонь является основным видом огня. Он ведется короткими (до 5 выстрелов) и длинными (до 10 выстрелов) очередями, а также непрерывно.</p><p><b>Для прекращения стрельбы</b> необходимо отпустить спусковой крючок и поставить оружие на предохранитель.</p><p><b>3. Роль, основные задачи и направления организации ротного (батарейного) хозяйства, их характеристика.</b></p><p>Приказ Министра обороны РФ от 03.06.2014 N 333 \"Об утверждении Руководства по войсковому (корабельному) хозяйству в Вооруженных Силах Российской Федерации\".</p><p>Статья 82. Ротное хозяйство является составной частью войскового хозяйства и его основой. Оно предназначается для обеспечения боевой подготовки, воспитательной работы и удовлетворения материальных, жилищных, бытовых и культурных потребностей военнослужащих</p><p>Статья 83. Основными задачами ротного хозяйства являются:</p><ul><li>поддержание в постоянной боевой готовности имеющейся техники и вооружения;</li></ul><ul><li>своевременное доведение до военнослужащих материальных ценностей по установленным нормам обеспечения;</li></ul><ul><li>обеспечение сохранности и правильного использования имеющихся в роте материальных ценностей.</li></ul><p>Направления организации ротного хозяйства:</p><ul><li>руководство ротным хозяйством</li></ul><ul><li>контроль за его состоянием</li></ul><ul><li>обеспечение военнослужащих положенными материальными ценностями</li></ul><p>Ротное хозяйство организует командир роты.</p><p><b>4. Героическая оборона Ленинграда (1941–1944 гг.) и её значение.</b></p><p>Блокада Ленинграда длилась с 8 сентября 1941 г. по 27 января 1944 г. (блокадное кольцо было прорвано 18 января 1943 г.) – 872 дня.</p><p><b>Ход </b>блокады<b>:</b></p><p>В конце августа 1941г. немецкие войска прорвали Лужский оборонительный рубеж и устремились к Ленинграду.</p><p>8 сентября 1941 г. противник вышел к Ладожскому озеру с севера – Финские войска, к Ленинграду с востока и юга-востока -группа армии «Север», блокировал город и часть области. К началу блокады в городе были незначительные запасы продовольствия и топлива из-за отрыва всех железнодорожных и автомобильных коммуникаций. Единственными путями сообщения оставались коммуникации только по воздуху и Ладожскому озеру.</p><p>Блокируя город немецкое руководство считало, что, перенося страдания, человек теряет волю к борьбе. Но русские её не теряли. И эта истина очередной раз была доказана блокадным Ленинградом. Хотя привычный уклад жизни был полностью нарушен, т. к. город постоянно подвергался артобстрелам и бомбёжкам, но город жил и функционировал. Люди продолжали работать, а воины, активной обороной, сковывали превосходящие силы врага. Кировский завод, производил танки, выпускал продукцию военного назначения. Дети ходили в школу и помогали взрослым в госпиталях, на заводах, дежурили на крышах домов, тушили «зажигалки», собирали металлом. Работали городские службы, в городе поддерживался порядок, сотрудники институтов приходили на работу. Позже, пережившие блокаду очевидцы, расскажут, что выживали именно те, кто продолжал вставать по утрам с кровати и что-то делал.  Их воля к жизни не угасала. И всё это на фоне хронического недоедания. С 20 ноября в результате пятого снижения суточной номы хлеба рабочие получали по 250 граммов хлеба в день, все остальные – по 125. Начался голод, от которого с ноября 1941г. по октябрь 1942г. погибло 641 803 человека. 25 декабря в связи с подвозом по «Дороге жизни» нормы стали увеличиваться. Летом 1942 года по дну озера был проложен Ладожский трубопровод для снабжения Ленинграда горючим, а осенью – энергетический кабель.</p><p><b>Значение блокады:</b></p><ul><li>Ленинград стал для всей страны примером мужества, героизма, самопожертвования ради Победы.</li></ul><ul><li>Защитники города оттянули на себя до 15–20 процентов вражеских сил на Восточном фронте, все финские войска. Поэтому, гитлеровское командование не имело возможности перебрасывать свои войска из-под Ленинграда на другие направления.</li></ul><ul><li>Расчёты немецкого командования на захват и уничтожения города полностью провалились.</li></ul><p><b>Ход и значение прорыва Блокады Ленинграда</b></p><p><b>Ход прорыва:</b></p><p>В течение 1942 г. были предпринято пять попыток прорыва блокады, но все они оказались неудачными.</p><p>В январе 1943 г. под Ленинградом была проведена стратегическая наступательная операция «Искра».</p><p>18 января войска Ленинградского и Волховского фронтов соединились, был освобождён Шлиссельбург. Южнее Ладожского озера образовался коридор шириной 8–11 км. Однако дальнейшие попытки расширить коридор закончились провалом. По южному берегу Ладоги за 18 дней была построена железная и шоссейная дороги протяжённостью 36 км. По ней пошли поезда в Ленинград. Однако полностью связь города со страной не была восстановлена. Все основные железные дороги, идущие в Ленинград, были перерезаны противником. К моменту прорыва блокады в городе оставалось не более 800 тыс. человек гражданского населения. Многие из этих людей в течение 1943 г. были эвакуированы в тыл. В летних и осенних боях 1943 г. войска Ленинградского и Волховского фронтов активными действиями сорвали попытки противника восстановить полную блокаду Ленинграда, очистили от противника Киришский плацдарм на реке Волхов, овладели мощным узлом обороны – Синявино и улучшили своё оперативное положение. Боевая активность наших войск сковала около 30 вражеских дивизий.</p><p>Окончательный разгром немецко-фашистских войск под Ленинградом и полное снятие блокады города произошло в начале 1944 г. В январе – феврале 1944 г. советские войска провели стратегическую Ленинградско-Новгородскую операцию. 14 января войска Ленинградского фронта, взаимодействуя с Балтийским флотом, перешли в наступление. 20 января был освобожден Новгород. К концу января были освобождены города Пушкин, Красногвардейск, Тосно, немецкие войска были отброшены от Ленинграда на расстояние 60—100 км. 27 января 1944 г. блокада Ленинграда, продолжавшаяся 872 дня, была полностью ликвидирована. В этот день в Ленинграде был дан салют.</p><p><b>Значение прорыва:</b></p><ul><li>Прорыв блокады позволил увеличить подачу в город электроэнергии, наладить поставки в город хлеба и продовольствия благодаря чему были подняты нормы выдачи их населению.</li></ul><ul><li>В ходе обороны г. Ленинграда было разгромлено до 50 немецких дивизий.</li></ul><ul><li>В результате операции «Искра» окончательно были сорваны планы германского командования соединиться с финскими войсками.</li></ul><ul><li>Правительством СССР 22.12.1942г. была учреждена медаль «За оборону Ленинграда».26.01.1945г. Президиум Верховного Совета СССР наградил Ленинград орденом Ленина, 8 мая 1965г. присвоил Ленинграду почетное звание города-героя.</li></ul>", "21": "<p><b>1. Чем достигается воинская дисциплина и обязанности командира по поддержанию воинской дисциплины (статьи 4, </b>6–7<b>).</b></p><p><b>Воинская дисциплина достигается:</b></p><ul><li>воспитанием у военнослужащих морально-психологических, боевых качеств и сознательного повиновения командирам (начальникам);</li></ul><ul><li>знанием и соблюдением военнослужащими законов, требований общевоинских уставов и норм международного гуманитарного права;</li></ul><ul><li>личной ответственностью каждого военнослужащего за исполнение обязанностей военной службы;</li></ul><ul><li>поддержанием в воинской части (подразделении) внутреннего порядка всеми военнослужащими;</li></ul><ul><li>четкой организацией боевой подготовки и полным охватом ею личного состава;</li></ul><ul><li>повседневной требовательностью командиров (начальников) к подчиненным и контролем за их исполнительностью</li></ul><ul><li>созданием в воинской части необходимых материально-бытовых условий</li></ul><p><b>Чтобы поддерживать воинскую дисциплину, командир обязан:</b></p><ul><li>Изучать личные качества подчиненных</li></ul><ul><li>Поддерживать правила взаимоотношений между ними</li></ul><ul><li>Сплачивать воинский коллектив</li></ul><ul><li>Знать состояние воинской дисциплины и морально-психологическое состояние личного состава</li></ul><ul><li>Добиваться единого понимания приказов и требований</li></ul><p><b>2. Правила и способы стрельбы из пистолета (ПМ).</b></p><p>Стрельба из пистолета складывается из выполнения следующих приемов:</p><p>—<b> изготовки к стрельбе</b> (заряжание пистолета, принятие положения для стрельбы);</p><p>—<b> производства выстрела</b> (прицеливание, спуск курка);</p><p>—<b> прекращения стрельбы</b> (прекращение нажатия на хвост спускового крючка, включение предохранителя, т. е. перевод его в положение «предохранение», разряжение пистолета).</p><p>В бою огонь из пистолета ведется самостоятельно.</p><p>Для выполнения приемов стрельбы, обеспечивающих наибольшую меткость и удобство действий стреляющего, каждый военнослужащий должен в: зависимости от своих особенностей выработать наиболее выгодное и устойчивое положение для стрельбы, добиваясь при этом однообраз­ного положения рукоятки в руке и наиболее удобного положения корпуса, рук и ног.</p><p><b>3. Виды материального обеспечения </b>военнослужащих,<b> их краткая характеристика.</b></p><p>Материальное обеспечение военнослужащих:</p><ul><li><b>продовольственное обеспечение</b> (организация питания по месту службы, выдача пайков)</li></ul><ul><li><b>вещевое обеспечение</b> (обеспечение вещевым имуществом в зависимости от условий прохождений военной службы)</li></ul><ul><li><b>денежное довольствие</b></li></ul><ul><li><b>обеспечение жилыми помещениями</b> (накопительно-ипотечная система)</li></ul><ul><li><b>медицинское обслуживание</b> (создание благоприятных условий военной службы – охрана здоровья. Военнослужащие 1 раз в год проходят диспансеризацию)</li></ul><ul><li><b>торгово-бытовое обслуживание</b> (бани, ремонт обуви, услуги Военторга)</li></ul><p><b>4. Освобождение стран Европы Красной армией.</b></p><p><b>Красная Армия выполнила освободительную миссию</b> – вернула свободу 10 странам Центральной и Юго-Восточной Европы с населением 113 млн. чел.: Румынии, Болгарии, Венгрии, Югославии, Польши, Чехословакии, Австрии, Дании, Норвегии Германии. Безвозвратные потери Красной армии при освобождении европейских стран составили около одного миллиона солдат и офицеров.</p><p><b>Потери в ходе освобождения Европы</b> (тыс. чел.) в: Польше - 600,2; Чехословакии - 139,9; Венгрии - 140,0; Германии - 102,0; Румынии - 69,0; Австрии - 26,0; Югославии - 8,0;</p><ul><li>В результате Ясско-Кишиневской операции, проведенной с 20 по 29 августа 1944 года, была уничтожена немецко-румынская группировка войск и освобождена территория Молдавии.</li></ul><ul><li>Освобождение Болгарии прошло практически бескровно. В ходе Болгарской операции, проведенной 5–9 сентября 1944 года, в стране 9 сентября произошло народное восстание. Профашистское правительство было свергнуто и образовано правительство Отечественного фронта. В дальнейшем оно объявило войну Германии и ее союзнику – Венгрии.</li></ul><ul><li>28 сентября 1944 г.  в ходе Белградской операции Красная армия начала штурм Белграда, в котором также участвовали югославские партизаны. 20 октября 1944 года столица Югославии была полностью освобождена от захватчиков.</li></ul><ul><li>Северная Норвегия была освобождена в результате Петсамо-Киркенесской наступательной операции, которая была проведена с 7 по 29 октября 1944 года.  В ней участвовали войска Карельского фронта и Северного флота ВМФ СССР.</li></ul><ul><li>Литва, Эстония и Латвия были освобождены от фашистов в ходе Белорусской (23 июня – 29 августа 1944 года) и Прибалтийской (14 сентября – 24 ноября 1944 года) наступательных операций.</li></ul><ul><li>С 29 октября 1944 года по 13 февраля 1945 года была проведена Будапештская наступательная операция, в которой принимали участие войска 2-го и 3-го Украинских фронтов. Кровопролитные бои за Будапешт продолжались полтора месяца.</li></ul><ul><li>В ходе Висло - Одерской стратегической наступательной операции, проведенной силами 1-го Белорусского и 1-го Украинского фронтов, продлившейся с 12 января по 3 февраля 1945 года была освобождена Польша.</li></ul><ul><li>Венская наступательная операция началась 16 марта 1945 года и продлилась до 15 апреля. В ней участвовали войска 2-го, 3-го Украинских фронтов и Дунайская военная флотилия. В ходе этой операции была освобождена Австрия.</li></ul><ul><li>Пражская наступательная операция, длившаяся с 6 по 11 мая 1945 года, была освобождена Чехословакия</li></ul><p><b>Значение освобождения</b>: Европа была освобождена от фашизма благодаря героическим сверхусилиям СССР и его союзников, борьбе сил Сопротивления на оккупированных фашистами территориях. Германская военная машина была сломлена и побеждена.</p>", "22": "<p><b>1. Поощрение: определение, сущность, виды поощрений (статьи </b>17–19<b>)</b></p><p><b>Поощрения являются важным средством воспитания военнослужащих</b> и укрепления воинской дисциплины. Форма отличия военнослужащих, проявивших усердие в службе и достойно выполнивших свой долг</p><p>Командир обязан поощрять подчиненных за особые личные заслуги, личную инициативу или усердие и отличие по службе.</p><p><b>19</b>. К военнослужащим могут применяться следующие виды поощрений:</p><ul><li>снятие ранее примененного дисциплинарного взыскания;</li></ul><ul><li>объявление благодарности;</li></ul><ul><li>сообщение на родину военнослужащего об образцовом выполнении им воинского долга и о полученных поощрениях;</li></ul><ul><li>награждение грамотой, ценным подарком или деньгами;</li></ul><ul><li>награждение личной фотографией военнослужащего, снятого при развернутом Боевом знамени в/ч;</li></ul><ul><li>досрочное присвоение очередного воинского звания, но не выше воинского звания, предусмотренного штатом для занимаемой воинской должности;</li></ul><ul><li>присвоение очередного воинского звания на одну ступень выше воинского звания, предусмотренного штатом для занимаемой воинской должности;</li></ul><ul><li>награждение нагрудным знаком отличника;</li></ul><ul><li>занесение в Книгу почета в/ч фамилии отличившегося военнослужащего;</li></ul><ul><li>награждение именным холодным и огнестрельным оружием.</li></ul><p><b>2. Назначение и виды ручных осколочных гранат. Устройство гранат.</b></p><p>Ручные осколочные гранаты предназначены для поражения осколками живой силы противника. При разрыве граната образует большое количество разлетающихся осколков, обладающих энергией, достаточной для поражения живой силы.</p><p>Виды: наступательные, оборонительные.</p><p>Основные части: корпус, запал, разрывной заряд, чека</p><p>Ручные осколочные гранаты РГН и РГО состоят из корпуса, заряда взрывчатой смеси, детонационной шашки и запала.</p><p><b>3. Организация питания военнослужащих в столовых воинской части.</b></p><p>Для обеспечения питанием военнослужащих штатами воинских частей предусматриваются столовые, которые по технологическому процессу приготовления пищи подразделяются на <b>столовые полного цикла, фабрики-столовые, </b>доготовочные<b>, раздаточные.</b></p><p>Суточный наряд в столовую воинской части для выполнения подсобных работ назначается из расчета: <b>до 100 человек, питающихся в столовой, - 3–4 человека</b>, на каждые последующие 75 человек - дополнительно выделяется по 2 человека.</p><p>Ответственность за организацию питания несут командиры воинских частей.</p><p><b>Командир воинской части обеспечивает на объектах продовольственной службы</b>: Выполнение требований санитарного законодательства; Проведение медицинской службой воинской части объективных методов контроля</p><p><b>Начальник столовой воинской части организует:</b></p><ul><li>Своевременное и качественное приготовление пищи</li></ul><ul><li>Правильную эксплуатацию и сохранность технологического инвентаря столовой</li></ul><ul><li>Соблюдение требований санитарных правил и норм при приготовлении пищи</li></ul><ul><li>Содержание столовой в образцовом состоянии</li></ul><p>К часу, установленному распорядком дня, приготовление пищи должно быть закончено. До начала раздачи пищи врач совместно с дежурным по полку должен проверить качество пищи, произвести контрольные взвешивания порций, а также проверить санитарное состояние помещений столовой. После этого пищу пробует командир полка. Результаты проверки записываются в книге учета контроля за качеством приготовленной пищи. В установленное время дежурный по полку дает разрешение на выдачу пищи.</p><p><b>Питание военнослужащих в столовых может быть организовано методом:</b></p><ul><li>Сервировки столов;</li></ul><ul><li>С использованием линий самообслуживания с выдачей готовой пищи поварами;</li></ul><ul><li>С использованием линий самообслуживания с элементами \"шведского стола\"</li></ul><p>Прием пищи в головных уборах, пальто (зимних полевых костюмах) и специальной (рабочей) одежде не допускается.</p><p><b>4. Открытие в Европе второго фронта.</b></p><p>В ходе Тегеранской конференции в ноябре-декабре 1943 г. вопрос о сроках открытия второго фронта был решен. Союзники согласились высадить свои войска во Франции в мае 1944 г.</p><p>Фронт вооруженной борьбы США и Великобритании,
